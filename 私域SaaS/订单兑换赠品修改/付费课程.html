><main class="main" id="main"></main></div></div><div id="overlay"></div><div id="floating"></div><script>

const defaultLogic="# 1. 业务背景\n\n## 1.1 需求描述\n\n为敏宝家庭提供视频课程陪伴服务，支持免费学习与整课付费购买。运营在后台维护课程、分类、章节及试看内容，用户在小程序选课、试看、使用优惠券或积分抵扣、提交订单并支付，支付成功后解锁整门课程，后续从“我的课程”继续观看。\n\n付费课程复用平台已有供应商、支付配置、支付分账、积分权益和订单管理体系，新增“课程”分账场景、“课程支付”交易类型及独立课程订单入口。\n\n**文档基准**：2026-11-10 版本草稿原型 `付费课程.html`。本文为整合后的有效规则，覆盖此前迭代说明中的旧口径。页面交互已通过原型逻辑检查；不代表真实支付、真实分账、服务端视频鉴权或正式积分系统已接入。\n\n## 1.3 目标结果\n\n1. 跑通“课程专栏 → 课程详情 → 免费试看 → 确认订单 → 订单支付 → 支付成功 → 解锁课程 → 我的课程 → 继续观看”。\n2. 免费课程无需下单，点击观看后加入我的课程。\n3. 前后台课程订单统一为“待付款、已完成、已关闭”，订单与学习进度分别管理。\n4. 运营能够查看付费人数、现金实付金额、成交明细和课程分账记录。\n5. 课程分类、上下架、支付渠道、积分适用范围及规则时间在前后台保持一致。\n\n## 1.4 本期范围\n\n| 端 | 页面入口 | 本期内容 |\n| --- | --- | --- |\n| PC | 内容中心－课程管理 | 搜索、统计、新增、编辑、查看、上下架、复制、删除、批量操作、日志 |\n| PC | 课程管理－课程分类 | 独立一级分类维护、排序、启停 |\n| PC | 课程管理－课程数据统计明细 | 课程、用户、付费记录、付费金额查询与导出 |\n| PC | 订单中心－课程订单 | 列表、详情、备注、优惠明细、分账弹窗、日志、导出 |\n| PC | 订单中心－支付分账 | 课程场景公式及按供应商收款配置 |\n| PC | 订单中心－支付配置 | 新增课程支付交易类型及支付渠道联动 |\n| PC | 积分中心－权益规则 | 消耗规则课程适用范围、积分发放规则、默认规则及逐项定时规则配置 |\n| 小程序 | 课程专栏、课程详情、视频学习 | 分类浏览、搜索、试看、购买、观看及进度恢复 |\n| 小程序 | 确认订单、订单支付、支付结果 | 单券、积分抵扣、备注、须知、支付倒计时及结果处理 |\n| 小程序 | 我的课程、课程订单、订单详情 | 学习入口与交易入口分离，继续支付、取消订单、观看课程、重新购买 |\n\nPC 仅保留首页及本期涉及的菜单，不恢复商城、用户、商品、营销菜单。小程序页面通过后台一级菜单“微信小程序”进入，在内容区展示手机画布；不显示画布右侧流程说明。\n\n## 1.5 本期不做\n\n1. 按章节单独定价、购买或补差价购整课。\n2. 限时试看、观看有效期配置、会员订阅、训练营、直播、作业考试。\n3. 实物规格、购买数量调整、收货地址、仓库、物流、运费、税费、发货、收货及售后操作。\n4. 前台多张优惠券叠加：本期确认页一次仅选一张；后台保留多券记录展示能力，叠加门槛、顺序、互斥规则待确认。\n5. 课程购买自动奖励积分：是否参与、奖励基数、发放时点待确认；积分发放页面本期为规则配置演示。\n6. 真实资金支付、商户入网、真实分账执行、对账、生产视频服务和账号登录授权接入，不属于单文件原型的已实现能力。\n\n---\n\n# 2. 关键业务规则\n\n## 4.1 唯一性 / 并发性\n\n1. 课程、课程分类、收款配置、支付配置、订单、操作日志均以独立ID识别；编辑按ID回填，不以名称作为记录标识。\n2. 课程分类名称去除首尾空格后不可重复，课程名称不要求全平台唯一。\n3. 同一供应商编码与分账场景的组合只能存在一条收款配置。\n4. 同一用户已获得某付费课程权益后，不再重复购课，购买入口转为观看。\n5. 存在同课程有效待付款订单时，重新点击购买优先进入该订单支付页；重复点击提交不重复建单。\n6. 支付成功处理幂等：同一订单不得重复扣积分、核销优惠券、发放课程权益或生成完成记录。\n7. 待付款订单占用已选优惠券与积分；其他订单仅可使用未占用余额。取消微信支付、支付失败不释放占用；主动取消订单或超时关闭释放占用，成功支付转为实际使用。\n8. 原型已处理同毫秒新建记录ID冲突；生产环境需以服务端唯一约束、事务与支付单幂等保证并发一致性，不以页面检查替代。\n\n## 4.2 字段定义\n\n### 4.2.1 课程管理列表与统计\n\n**搜索字段**：课程名称模糊搜索；课程类型、后台分类、状态精确筛选。更多搜索含课程ID、创建日期、课程分类。多条件为AND；重置清空条件。\n\n**状态搜索**仅“全部、上架、下架”，不使用状态Tab，也不单列草稿。\n\n**列表字段**：勾选、课程封面/名称/ID、供应商编码、课程类型、后台分类、课程分类、章节数、售价、付费人数、状态开关、创建人及时间、更新人及时间、操作。\n\n1. 状态列仅显示开关，不显示“上架/下架”文字；开启为上架、关闭为下架。\n2. 上架课程操作：编辑、下架、复制、日志；下架课程操作：编辑、上架、复制、删除、日志。编辑和状态操作行内展示，其余收入更多菜单。\n3. 支持当前页全选、半选、选中数量及批量上下架、删除。上架课程不可删除；下架课程可软删除。\n4. 默认每页15条，可选30、50条；按创建时间倒序排列。\n5. 列表不提供导出；新增旁提供“课程分类”配置入口。\n6. 顶部数据卡展示累计付费人数和付费金额，附更新时间、刷新与“查看数据”入口，不随课程列表搜索条件变化。\n7. 付费人数可点击，进入数据统计明细并预填当前课程ID；“查看数据”默认查全部课程。\n\n**统计明细**：课程信息、用户信息、付费记录、付费金额四组字段；支持用户ID/手机号、昵称、课程、付款日期筛选，默认20条/页，可选30、50条。订单编号跳转对应后台课程订单详情。\n\n### 4.2.2 课程新增 / 编辑 / 详情\n\n基础信息字段顺序如下：\n\n| 字段 | 是否必填 | 默认与限制 | 展示与联动 |\n| --- | --- | --- | --- |\n| 课程名称 | 是 | 新增为空，最多50字 | 列表、详情、订单及前台展示 |\n| 后台分类 | 否 | 选择现有商品中心分类管理中的分类 | 内部管理分类，原型使用共享模拟分类库，不展示来源说明 |\n| 课程分类 | 否 | 单选已启用课程分类，默认空 | 用于小程序内容分类，与后台分类独立 |\n| 讲师姓名 | 否 | 默认空，最多20字 | 未填写时前台不显示讲师占位 |\n| 课程封面 | 上架必填 | JPG/PNG，最大5MB，建议16:9 | 上传后预览；内置示例封面按已有封面处理 |\n| 课程简介 | 否 | 富文本，默认空 | 位于课程详情字段之前；填写后显示在前台课程标题下，未填写隐藏，无额外默认宣传文案 |\n| 课程详情 | 上架必填 | 富文本，默认空 | 小程序课程介绍展示 |\n\n富文本框使用白底、浅灰细边框、紧凑图标工具栏和较宽编辑区域。支持正文/标题/引用、加粗、斜体、下划线、列表、对齐、清除格式、图片、撤销重做及全屏编辑。图片支持PNG/JPG/WebP，原型单张最大2MB；粘贴正文按纯文本处理，保存清理不支持的标签与属性。富文本总长度、总图片数量与总内容大小上限待确认，不沿用旧版500字简介限制。\n\n价格信息字段：\n\n| 字段 | 是否必填 | 默认与限制 | 展示与联动 |\n| --- | --- | --- | --- |\n| 课程类型 | 是 | 新增默认付费；免费/付费 | 已产生已支付订单后禁止变更类型 |\n| 供应商编码 | 付费时是 | 从既有供应商中单选 | 仅付费课程显示，移入价格信息；免费课保存不关联供应商 |\n| 课程售价 | 付费上架必填 | 0.01—99999.99元，最多2位小数 | 免费课程价格为0 |\n| 课程划线价 | 否 | 仅付费显示，非负金额，最多2位小数 | 前台未购课程列表/详情展示删除线；已购详情隐藏 |\n| 虚拟销量 | 否 | 默认空，非负整数 | 仅作为前台销量展示参数，不进入后台付费统计 |\n\n不再配置“观看有效期”。课程简介、虚拟销量下不显示解释说明。划线价是否必须大于售价目前未限制，待确认。\n\n章节配置：\n\n1. “添加章节”位于表格上方；表格含排序、章节名称、视频、免费试看及操作。免费课程不展示试看勾选列。\n2. 上架至少1个章节；章节名称必填、最多50字；视频必填且时长大于0。支持MP4/WebM、本地上传及原型演示视频。\n3. 章节可上下移动排序、删除；删除需确认。课程已售后不可删除原有章节，可追加章节，修改标题和试看标记。\n4. 付费课程至少1个免费试看章节，试看为整章免费，不配置试看秒数；移除界面说明不取消校验。\n5. 视频大小、编码、清晰度与单课章节数上限待确认；原型没有实现生产转码与上传进度服务。\n\n发布设置：\n\n1. 单选“立即上架、保存草稿”，默认保存草稿；不展示下方说明。\n2. “保存草稿”为保存操作，最终列表状态记为下架，不新增第三种课程状态。\n3. 保存草稿需校验课程名称及价格信息中已填字段格式；付费供应商仍必填。允许暂不补齐封面、详情、章节及售价。\n4. 立即上架校验全部上架必填与试看规则。下架课程进入编辑默认按保存草稿展示，保存后仍下架，除非选择立即上架。\n5. 未保存的主表单返回、关闭或切换页面时需确认；校验失败保留输入并定位字段错误；保存成功回到列表。\n6. 查看详情只读；编辑进入独立页签。分区锚点在配置区域右侧，随页面滚动保持可用，点击定位分区顶部。\n\n### 4.2.3 课程分类配置\n\n1. 入口为“课程管理－课程分类”，不恢复商品中心菜单。\n2. 分类名称必填、20字以内、去除首尾空格后唯一；排序非负整数；状态默认启用。\n3. 支持新增、编辑、上移、下移、启停；按排序升序展示，排序相同按ID稳定排列。\n4. 停用需确认，仅隐藏前台分类入口并禁止新课程选择，不下架关联课程，不清除原关联，不影响已有权益。\n5. 列表展示排序、名称、关联未删除课程数、状态开关、更新时间、操作。本期无分类删除入口。\n\n### 4.2.4 后台课程订单\n\n**搜索**：关键词匹配订单号、课程名称/ID、用户ID、昵称、手机号；时间可选创建/付款时间及起止时间，快捷选今天、昨天、近7天、近30天；其他条件含用户ID/昵称、课程名称/ID。去掉供应商编码、支付方式、仓库、物流、售后搜索。状态Tab为全部、待付款、已完成、已关闭。\n\n**列表**：按订单分组头展示订单号、创建时间、课程订单标签、后台备注；明细含课程封面/名称/ID、单价、数量1、优惠、应付金额、用户信息、订单状态及详情入口。课程列不展示讲师、章节。\n\n优惠列仅在实际使用时显示：\n\n- 优惠券单行：“券ID / 券名称 / 优惠 ¥10.00”。\n- 积分：“抵扣积分：¥75.00”，不展示消耗积分数量。\n- 未使用优惠券或积分时不展示对应记录或“未使用”提示。\n\n列表只有一个“导出”入口，无新增订单、商品导出。默认15条/页，可选30、50条，创建时间倒序。\n\n**详情**：\n\n1. 状态进程展示创建、付款、课程解锁、订单完成；关闭订单展示创建与关闭。完成指交易完成，不代表课程看完。\n2. 订单信息含主单编号、订单编号、订单类型、创建/付款时间、支付方式、支付单号、交易流水号、支付状态、已使用优惠券、优惠券优惠金额、积分抵扣、使用积分、买家备注、后台备注。已使用优惠券合并名称与ID，多张换行；去掉供应商编码。不再保留独立“优惠券使用记录”区域。\n3. 用户信息含用户ID、昵称、手机号、订单邀请人、订单邀请渠道、unionid、openId、external_userid、系统标签；不展示订单来源；无数据展示“—”。\n4. 课程信息含封面/名称/ID、分账信息查看、订单状态、单价、数量1、原总价、课程优惠、实付总价；无讲师、章节、供应商编码。\n5. 课程优惠逐行展示：“积分抵扣：¥75.00”“优惠券抵扣：（优惠券名称/100713）¥75.00”，无优惠显示“—”。\n6. 底部汇总应付/实付金额，并列出订单日志。未付款或关闭订单实付为0，原应付金额保留。\n7. 分账信息弹窗含账户名称、分账账号、分账金额、分账状态；未支付无分账记录，已支付但无配置时显示无记录。\n8. 后台备注最多200字，仅后台可见，保存后写日志；不改写买家备注。\n\n### 4.2.5 支付分账与支付配置\n\n**支付分账**：按供应商名称、编码、分账场景筛选；列含ID、供应商名称/编码、场景、连连/微信分账方与商户号、创建/更新时间、操作。支持新建、编辑、删除、操作记录，默认20条/页，可选50条。\n\n**分账设置**：\n\n1. 保留原有大贸、保税、直邮、积分、赠品场景，新增“课程”。\n2. 可选分账方：供应商货款、售后赔付金、跨境综合税、平台佣金、平台差价、技术服务费、平台服务费（支付手续费）。勾选后配置该方公式，不显示“选择需要参与当前场景分账的分账方”说明。\n3. 公式项支持订单实付金额、非负固定数值及加减乘除，支持增删、左右移动、试算；不得缺项、连续操作符、除零或产生负数。\n4. 示例供应商80%、平台20%只是模拟初值，不视为正式业务比例。\n\n**新建/编辑收款**：供应商编码必填并自动带出名称；分账场景单选且单行排列，选择课程读取已保存的分账方、公式；按分账方填写连连、微信收款商户号。至少完整配置一个渠道，一个渠道只要填写就必须补齐全部分账方。商户号原型校验1—32位字母、数字或下划线，生产格式以接入渠道为准。移除渠道成组填写的说明文案，但保留校验。\n\n**支付配置**：\n\n| 字段 | 必填/默认 | 限制 |\n| --- | --- | --- |\n| 支付名称 | 必填、默认空 | 最多50字 |\n| 支付通道 | 必填 | 微信支付/连连微信支付 |\n| 交易类型 | 必填 | 普通、直邮、跨境、积分、赠品商品支付，新增课程支付 |\n| 收款主商户号 | 必填 | 最多50字 |\n| Appkey | 选填 | 最多50字 |\n| AppSecret | 选填 | 最多80字，密码样式输入，不写入日志 |\n| 营销账户 | 默认关闭 | 开关 |\n| 支付方式 | 默认启用 | 开关 |\n\n列表支持名称、状态筛选和新增、编辑、启停、删除、日志；默认20条/页，可选50条。停用/删除需确认。\n\n### 4.2.6 积分消耗规则\n\n默认列表保留下单抵扣比例、通用抵扣规则、特殊人群规则，展示默认规则、优惠承担、定时规则时间及状态、更新记录和操作。默认规则不设置起止时间；定时配置从每项操作进入。\n\n1. 抵扣比例为正整数R，表示R积分=1元；平台承担比例为0—100%，供应商比例自动补足至100%。\n2. 通用与特殊规则分别有启停、订单金额门槛、抵扣上限、参与商品、付费课程。门槛可不限或满指定金额；上限可不限、指定金额或指定百分比，限制值大于0，百分比不超过100%。\n3. 参与商品为全部、指定类型、指定商品；可填写不参与商品。商品ID以数字校验，多个逗号分隔；指定类型至少1个，指定商品至少1个有效格式ID。原型未查询真实商品库。\n4. 付费课程单选参与/不参与，默认不参与；商品范围不自动包含课程。参与后选全部付费课程或指定付费课程；原型首次指定范围默认空，可切换全部。\n5. 全部付费课程动态包含新增课程。指定范围只在表单显示已选数量及选择/修改入口，不铺开长ID文本。\n6. 课程选择弹窗仅可选择未删除的付费课，支持名称/ID、后台分类、上下架搜索，分页10/20/50条、跨页保留、当前页全选和半选、查看已选、移除、清空。\n7. 批量粘贴支持逗号、中文逗号、空白或换行分隔，自动去重，分别提示重复、无效、免费、已删除课程；合法部分可加入。失效已选项可移除，不能被全选加入。\n8. 弹窗确定回写外层草稿，取消不修改原选择；外层保存才持久化。指定范围至少1门有效付费课；不参与或关闭规则时，隐藏选择不触发校验。\n9. 特殊规则另需选择参与用户群，原型为敏宝家庭会员、新用户家庭、高活跃家庭。通用与特殊范围独立保存。\n10. 默认规则单项编辑只编辑本项；编辑全部可修改三项，均不展示生效设置，保存后长期有效。临时配置从本项“设置/修改定时规则”操作进入，每项只保留一套。\n11. 字段标签不换行、统一对齐，不展示已移除的北京时间说明。\n\n### 4.2.7 积分发放规则\n\n1. 默认列表展示任务名称、默认配置、定时规则时间及状态、更新记录及操作；每项操作维护本任务的一套定时配置，全部任务均展示，未启用的默认规则显示“未开启”，可直接设置定时规则，无需启用默认规则。列表分页默认5项/页，可选5、10、20项，展示总数、当前页及上一页/下一页；编辑保存后保留当前页。\n2. 编辑默认规则保留任务勾选：个人信息、宝宝信息、手机号、添加企微、商品评价、累计下单、单笔购买；不设置时间，长期有效。定时配置按具体任务分别建立。\n3. 单项编辑采用独立“积分发放权益编辑”弹窗，仅保存该项。单笔购买/累计下单支持每满金额（大于0）、参与商品不限/部分参与/部分不参与、指定商品ID、规则开关、发放积分（正整数）、说明（选填100字以内）；默认配置无生效设置。定时任务另需起止时间。\n4. 未勾选任务不启用；单项关闭规则后不再处于已启用列表，配置仍保留。\n5. 移除“北京时间，精确到时分秒……”及“各任务独立设置生效时间……”两条说明，不移除“说明”业务字段。\n6. 发放规则本期只完成配置存储；不据此宣称购课后已真实增加奖励积分。\n\n### 4.2.7.1 逐项定时规则（2026-11-10 调整）\n\n1. 移除独立定时规则列表入口，每项只保留一套定时配置。\n2. 未配置操作：编辑默认规则、设置定时规则。已配置操作：编辑默认规则、修改定时规则；列表不再提供直接启用/禁用。列表仅显示一个综合状态：无配置为“未配置”；禁用优先显示“已禁用”；启用后按时间显示“待生效／生效中／已结束”。已启用配置的状态下方保留起止时间；已禁用只显示“已禁用”，隐藏时间，不再重复显示“已启用”。\n3. 弹窗直接锁定当前规则，不填写名称、不选择覆盖项。首次设置配置当前项规则、生效时间、失效时间（到秒），默认启用且不显示定时规则状态字段；修改已保存配置时显示“定时规则状态（启用／禁用）”，回填原状态。选择禁用时隐藏生效、失效时间并保留原值，保存跳过时间校验；切回启用时显示并回填原时间。\n4. 消耗规则分别对应抵扣比例、通用规则、特殊人群规则；积分发放分别对应具体任务。两类操作一致。未开启的发放任务首次设置定时规则时，定时任务开关默认开启，默认规则仍保持未开启；时段开始后发放，到期恢复未开启。\n5. 启用时校验起止时间必填且有效，结束须晚于开始且晚于当前时间；禁用时跳过时间校验。已到期配置可直接禁用，或修改时间再启用。\n6. 允许修改正在生效的配置，保存后影响后续业务，已提交订单保留当时快照。取消不保存。\n7. 修改弹窗选择禁用并保存后，立即恢复默认规则，保留原配置；未配置、未开始、到期同样执行默认规则。到期不自动删除。\n8. 默认编辑和编辑全部只修改默认规则，不设置起止时间，不影响定时配置。特殊人群优先级沿用既有规则。\n9. 旧版多条定时配置先备份，同项优先保留当前生效的一条，否则保留最近更新的一条，其余归档，不影响历史订单。\n10. 当前为迭代草稿，保留修改前原型和文档，未合入全量原型库。\n\n### 4.2.8 小程序页面字段与文案\n\n| 页面 | 内容与交互 |\n| --- | --- |\n| 课程专栏 | 关键词、课程分类、全部/免费/付费筛选；全部分类按分类分组；卡片封面、标题、可选讲师、课时及价格/权益文案 |\n| 课程详情 | 封面、标题、可选富文本简介、可选讲师、课时、价格/已购提示、介绍/目录、底部主操作 |\n| 视频学习 | 视频/演示画面、播放暂停、进度条、倍速、章节目录、下一节、购买解锁或我的课程入口 |\n| 确认订单 | 整门课程、原价、优惠券、积分抵扣、订单备注、购买须知勾选、总计、提交订单；数量固定1 |\n| 订单支付 | 应付金额、30分钟倒计时、可用支付渠道、确认支付；0元显示优惠抵扣支付 |\n| 支付结果 | 成功/未完成/取消本次支付/已关闭、查看订单、去首页、开始观看或继续支付/重新购买、其他课程推荐 |\n| 我的课程 | 内容分类与全部/已购/免费组合筛选，最近学习倒序，章节位置与进度；头部课程订单入口 |\n| 课程订单 | 全部/待付款/已完成/已关闭，订单卡片、金额、对应操作；仅当前用户自己的付费课订单 |\n| 前台订单详情 | 状态、课程、实付/应付、原价及优惠、订单号、下单/付款时间、支付方式、备注、关闭时间和原因 |\n\n文案规则：\n\n1. 免费课程列表始终“免费观看”，不显示已加入，也不显示“X人已购”。详情无进度“免费观看”，有进度“继续观看”。\n2. 未购买付费课程显示售价、选填划线价、展示销量及“免费试看”。已购买列表显示“已购买”；已购详情隐藏售价/划线价，显示“已购买 · 全部章节已解锁”。\n3. 我的课程无观看进度显示“开始观看”，已有播放秒数或完成标记显示“继续观看”，不以是否达到1%判断。\n4. 我的课程只展示已获权益课程。免费课点击开始观看加入；付费课支付成功加入，未付款不加入。\n5. 课程专栏分类为全部及启用分类；未分类/停用分类下课程在全部中的“其他课程”展示。我的课程只显示用户已有课程涉及的启用分类，保留其他课程；默认仍按最近学习排序，不拆成分类区块。\n6. 确认订单中的备注最多200字，提交前必须勾选购买须知，未提交返回不创建交易订单。\n\n## 4.3 计算规则\n\n### 4.3.1 前端销量与后台统计\n\n1. 付费课程前端展示销量 = max（该课程已支付订单笔数，虚拟销量）。免费课不显示购买人数。\n2. 后台累计付费人数 = 全部已支付课程订单按用户ID去重；同一用户买多门课累计只计1人。单课程付费人数按该课程与用户ID去重。\n3. 付费金额 = 已支付订单现金实付合计；不含积分抵扣和优惠券优惠，不计待付款、失败、关闭订单。\n4. 0元全额抵扣成功订单计入成交及付费人数，现金付费金额贡献为0。名称仍沿用“付费人数”。\n5. 原型后台示例成交会计入统计和展示销量，但不向当前体验账号发放权益；正式环境不生成示例成交。\n\n### 4.3.2 优惠券与积分\n\n1. 本期先减优惠券再算积分，前台最多选1张可用券；券优惠不得超过课程原价。\n2. 券后金额P = 课程原价 − 优惠券优惠。积分门槛按P判断；满足有效特殊人群规则时优先使用特殊规则，否则使用有效通用规则，两者不叠加。\n3. 抵扣比例、通用及特殊规则分别解析当前有效配置：命中启用且处于时段的定时规则取定时值，否则取默认值。关闭、不参与或课程不在范围内不可抵扣。\n4. 可抵上限C：不限时取P；按金额时取min(P,金额上限)；按比例时取min(P,P×比例)。\n5. 最大抵扣元数U = min（floor(C)，floor(可用积分/R)）；使用积分时抵扣U元、消耗U×R积分，不使用为0。\n6. 可用积分 = 积分余额 − 其他有效待付款订单已占用积分；支付当前订单时排除本单自身占用，防止二次扣减计算。\n7. 订单应付金额 = 课程原价 − 优惠券优惠 − 积分抵扣，不得小于0，金额保留2位小数。\n8. 示例：原价99元，优惠券10元，券后89元，积分上限20%，R=10。上限17.80元向下取整为17元，使用170积分，现金实付72元。\n9. 0元订单需用户确认后完成，不调用有现金金额的支付；记录支付方式为“优惠抵扣支付”。\n10. 不可用券展示门槛未满足/已使用等原因；提交时重新校验，已不可用不静默改成无券。\n\n### 4.3.3 分账\n\n1. 以订单现金实付金额作为“订单实付金额”公式变量；先乘除后加减，固定值非负，结果按分取两位小数。\n2. 支付成功时按课程供应商、课程场景和支付渠道生成模拟分账快照；后续修改公式、商户号或课程不回算历史快照。\n3. 当前演示显示“未分账”，并不发起资金划转。0元订单没有现金待分账。\n4. 原型试算会提示分账合计与实付不一致，但尚未实现正式的总额强校验、尾差归属、通道手续费及积分/券承担方结算。上述规则待确认，不能直接作为生产结算结果。\n\n## 4.4 关键联动逻辑\n\n1. 课程保存、分类改名/排序/启停、上下架在管理页及小程序共享数据。新增课程按独立分类ID保存，不依赖分类名称匹配。\n2. 下架后不再向无权益用户开放购买；已有权益可继续学习。删除为软删除，管理与公开列表隐藏，历史订单、统计及已有观看权益保留。\n3. 已售课程类型和原有章节删除受限，避免已购权益被破坏；复制生成独立ID并默认下架。\n4. 每个页面独立页签，切换与刷新恢复对应课程/订单上下文；不可因全局当前课程变化而串课。\n5. 确认订单后点击提交才建单，并保存课程、价格、供应商、优惠、积分、买家备注、用户等交易快照。\n6. 已启用且交易类型为课程支付的配置才进入课程支付页；支付确认保存通道配置ID、名称、渠道和主商户号快照，不保存密钥到订单。\n7. 已选通道停用不暗中替换为其他通道，应提示暂不可支付，并由用户重新选择可用方式。\n8. 成功支付将订单置已完成、写入付款/解锁/完成时间、发放课程权益并扣减占用积分；后台订单与统计同步。\n9. 支付失败、取消微信支付、普通返回保持待付款，不解锁、不扣除实际积分；明确取消订单或超时才已关闭并释放优惠占用。\n10. 已关闭重新购买生成新订单，旧单保留。免费开始学习不生成订单。\n11. 观看保存最近章节、秒数、完成标记；刷新后恢复，下一节按章节顺序播放，最后一节返回课程。\n12. 课程选择器、规则单项编辑、编辑全部分层保存：弹窗确定只更新外层草稿，规则保存才持久化。\n13. 默认编辑只修改默认配置，不回写已保存定时规则。定时只覆盖选定单项；其他项仍各自解析。到期/停用自动回到对应默认配置，默认关闭则恢复不抵扣/不发放。\n\n## 4.5 异常处理规则\n\n1. 必填缺失、价格精度不符、虚拟销量负数/小数、无效分类、无章节视频、无付费试看章，阻止上架并显示对应错误。\n2. 付费供应商无效、重复供应商＋场景、渠道商户号不完整、公式不完整/除零/负数，阻止对应配置保存。\n3. 没有启用课程支付配置、已选配置停用、余额不足、券被其他有效订单占用或使用、订单过期，阻止支付；不得发放权益或产生第二次扣减。\n4. 播放失败保留位置，提示重新上传/重试；无可播放章节不得加入学习，未购访问锁定章提示购买。\n5. 前后台课程已下架/删除后，无权益用户不可通过旧入口学习免费课或发起购买；已有权益不受该状态影响。\n6. 定时未填完整、失效不晚于生效、失效不晚于当前时间均阻止保存。开始时间允许早于当前时间，只要结束仍在未来。\n7. 取消或关闭弹窗不保存；主表单未保存离开需确认。删除、下架、停用及取消订单使用明确确认交互。\n8. 原型数据写入本地空间失败时提示空间不足；正式接口错误、请求重试和幂等错误需以服务端返回为准。\n\n## 4.6 权限规则（按需）\n\n1. 后台课程配置、支付、分账、积分和导出沿用平台现有对应模块权限；原型未实现角色鉴权及无权限拦截。\n2. 前台课程订单仅当前登录用户可查；不得展示后台其他用户示例订单。生产接口必须验证订单归属及课程权益，不能只靠隐藏按钮。\n3. 未购付费课只能访问试看章节，已购后解锁全部；免费课按公开状态访问，已有学习权益保留。\n4. 用户身份使用原平台账号体系。原型只使用模拟用户及脱敏手机号，不要求新增实名认证流程。\n5. 具体角色、导出权限及敏感用户标识可见范围待按现有权限模型确认。\n\n## 4.7 时效与有效期（按需）\n\n1. 订单支付窗口为提交后30分钟，显示剩余分秒；超时自动关闭并记录原因，不从每次重试重新起算。\n2. 原型在支付页倒计时和订单列表/详情查询时检查超时；生产环境需服务端定时关单，不能依赖用户打开页面。\n3. 默认规则保存后长期有效，无生效/失效时间。定时规则必须填写起止时间，精确到秒，按北京时间解释；有效区间为开始时间≤当前时间＜失效时间。\n4. 同一种规则类型、同一覆盖项的启用定时配置禁止时间重叠，未开始记录也参与冲突校验；相邻时段端点相同允许衔接，不同项互不冲突。停用记录不阻止排期，再启用时重新校验。\n5. 未开始、已结束、已停用或没有定时配置时执行对应默认值；不采用“恢复上一临时版本”。已提交订单保存当时的抵扣比例、承担比例、命中项、规则来源及配置快照，不因后续生效或失效重算；同步记录单笔购买奖励规则快照，但不实际发放奖励积分。\n6. 不提供课程观看有效期字段，也不展示长期有效文案；目前权益未设置自动到期。未来课程停服或内容撤下处理另行确认。\n\n## 4.8 数据来源（按需）\n\n1. 课程与章节由课程管理维护；后台分类来自现有商品分类管理，课程分类来自本次独立课程分类库。\n2. 供应商编码来自现有供应商库，名称自动带出；不允许自造编码绕过选择。\n3. 支付、分账、积分页面复用现有业务模型，新增课程场景；用户标识来自现有账号系统，无来源不虚构。\n4. 历史课程/价格/优惠/分账信息取订单快照，课程当前状态和分类可取最新配置；快照与实时字段不能混淆。\n5. 原型课程订单、权益、进度、配置、演示积分余额、页面上下文保存在当前浏览器；不跨账号、设备或浏览器同步。\n6. 原型初始积分余额1000、两张课程优惠券、示例课程、示例历史订单、演示支付配置均仅供验证，不是正式业务默认值。无课程支付配置时一次性生成DEMO商户号演示配置，不表示真实收款能力。\n7. 已上传本地视频使用临时链接，刷新后需重新选择；课程元数据和图片持久化不代表视频文件已上传到正式存储。\n\n## 4.9 通知机制（按需）\n\n1. 原型提供保存、校验、上下架、选课、提交、支付、取消与超时的页面反馈。\n2. 不发送短信、订阅消息、企微通知、邮件，不自动向外部人员发送消息。\n3. 正式支付结果以服务端验签回调为准；回调成功与前台返回不一致时，应查询支付单并重试解锁，不要求重复付款。该回调补偿尚未接入原型。\n\n## 4.10 上限与极限（按需）\n\n1. 一门课一次整课购买、数量固定1；课程分类为一级、单选。\n2. 名称、金额、图片、备注、说明限制按4.2执行；ID批量选择未限定总数量，数百条采用分页及ID集合，不在主表单铺开。\n3. 课程选择弹窗全选仅当前页可选项；已删除、免费或无效项不可批量带入，跨页保留选择。\n4. 原型虚拟销量、分类排序以可安全表示的非负整数校验；生产数据库上限、批量ID请求上限、导出最大记录数、视频大小及章节上限待确认。\n5. 支付通道启用唯一性当前未限制同一交易类型多条配置，允许用户选择多个启用渠道；营销账户对应真实支付能力尚未接入。\n\n---\n\n# 5. 状态与异常\n\n## 5.1 业务状态\n\n| 对象 | 有效业务状态 |\n| --- | --- |\n| 课程 | 上架、下架；保存草稿归下架；删除为隐藏标记 |\n| 课程分类 | 启用、停用 |\n| 课程订单 | 待付款、已完成、已关闭 |\n| 支付尝试 | 未支付、支付失败、取消本次支付、支付成功；失败/取消不新增订单业务状态 |\n| 课程权益 | 未获权益、已获权益 |\n| 章节学习 | 未开始、学习中、已学完，与交易完成独立 |\n| 优惠占用 | 可用、待付款占用、成功使用、关闭释放 |\n| 规则时间 | 默认长期有效；逐项定时规则只展示一个综合状态：未配置、已禁用、待生效、生效中、已结束；已启用配置状态下方显示起止时间，已禁用不显示时间，不重复展示“已启用” |\n| 分账 | 原型生成快照展示未分账；真实执行状态未接入 |\n\n## 5.2 页面默认态\n\n1. 默认进入课程管理，状态全部、搜索空、每页15条，左侧业务说明默认收起。\n2. 新增课程类型付费，基本字段空，发布设置保存草稿；新增分类默认启用。\n3. 小程序课程专栏全部分类＋全部类型；我的课程全部分类＋全部课程，最近学习优先；课程订单默认全部。\n4. 免费课程未加入显示免费观看；付费未购展示售价，已购详情不显示售价/划线价。\n5. 默认规则付费课程默认不参与。首次设置定时规则时复制本项默认配置，起止时间为空，定时规则状态默认启用；保存后修改回填同一套配置。\n6. 支付配置营销账户默认关闭、支付方式默认启用；正式账号参数不得自动预填为演示参数。\n\n## 5.3 空态\n\n1. 后台列表无匹配显示暂无数据，不保留不存在记录的操作。\n2. 小程序无课程/无匹配提示尝试其他关键词或分类。\n3. 我的课程首次为空提供去看看课程；仅筛选无匹配时提供查看全部课程，不误导重复购买。\n4. 课程订单按各状态无记录时显示对应空态和去看看课程。\n5. 章节未添加、已选课程为空、操作日志为空、分账为空分别展示明确空态；无分账不能伪造成功记录。\n6. 未填简介、讲师、未使用优惠不显示多余占位文案；用户系统字段无数据按“—”处理。\n\n## 5.4 异常态 / 失败态\n\n1. 支付失败：不解锁、不实际扣积分，保留待付款，可在原有效期继续支付。\n2. 取消微信支付：提示取消本次支付，订单仍待付款；不误记用户取消订单。\n3. 主动取消或超时：已关闭，实际支付金额0，记录关闭时间/原因并释放优惠占用。\n4. 支付成功但正式解锁失败：支付事实保留，走权益补偿，属于生产接入要求；原型仅同步模拟成功。\n5. 加载/提交状态须防重复交互；原型本地操作没有真实网络加载，接口耗时、超时与断网展示需正式接入时补齐。\n6. 课程后续调价不改历史实付；支付成功后重放同回调不再次扣减。\n\n## 5.5 权限态 / 不可操作态\n\n1. 已售课程类型不可改，原有章节删除禁用。\n2. 上架课程无删除入口；下架软删除后原已购课程仍可观看。\n3. 未购非试看章节显示锁定，点击提示购买；下架且无权益不可购买或学习。\n4. 已使用/占用券、余额不足、规则不适用时不可选择相应抵扣。\n5. 已关闭订单不可继续支付，已完成不可取消；课程下架/删除时关闭订单重新购买入口应提示暂不可购买。\n6. 已失效分类不供新选，但保留现有归属；无权限正式接口拒绝操作。\n\n## 5.6 状态-操作矩阵（按需）\n\n| 对象与状态 | 可执行操作 | 备注 |\n| --- | --- | --- |\n| 课程上架 | 编辑、下架、复制、日志 | 下架确认，复制默认下架 |\n| 课程下架 | 编辑、上架、复制、删除、日志 | 上架完整校验；删除保留历史权益 |\n| 未购付费课程 | 查看介绍/目录、试看、购买 | 不可播锁定章节 |\n| 已购课程 | 开始/继续观看、查看订单 | 不显示当前售价 |\n| 免费上架课程 | 免费观看 | 开始后加入我的课程，不生成订单 |\n| 待付款订单 | 查看、继续支付、取消订单 | 有效30分钟 |\n| 已完成订单 | 查看、观看课程 | 不代表已学完 |\n| 已关闭订单 | 查看、重新购买 | 重购生成新单，不复活旧单 |\n| 启用分类 | 编辑、排序、停用 | 停用不影响课程权益 |\n| 停用分类 | 编辑、排序、启用 | 前端入口隐藏 |\n| 默认规则单项编辑 | 本项默认配置 | 无起止时间，不改定时规则 |\n| 默认规则编辑全部 | 全部默认配置 | 无起止时间，不改定时规则 |\n| 未开始定时规则 | 修改定时规则 | 弹窗中修改配置及启禁用状态 |\n| 生效中定时规则 | 修改定时规则 | 保存后影响后续业务，历史订单不变 |\n| 已结束定时规则 | 修改定时规则 | 保留配置，修改时间后可再次使用 |\n| 已禁用定时规则 | 修改定时规则 | 启用校验有效时间 |\n\n## 5.7 状态流转（按需）\n\n1. 确认订单未提交 → 返回：无订单。\n2. 提交成功 → 待付款：保存快照，占用优惠和积分。\n3. 待付款 → 返回/失败/取消微信支付 → 待付款：保留原单及截止时间。\n4. 待付款 → 支付成功 → 已完成：核销优惠、扣积分、解锁、记录实付及分账快照。\n5. 待付款 → 主动取消/超时 → 已关闭：释放占用，不发放权益。\n6. 已关闭 → 重新购买：创建新待付款订单，旧单不变。\n7. 保存草稿 → 下架；下架 → 校验通过上架；上架 → 确认下架；下架 → 软删除。\n8. 免费开始学习 → 已获学习权益；播放 → 保存秒数/章节；章节结束 → 标记已学完。\n\n---\n\n# 6. 衍生需求与默认授权项\n\n## 6.1 导出\n\n1. 课程管理列表不导出。课程订单列表保留一个导出入口；课程付费统计明细支持全部字段导出。\n2. 导出当前筛选范围全部结果，不只当前页；文件为UTF-8 BOM CSV，可用表格软件打开，本期不宣称已生成XLSX。\n3. 课程订单文件名：`课程订单.csv`。字段：订单编号、创建时间、订单状态、课程ID/名称、供应商编码、用户ID/昵称/手机号、课程单价、数量、优惠券ID/名称/券码/金额/使用状态/记录时间、使用积分、积分抵扣金额、应付金额、实付金额、支付方式、付款时间。\n4. 统计文件名：`课程付费数据明细.csv`。字段：课程ID/名称/当前状态、供应商编码、用户ID/昵称/手机号/注册时间、订单编号/状态、创建/付款时间、支付方式、支付单号、交易流水号、课程原价、优惠券ID/名称/券码/金额/使用状态/记录时间、使用积分、积分抵扣金额、现金付费金额。\n5. 页面不展示的供应商、使用积分等可保留在后台导出中；用户标识、手机号导出按既有权限控制，缺失数据留空。\n\n## 6.2 日志\n\n1. 课程新增、编辑、复制、上下架、批量变更、软删除记录课程日志；操作日志弹窗含日志ID、操作人、描述、提示信息、时间，按新到旧展示，空态参考现有后台。\n2. 支付配置新建、编辑、启停、删除；分账设置保存及收款配置新增/编辑/删除记录对应日志，不写入密钥明文。\n3. 课程订单记录创建、成功、失败、取消本次支付、明确取消订单、超时关闭、备注修改，状态变更用可读文案，倒序展示。\n4. 积分规则、分类变更当前原型保存更新时间，未新增完整操作日志入口；若正式系统已有统一审计沿用，额外日志字段待确认。\n\n## 6.3 ID 规则\n\n1. 保留平台已有课程、供应商、用户、券及分类ID含义，跨页面传递记录ID，不以列表行号定位。\n2. 新记录ID保证唯一；正式业务前缀与编号长度沿用平台统一规则，原型时间戳/随机后缀不作为正式编号标准。\n3. 支付回调以支付单和订单唯一关联；重新购买生成新订单ID，不复用关闭单。\n\n## 6.4 通知\n\n本期只提供站内页面反馈与状态同步，不扩展短信、企微或订阅通知。支付失败与关闭原因应在前台可见。\n\n## 6.5 端能力限制\n\n1. PC沿用参考后台布局、组件密度及主色；小程序按375×812手机画布与既有紫色体系展示。原型单文件，无外部前端库依赖。\n2. 当前数据为浏览器本地模拟；缓存清理、换设备或真实多用户环境需要正式服务替代。\n3. 支付按钮、回调、视频时钟、分账状态均可演示，不产生真实资金结算；演示余额及券不可进入正式账务。\n4. 已完成42项本轮流程逻辑检查，未完成真实浏览器逐屏视觉核验，也不等同于生产验收。\n5. 正式接入需补充支付验签、服务端鉴权、视频转码/存储/防盗链、优惠与积分事务、定时关单、权益补偿及分账对账。\n\n## 6.6 默认授权项\n\n1. 本需求默认允许在既有原型内新增/修改本期菜单、示例数据、筛选、联动、导出、日志与状态，不新增外部通知或真实交易。\n2. 原型可使用示例分类、供应商、脱敏用户、示例课程及DEMO商户配置辅助验收；均需与正式数据隔离。\n3. 以下事项保留待确认，不视为已获业务授权：多券叠加、课程购买奖励积分、分账合计强校验/尾差/手续费/优惠承担结算、生产视频和批量上限、正式权限与商户规则。\n\n---\n\n# 附件 / 补充材料\n\n## A. 参考图\n\n本次会话附件为视觉参考，不作为新增业务指令。已采用的参考包括：商品管理列表/表单；支付分账列表、场景公式、收款表单；支付配置列表与弹窗；积分权益列表、消耗及发放单项/全部编辑；商品订单列表、详情、分账弹窗；富文本工具栏；课程统计卡/明细；小程序确认订单、订单支付、支付结果、订单列表与关闭详情。冲突时以本文最终规则为准。\n\n## B. 历史页面\n\n1. 沿用现有商品后台的轻量表格、分区表单和订单结构，移除课程无关的实物交易字段。\n2. 后续迭代已覆盖“草稿为独立状态、课程订单已发货、免费已加入/已购人数、所有课程供应商必填、多组编辑全部生效时间”等旧版本口径，不能再据旧截图恢复。\n\n## C. 相关文档\n\n- 模板：[xx需求文档.md](../xx需求文档.md)。保留其章节顺序与编号，包括“2.关键业务规则”下的4.x编号。\n- 本次版本原型：[付费课程.html](付费课程.html)（未发布草稿）。\n- 定时规则版本说明：[版本变更说明.md](版本草稿/2026-11-10-逐项定时规则/版本变更说明.md)。\n- 流程复核记录：[流程复核记录-2026-11-02.md](../2.31 购买课程/流程复核记录-2026-11-02.md)。\n\n### 免费课程虚拟销量配置调整（2026-11-11）\n\n虚拟销量仅付费课程在新增、编辑及后台详情展示，选填，校验非负整数。切换为免费时隐藏并保留原值、不校验、不参与前台展示；切回付费时回填原值并恢复校验。免费课程前台仍不展示销量。\n";

function renderForm(){const d=drafts[active];if(!d){active='list';return render()}if(d.status==='down')d.status='draft';let sold=hasPaid(d),old=find(d.id);$('main').innerHTML=`<div class="pagehead"><strong><button class="link" onclick="cancelForm()">‹</button> ${active==='new'?'新增':'编辑'}课程</strong><div><button class="link" onclick="cancelForm()">取消</button> <button class="primary" onclick="saveForm()">保存</button></div></div><div class="form-grid"><div><section class="section" id="basic"><h3>基本信息</h3>${field('课程名称','name',`<input maxlength="50" value="${esc(d.name)}" placeholder="请输入课程名称，50字以内" oninput="updateField('name',this.value)">`)}${field('后台分类','category',categoryControl(d),false)}${field('课程分类','courseCategory',courseCategoryControl(d),false)}${field('讲师姓名','teacher',`<input maxlength="20" value="${esc(d.teacher)}" placeholder="请输入讲师姓名" oninput="updateField('teacher',this.value)">`,false)}${field('课程封面','cover',`<label class="upload">${d.cover?`<img src="${esc(d.cover)}" alt="课程封面">`:d.seedCover?cover(d):'<span style="font-size:25px">＋</span>上传图片'}<input type="file" hidden accept="image/png,image/jpeg" onchange="uploadCover(this)"></label><div class="help">建议 16:9，JPG / PNG，最大 5MB</div>`)}${field('课程简介','intro',richEditor('intro',d.intro||''),false)}${field('课程详情','desc',richEditor('desc',d.desc))}</section><section class="section" id="sale"><h3>价格信息</h3>${field('课程类型','type',`<div class="segments"><button class="${d.type==='free'?'active':''}" ${sold?'disabled':''} onclick="setDraft('type','free')">免费课程</button><button class="${d.type==='paid'?'active':''}" ${sold?'disabled':''} onclick="setDraft('type','paid')">付费课程</button></div>${sold?'<div class="help">已有购买记录，课程类型不可修改</div>':''}`)}${d.type==='paid'?`${field('供应商编码','supplier',`<select onchange="updateField('supplier',this.value)"><option value="">请选择供应商编码</option>${suppliers.map(x=>`<option value="${x.code}" ${d.supplier===x.code?'selected':''}>${x.code} · ${x.name}</option>`).join('')}</select><div class="help">用于匹配供应商在「课程」场景下的收款配置</div>`)}`:''}${d.type==='paid'?field('课程售价','price',`<input type="number" min="0.01" max="99999.99" step="0.01" placeholder="请输入售价（元）" value="${esc(d.price)}" oninput="updateField('price',this.value)"><div class="help">整门课程一次购买，解锁全部章节</div>`):''}${d.type==='paid'?field('课程划线价','linePrice',`<input type="number" min="0" step="0.01" placeholder="请输入划线价（元），最多2位小数" value="${esc(d.linePrice??'')}" oninput="updateField('linePrice',this.value)">`,false):''}${d.type==='paid'?field('虚拟销量','virtualSales',`<input type="number" min="0" step="1" placeholder="请输入虚拟销量" value="${esc(d.virtualSales??'')}" oninput="updateField('virtualSales',this.value)">`,false):''}</section><section class="section" id="chapters"><h3>章节配置</h3><div class="chapter-block">${sold?'<div class="notice">已售章节不可删除，可追加新章节。</div>':''}<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button onclick="addChapter()">＋ 添加章节</button></div><table class="chapter-table"><thead><tr><th style="width:45px">排序</th><th>章节名称 <span style="color:red">*</span></th><th>视频 <span style="color:red">*</span></th>${d.type==='paid'?'<th>免费试看</th>':''}<th style="width:110px">操作</th></tr></thead><tbody>${d.chapters.map((ch,i)=>`<tr><td>${i+1}</td><td><input type="text" maxlength="50" value="${esc(ch.title)}" placeholder="请输入章节名称" oninput="updateChapter(${i},'title',this.value)"></td><td><label style="cursor:pointer;color:#051D86"><div class="video-label">${ch.video?esc(ch.video):'＋ 上传视频'}</div><input type="file" hidden accept="video/mp4,video/webm" onchange="uploadVideo(this,${i})"></label><div class="muted">${ch.video?dur(ch.duration):'支持 MP4 / WebM'}</div><button class="link" style="font-size:11px" onclick="demoVideo(${i})">使用演示视频</button></td>${d.type==='paid'?`<td><input type="checkbox" ${ch.trial?'checked':''} onchange="updateChapter(${i},'trial',this.checked)"></td>`:''}<td><button class="link" ${i===0?'disabled':''} onclick="moveChapter(${i},-1)">↑</button><button class="link" ${i===d.chapters.length-1?'disabled':''} onclick="moveChapter(${i},1)">↓</button><button class="link" ${sold&&old?.chapters.some(x=>x.id===ch.id)?'disabled':''} onclick="deleteChapter(${i})">删除</button></td></tr>`).join('')}</tbody></table>${!d.chapters.length?'<div class="empty" style="padding:28px">暂无章节，请添加章节并上传视频</div>':''}<div class="error" data-error="chapters"></div></div></section><section class="section" id="publish"><h3>发布设置</h3>${field('发布设置','status',`<div class="points-radio" style="min-height:36px">${[['up','立即上架'],['draft','保存草稿']].map(([k,l])=>`<label><input type="radio" name="course-publish-status" value="${k}" ${d.status===k?'checked':''} onchange="updateField('status',this.value)"> ${l}</label>`).join('')}</div>`)}</section></div><nav class="anchors">${[['basic','基本信息'],['sale','价格信息'],['chapters','章节配置'],['publish','发布设置']].map(([id,l],i)=>`<a href="#${id}" class="${i===0?'active':''}" onclick="event.preventDefault();document.getElementById('${id}').scrollIntoView({behavior:'smooth',block:'start'})">${l}</a>`).join('')}</nav></div>`;setupAnchors()}
function setupAnchors(){const el=$('main');el.onscroll=()=>{let sections=[...el.querySelectorAll('.section[id]')];let current=sections.filter(s=>s.getBoundingClientRect().top<=el.getBoundingClientRect().top+140).pop()||sections[0];el.querySelectorAll('.anchors a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+current?.id))}}
function updateChapter(i,k,v){drafts[active].chapters[i][k]=v;drafts[active].dirty=true}function rerenderForm(){let y=$('main').scrollTop;renderForm();$('main').scrollTop=y}function addChapter(){drafts[active].chapters.push({id:'ch'+Date.now(),title:'',duration:480,video:'',trial:false});drafts[active].dirty=true;rerenderForm()}function deleteChapter(i){confirmAction('删除章节','是否确认删除该章节？',()=>{drafts[active].chapters.splice(i,1);drafts[active].dirty=true;rerenderForm()})}function moveChapter(i,delta){let a=drafts[active].chapters;[a[i],a[i+delta]]=[a[i+delta],a[i]];drafts[active].dirty=true;rerenderForm()}function demoVideo(i){updateChapter(i,'video','演示视频.mp4');rerenderForm();toast('已添加演示视频')}
async function uploadCover(input){let f=input.files[0];if(!f)return;if(!['image/jpeg','image/png'].includes(f.type)||f.size>5*1024*1024){input.value='';return toast('请选择5MB以内的JPG或PNG图片')}let r=new FileReader();r.onload=()=>{updateField('cover',r.result);rerenderForm()};r.readAsDataURL(f)}function uploadVideo(input,i){let f=input.files[0];if(!f)return;if(!['video/mp4','video/webm'].includes(f.type))return toast('请选择MP4或WebM视频');let d=drafts[active],ch=d.chapters[i];videoURLs[d.id+'-'+ch.id]=URL.createObjectURL(f);ch.video=f.name;d.dirty=true;let v=document.createElement('video');v.preload='metadata';v.src=videoURLs[d.id+'-'+ch.id];v.onloadedmetadata=()=>{ch.duration=Math.round(v.duration)||480;rerenderForm()};rerenderForm()}
function saveForm(){let d=drafts[active];document.querySelectorAll('[data-error]').forEach(e=>e.textContent='');let errors=d.status==='draft'?{...(!d.name.trim()?{name:'请输入课程名称'}:{}),...coursePriceErrors(d)}:validCourse(d);if(Object.keys(errors).length){Object.entries(errors).forEach(([k,v])=>{let el=document.querySelector(`[data-error="${k}"]`);if(el)el.textContent=v});let e=document.querySelector('.error:not(:empty)');e?.scrollIntoView({block:'center',behavior:'smooth'});return}let c=clonePrototypeData(d);c.status=d.status==='up'?'up':'down';delete c.dirty;delete c.seedCover;c.price=c.type==='free'?0:Number(c.price);c.desc=richHTML(c.desc);c.intro=richText(c.intro)?richHTML(c.intro):'';c.linePrice=c.type==='paid'&&c.linePrice!==''&&c.linePrice!=null?Number(c.linePrice):'';if(c.type==='paid')c.virtualSales=c.virtualSales!==''&&c.virtualSales!=null?Number(c.virtualSales):'';if(c.type==='free')c.supplier='';c.short=c.short||c.name;c.created=c.created||now();c.updated=now();let i=db.courses.findIndex(x=>x.id===c.id);i<0?db.courses.unshift(c):db.courses[i]=c;try{save()}catch{toast('本地空间不足，请缩小封面后重试');return}logCourse(c.id,i<0?'新增课程，状态【'+status(c)+'】':'编辑课程，保存后状态【'+status(c)+'】');drafts[active].dirty=false;const k=active;closeTab(k);openPage('list','课程管理');toast('保存成功')}
function cancelForm(){closeTab(active)}function renderDetail(){let c=find(active.split('-')[1]);if(!c){$('main').innerHTML='<div class="empty">课程已被删除</div>';return}$('main').innerHTML=`<div class="pagehead"><strong>课程详情</strong><div><button onclick="preview(${c.id})">小程序预览</button> <button class="primary" onclick="editCourse(${c.id})">编辑</button></div></div><div class="form-grid"><div><section class="section" id="basic"><h3>基本信息</h3><div class="overview">${cover(c)}<div class="detail-values"><div style="font-size:16px">${esc(c.name)}</div><div class="muted">课程ID：${c.id}</div><div>状态：<span class="state-${c.status}">${status(c)}</span></div></div></div>${field('课程分类','',`<div style="padding-top:7px">${esc(courseCategoryName(c.courseCategory)||'—')}</div>`,false)}${field('后台分类','',`<div style="padding-top:7px">${esc(c.category||'—')}</div>`,false)}${field('讲师姓名','',`<div style="padding-top:7px">${esc(c.teacher||'—')}</div>`,false)}${field('课程简介','',`<div class="rich-output">${richHTML(c.intro||'—')}</div>`,false)}${field('课程详情','',`<div class="rich-output">${richHTML(c.desc||'—')}</div>`,false)}</section><section class="section" id="sale"><h3>价格信息</h3>${field('课程类型','',`<div style="padding-top:7px">${c.type==='paid'?'付费课程':'免费课程'}</div>`,false)}${c.type==='paid'?`${field('供应商编码','',`<div style="padding-top:7px">${esc(c.supplier||'—')} · ${esc(suppliers.find(x=>x.code===c.supplier)?.name||'—')}</div>`,false)}`:''}${field('课程售价','',`<div style="padding-top:7px">${money(c)}</div>`,false)}${c.type==='paid'?field('课程划线价','',`<div style="padding-top:7px">${c.linePrice!==''&&c.linePrice!=null?'¥'+Number(c.linePrice).toFixed(2):'—'}</div>`,false):''}${c.type==='paid'?field('虚拟销量','',`<div style="padding-top:7px">${esc(c.virtualSales??'—')}（前端展示 ${courseSales(c)} 人已购）</div>`,false):''}</section><section class="section" id="chapters"><h3>章节内容</h3><div class="chapter-block"><table><thead><tr><th>序号</th><th>章节名称</th><th>视频时长</th><th>免费试看</th></tr></thead><tbody>${c.chapters.map((ch,i)=>`<tr><td>${i+1}</td><td>${esc(ch.title)}</td><td>${dur(ch.duration)}</td><td>${c.type==='free'?'免费':ch.trial?'是':'否'}</td></tr>`).join('')}</tbody></table></div></section></div><nav class="anchors"><a href="#basic">基本信息</a><a href="#sale">价格信息</a><a href="#chapters">章节内容</a></nav></div>`;setupAnchors()}
function preview(id){mp.id=id;mp.tab='catalog';openPage('mp-detail','课程详情')}
function goMP(page,label){openPage('mp-'+page,label||{'list':'课程专栏','detail':'课程详情','player':'视频学习','order':'确认订单','payment':'订单支付','user-order':'订单详情','orders':'课程订单','result':'支付结果','my':'我的课程'}[page])}
function phoneHead(title,back=''){return `<div class="ios"><span>9:41</span><span class="icons">▮▮▮  ᯤ  ▰</span></div><div class="mpnav">${back?`<button class="back" aria-label="返回" onclick="${back}">‹</button>`:''}<span>${title}</span><div class="capsule"><span>•••</span><i></i><em></em></div></div>`}function bottomTabs(which){return `<div class="mpbottom tabs-bottom"><button class="${which==='list'?'active':''}" onclick="goMP('list')">${icon('book',21)}课程专栏</button><button class="${which==='my'?'active':''}" onclick="goMP('my')">${icon('user',21)}我的课程</button></div>`}
function renderMobile(){stopPaymentClock();const page=active.replace('mp-','');const c=find(mp.id)||db.courses[0];if(!c){$('main').innerHTML='<div class="empty">暂无课程，请先在后台新增课程</div>';return}mp.id=c.id;let content='';if(page==='list')content=mobileList();if(page==='detail')content=mobileDetail(c);if(page==='player')content=mobilePlayer(c);if(page==='order')content=mobileOrder(c);if(page==='payment')content=mobilePayment(c);if(page==='user-order')content=mobileUserOrder(c);if(page==='result')content=mobileResult(c);if(page==='my')content=mobileMy();if(page==='orders')content=mobileCourseOrders();$('main').innerHTML=`<div class="mobile-stage"><div class="device-wrap"><div class="device-caption"><span>微信小程序 · ${tabs.find(t=>t.key===active)?.label||''}</span><span>375 × 812</span></div><div class="phone">${content}<div class="home-indicator"></div></div></div></div>`;if(page==='player')initPlayer(c);if(page==='payment')startPaymentClock();cacheMobilePage();}
function mobileList(){return phoneHead('陪伴课堂')+`<div class="mpbody"><div class="mp-hero"><div class="eyebrow">MINBAO FAMILY CLASSROOM</div><h1>陪伴，是一起慢慢成长</h1><p>给敏宝家庭的温柔支持与日常练习</p><div class="hero-art">❋</div></div><div class="mp-search"><input id="mp-search" value="${esc(mp.search)}" placeholder="搜索你感兴趣的课程" oninput="mp.search=this.value;refreshMPCards()"></div>${mobileCourseCategories()}<div class="mp-filters">${[['all','全部'],['free','免费课程'],['paid','付费课程']].map(([k,l])=>`<button class="${mp.type===k?'active':''}" onclick="mp.type='${k}';renderMobile()">${l}</button>`).join('')}</div><div class="mp-list" id="mp-cards">${mpCards()}</div><p style="text-align:center;color:#aaa;font-size:11px;margin:24px">用一点时间，给家人多一点支持</p></div>`+bottomTabs('list')}
function mpCards(){const enabled=sortedCourseCategories().filter(x=>x.enabled);if(mp.courseCategory&&!enabled.some(x=>x.id===mp.courseCategory))mp.courseCategory='';let cs=db.courses.filter(c=>!c.deleted&&c.status==='up'&&(mp.type==='all'||c.type===mp.type)&&(!mp.courseCategory||c.courseCategory===mp.courseCategory)&&c.name.includes(mp.search));const card=c=>`<div class="mp-card" onclick="mp.id=${c.id};mp.tab='catalog';goMP('detail')">${cover(c)}<div class="mp-card-info"><h3>${esc(c.name)}</h3><p>${c.teacher?esc(c.teacher)+' · ':''}${c.chapters.length}节课${c.type==='paid'?' · '+courseSales(c)+'人已购':''}</p><div style="display:flex;align-items:center;justify-content:space-between"><span class="mp-price ${c.type==='free'||owns(c)?'free':''}">${c.type==='free'?'免费观看':owns(c)?'已购买':money(c)}</span>${strikePrice(c)}${c.type==='paid'&&!owns(c)?'<span class="tiny-tag">免费试看</span>':''}</div></div></div>`;if(!cs.length)return '<div class="empty">暂无相关课程<br><span style="font-size:12px">试试其他关键词或分类</span></div>';if(mp.courseCategory)return cs.map(card).join('');const groups=enabled.map(cat=>({name:cat.name,rows:cs.filter(c=>c.courseCategory===cat.id)}));groups.push({name:'其他课程',rows:cs.filter(c=>!enabled.some(cat=>cat.id===c.courseCategory))});return groups.filter(g=>g.rows.length).map(g=>`<section><h3 class="mp-course-group-title">${esc(g.name)}</h3>${g.rows.map(card).join('')}</section>`).join('')}function refreshMPCards(){$('mp-cards').innerHTML=mpCards()}
function lessons(c){return c.chapters.map((ch,i)=>{const locked=c.type==='paid'&&!owns(c)&&!ch.trial;let done=db.progress[c.id]?.[ch.id]?.done;return `<div class="lesson ${active==='mp-player'&&i===mp.chapter?'current':''}" onclick="chooseChapter(${i})"><span class="n">${String(i+1).padStart(2,'0')}</span><div><div class="lesson-name">${esc(ch.title)}</div><div class="lesson-sub">${dur(ch.duration)}${done?' · 已学完':''}</div></div>${locked?`<span class="lesson-lock">${icon('lock',14)}</span>`:c.type==='paid'&&!owns(c)?'<span class="tiny-tag">试看</span>':`<span class="lesson-lock">${icon('play',15)}</span>`}</div>`}).join('')}
function mobileDetail(c){let granted=owns(c),publicCourse=c.status==='up';return phoneHead('课程详情',"goMP('list')")+`<div class="mpbody">${cover(c,'mp-banner')}<div class="mp-section"><h2>${esc(c.name)}</h2>${richText(c.intro)?`<div class="mp-intro rich-output">${richHTML(c.intro)}</div>`:''}<div class="mp-meta">${c.teacher?`<span>${esc(c.teacher)}</span>`:''}<span>共${c.chapters.length}节</span>${c.type==='paid'?`<span>${courseSales(c)}人已购</span>`:''}</div>${c.type==='paid'&&granted?'<div style="margin-top:16px;color:#6949BD;font-size:13px">已购买 · 全部章节已解锁</div>':`<div style="margin-top:16px"><span class="mp-price" style="font-size:24px">${money(c)}</span>${strikePrice(c)}<span style="font-size:11px;color:#999;margin-left:10px">${c.type==='free'?'全部章节免费学习':'购买后解锁全部章节'}</span></div>`}</div><div class="mp-tabs"><button class="${mp.tab==='intro'?'active':''}" onclick="mp.tab='intro';renderMobile()">课程介绍</button><button class="${mp.tab==='catalog'?'active':''}" onclick="mp.tab='catalog';renderMobile()">课程目录（${c.chapters.length}）</button></div><div class="mp-section">${!publicCourse&&!granted?'<p>该课程尚未上架或已下架，暂不可购买。</p>':mp.tab==='catalog'?lessons(c):`<h3>关于这门课</h3><div class="rich-output">${richHTML(c.desc)}</div><h3 style="margin-top:24px">适合谁学习</h3><p>希望获得日常陪伴支持的敏宝家庭，以及参与共同照护的家人。</p><h3 style="margin-top:24px">你将获得</h3><p>${c.chapters.length}节视频课程 · 可反复回看 · 保存学习进度</p><p style="font-size:11px;color:#aaa">课程内容用于家庭陪伴与经验分享，不替代专业诊疗。</p>`}</div></div><div class="mpbottom">${granted||c.type==='free'?`<button class="mp-primary grow" ${!publicCourse&&!granted?'disabled':''} onclick="startLearning()">${c.type==='free'?(hasWatchProgress(c)?'继续观看':'免费观看'):(hasWatchProgress(c)?'继续观看':'开始观看')}</button>`:`<button ${!publicCourse?'disabled':''} onclick="trialCourse()">免费试看</button><button class="mp-primary grow" ${!publicCourse?'disabled':''} onclick="beginOrder()">¥${Number(c.price).toFixed(2)} 购买课程</button>`}</div>`}
function trialCourse(){const c=find(mp.id);if(c.status!=='up'&&!owns(c))return toast('课程暂未开放');let i=c.chapters.findIndex(ch=>ch.trial);if(i<0)return toast('暂无试看章节');mp.chapter=i;goMP('player')}
function chooseChapter(i){const c=find(mp.id);if(c.status!=='up'&&!owns(c))return toast('课程暂未开放');if(c.type==='paid'&&!owns(c)&&!c.chapters[i].trial){return purchasePrompt()}if(c.type==='free')enroll(c);mp.chapter=i;goMP('player')}

function enroll(c){if(!owns(c)){db.owned[c.id]={time:now(),free:c.type==='free'};save()}}function startLearning(){const c=find(mp.id);if(!c)return toast('课程不存在');if((c.deleted||c.status!=='up')&&!owns(c))return toast('课程暂未开放');if(!c.chapters.length)return toast('课程暂无可播放章节');if(c.type==='free')enroll(c);if(c.type==='paid'&&!owns(c))return purchasePrompt();mp.chapter=Math.max(0,c.chapters.findIndex(ch=>ch.id===db.owned[c.id]?.last));goMP('player')}

let playSeconds=0,speed=1,lastTick=0,playerContext=null;function initPlayer(c){let ch=c.chapters[mp.chapter];if(!ch)return;playerContext={course:c.id,chapter:ch.id};playSeconds=db.progress[c.id]?.[ch.id]?.seconds||0;speed=1;const v=$('real-video');if(v){v.onloadedmetadata=()=>{v.currentTime=Math.min(playSeconds,v.duration||0)};v.ontimeupdate=()=>{playSeconds=v.currentTime;updatePlayerUI();recordProgress()};v.onended=endPlayback}}

function updatePlayerUI(){if($('play-time'))$('play-time').textContent=dur(playSeconds);if($('play-range'))$('play-range').value=playSeconds}function recordProgress(){let c=find(playerContext?.course),ch=c?.chapters.find(ch=>ch.id===playerContext?.chapter);if(!ch)return;db.progress[c.id]??={};let prev=db.progress[c.id][ch.id]||{};db.progress[c.id][ch.id]={seconds:Math.floor(playSeconds),done:prev.done||playSeconds>=ch.duration-1};if(owns(c)){db.owned[c.id].last=ch.id;db.owned[c.id].updated=now()}save()}
function stopPlayback(){if(playing)recordProgress();playing=false;clearInterval(timer);timer=null;document.querySelector('#real-video')?.pause();playerContext=null}function seek(v){playSeconds=v;let video=$('real-video');if(video)video.currentTime=v;updatePlayerUI();recordProgress();const c=find(mp.id);if(v>=c.chapters[mp.chapter].duration)endPlayback()}function cycleSpeed(btn){speed=speed===1?1.5:speed===1.5?2:1;btn.textContent=speed+'×';if($('real-video'))$('real-video').playbackRate=speed}function endPlayback(){playing=false;clearInterval(timer);const c=find(mp.id);playSeconds=c.chapters[mp.chapter].duration;recordProgress();updatePlayerUI();if($('play-btn'))$('play-btn').textContent='▶';if(!document.getElementById('video-end'))document.querySelector('.video-box')?.insertAdjacentHTML('beforeend',`<div id="video-end" class="video-mask"><span>本节已学习完成</span><button class="mp-primary" onclick="nextChapter()">${mp.chapter<c.chapters.length-1?'观看下一节':'返回课程'}</button><button style="color:#fff" onclick="this.parentElement.remove();seek(0);togglePlayback()">重新观看</button></div>`)}function nextChapter(){const c=find(mp.id);if(mp.chapter>=c.chapters.length-1)return goMP('detail');chooseChapter(mp.chapter+1)}

function ruleText(r){return r.tokens.map(t=>t.type==='paid'?'订单实付金额':t.type==='constant'?String(t.value??''):t.value).join(' ')}
function calcRule(rule,amount){let output=[],ops=[],prec={'+':1,'-':1,'*':2,'/':2};for(const t of rule.tokens){if(t.type==='op'){while(ops.length&&prec[ops.at(-1)]>=prec[t.value])output.push(ops.pop());ops.push(t.value)}else output.push(t.type==='paid'?amount:Number(t.value))}while(ops.length)output.push(ops.pop());let stack=[];for(let t of output){if(typeof t==='number'){if(!Number.isFinite(t))return NaN;stack.push(t)}else{if(stack.length<2)return NaN;const b=stack.pop(),a=stack.pop();stack.push(t==='+'?a+b:t==='-'?a-b:t==='*'?a*b:b===0?NaN:a/b)}}return stack.length===1?Math.round(stack[0]*100)/100:NaN}
function ruleError(r){if(!r.tokens.length||r.tokens.length%2===0)return '请补全计算公式';for(let i=0;i<r.tokens.length;i++){let t=r.tokens[i];if(i%2===1&&t.type!=='op'||i%2===0&&t.type==='op')return '字段和运算符需交替配置';if(t.type==='constant'&&(t.value===''||!Number.isFinite(Number(t.value))||Number(t.value)<0))return '请输入非负固定数值'}for(const a of [0.01,1,100,99999.99]){const n=calcRule(r,a);if(!Number.isFinite(n)||n<0)return '计算结果不可为负数或除以零'}return ''}

function batchPointPicker(){const p=pointPicker;const all=pointIds(p.batchText),ids=[...new Set(all)];let added=0,already=0,invalid=[],free=[],deleted=[];for(const id of ids){const c=/^\d+$/.test(id)?find(id):null;if(!c){invalid.push(id);continue}if(c.deleted){deleted.push(id);continue}if(c.type!=='paid'){free.push(id);continue}if(p.selected.has(String(c.id)))already++;else{p.selected.add(String(c.id));added++}}p.feedback=`已添加 ${added} 门；已选重复 ${already} 门；输入重复 ${all.length-ids.length} 个。`+(invalid.length?'\n无效ID：'+invalid.join('、'):'')+(free.length?'\n非付费课程：'+free.join('、'):'')+(deleted.length?'\n已删除课程：'+deleted.join('、'):'');renderPointCoursePicker()}

function checkoutTotals(){const d=mp.checkout,c=find(d?.course);if(!c)return {price:0,coupon:0,points:0,pointCount:0,amount:0,maxPoints:0};const price=Number(c.price),coupon=db.checkoutCoupons.find(x=>x.id===d.couponId);const discount=coupon&&checkoutCouponEligible(coupon,c)?Math.min(price,coupon.amount):0;const remain=Math.max(0,Math.round((price-discount)*100)/100);const g=checkoutPointGroup(c),ratio=Number(effectivePointRatio())||10;let cap=0;if(g&&(g.amountMode==='none'||remain>=Number(g.minAmount))){cap=remain;if(g.capMode==='amount')cap=Math.min(cap,+g.capAmount);if(g.capMode==='percent')cap=Math.min(cap,remain*Number(g.capPercent)/100)}const units=Math.max(0,Math.min(Math.floor(cap),Math.floor(availableCheckoutPoints()/ratio)));const points=d.usePoints?units:0;return {price,coupon:discount,points,pointCount:points*ratio,amount:Math.max(0,Math.round((remain-points)*100)/100),maxPoints:units*ratio}}

function selectCheckoutCoupon(){const c=find(mp.checkout.course),d=mp.checkout;checkoutSheet('选择优惠券',`<div class="checkout-option ${!d.couponId?'selected':''}" onclick="chooseCheckoutCoupon('')">不使用优惠券</div>`+db.checkoutCoupons.map(x=>{const available=checkoutCouponEligible(x,c);return `<div class="checkout-option ${d.couponId===x.id?'selected':''} ${!available?'disabled':''}" ${available?`onclick="chooseCheckoutCoupon('${x.id}')"`:''}><div style="display:flex;justify-content:space-between"><span>${esc(x.name)}</span><span style="color:#ff137d">¥${x.amount.toFixed(2)}</span></div><div class="muted">满${x.min}元可用 · ${available?'可使用':+c.price<x.min?'未达到使用门槛':'已使用'}</div></div>`}).join(''))}

function submitCourseCheckout(){const d=mp.checkout,c=find(d?.course);if(!c)return;if(owns(c))return startLearning();if(c.status!=='up')return toast('课程已下架，暂不可购买');if(!d.agreed)return toast('请先阅读并同意用户购买须知');if(d.couponId){const selected=db.checkoutCoupons.find(x=>x.id===d.couponId);if(!selected||!checkoutCouponEligible(selected,c))return toast('所选优惠券已不可用，请重新选择')}if(d.submitted){mp.order=d.submitted;return goMP('payment')}const t=checkoutTotals(),coupon=db.checkoutCoupons.find(x=>x.id===d.couponId);const id='KC'+Date.now()+Math.random().toString(16).slice(2,6);const o={id,course:c.id,courseSnapshot:coSnapshot(c),amount:t.amount,status:'pending',created:now(),expiresAt:Date.now()+30*60*1000,submitted:true,user:coUser(),couponId:t.coupon&&coupon?coupon.id:'',couponName:t.coupon&&coupon?coupon.name:'',couponMoney:t.coupon,couponCode:t.coupon?'DEMO-'+coupon.id:'',couponTime:t.coupon?now():'',pointsMoney:t.points,pointsUsed:t.pointCount,buyerRemark:d.remark,payChannel:'微信支付',agreedAt:now()};ensureOrderSnapshot(o);o.pointRuleSnapshot=pointOrderSnapshot(c);o.pointGrantRuleSnapshot=resolvePointRule('grant','单笔购买');db.orders.push(o);d.submitted=id;mp.order=id;save();goMP('payment')}
function paymentSeconds(o){return Math.max(0,Math.ceil(((o.expiresAt||0)-Date.now())/1000))}
function paymentTimeText(seconds){return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function mobilePayment(c){const o=currentOrder();if(!o)return phoneHead('订单支付',"goMP('detail')")+'<div class="empty">暂无待支付订单</div>';return phoneHead('订单支付',"goMP('user-order')")+`<div class="mpbody checkout-body"><div class="payment-hero"><div class="payment-amount"><small>¥</small>${Number(o.amount).toFixed(2)}</div><div class="payment-remaining">支付剩余时间 <span id="course-pay-countdown">${paymentTimeText(paymentSeconds(o))}</span></div><p>请在30分钟内付款，超时未付款将自动关闭</p></div><div class="checkout-card"><h3>支付方式</h3>${coursePaymentMethodsHTML(o)}</div></div><div class="mpbottom"><button class="mp-primary checkout-submit grow" onclick="confirmCoursePayment()">确认</button></div>`}
function startPaymentClock(){const tick=()=>{if(active!=='mp-payment'){stopPaymentClock();return}const o=currentOrder();if(!o)return;if(o.status==='paid'){stopPaymentClock();return}if(!paymentSeconds(o)&&['pending','failed'].includes(o.status)){o.status='cancelled';o.adminState='closed';o.closeReason='超时未支付，系统自动关闭';o.closedAt=now();o.logs.push({time:now(),actor:'系统',content:'超时未支付，课程订单自动关闭',change:'待付款 → 已关闭'});save();stopPaymentClock();goMP('result');return}const e=$('course-pay-countdown');if(e)e.textContent=paymentTimeText(paymentSeconds(o))};tick();if(active==='mp-payment')paymentClock=setInterval(tick,1000)}
function confirmCoursePayment(){const o=currentOrder();if(!o)return;if(o.status==='paid')return goMP('result');if(!['pending','failed'].includes(o.status)||!paymentSeconds(o))return toast('订单已关闭，请重新下单');if(Number(o.amount)===0){o.payChannel='优惠抵扣支付';return finishPay('paid')}if(!prepareCoursePaymentRoute(o))return toast('暂时无法支付，请稍后重试');paySheet()}
const finishCheckoutBefore=finishPay;finishPay=function(state){const o=currentOrder(),wasPaid=o?.status==='paid';if(!o)return;if(state==='paid'&&!wasPaid){if(o.expiresAt&&!paymentSeconds(o))return toast('订单已超时，请重新下单');if(Number(o.pointsUsed||0)>availableCheckoutPoints(o.id))return toast('积分余额不足，请重新下单');if(o.couponId&&db.orders.some(x=>x.id!==o.id&&x.couponId===o.couponId&&x.status==='paid'))return toast('优惠券已使用，请重新下单')}finishCheckoutBefore(state);if(state==='paid'&&o.status==='paid'&&!wasPaid&&!o.pointsDebited){db.checkoutPointBalance=Math.max(0,db.checkoutPointBalance-Number(o.pointsUsed||0));o.pointsDebited=true;save()}};
retryPay=function(){const o=currentOrder();if(o&&['pending','failed'].includes(o.status)&&paymentSeconds(o)){o.status='pending';save();goMP('payment')}else beginOrder()};
mobileResult=function(c){const o=currentOrder(),ok=o?.status==='paid',cancel=o?.status==='cancelled';const recommendations=db.courses.filter(x=>!x.deleted&&x.status==='up'&&x.id!==c.id).slice(0,2);return phoneHead('支付结果',"goMP('list')")+`<div class="mpbody no-footer checkout-body"><div class="checkout-result"><div class="checkout-success-icon" style="${!ok?'background:#aaa':''}">${ok?'✓':cancel?'−':'!'}</div><h2>${ok?'支付成功':cancel?'订单已关闭':o?.lastPaymentResult==='cancelled'?'已取消本次支付':'支付未完成'}</h2><p>${ok?'课程已解锁，现在就开始学习吧':cancel?'未产生扣款，可返回课程重新购买':'课程未解锁，订单保留待付款，可在课程订单继续支付'}</p><div class="result-shortcuts"><button onclick="goMP('user-order')">查看订单</button><button onclick="goMP('list')">去首页</button></div>${ok?'<button class="mp-primary checkout-submit" style="width:100%;margin-top:12px" onclick="startLearning()">开始观看</button>':'<button class="mp-primary" onclick="retryPay()">'+(cancel?'重新购买':'继续支付')+'</button>'}</div><div class="result-recommend-title">—　大家都在看　—</div><div class="mp-list" style="border-radius:12px">${recommendations.map(x=>`<div class="mp-card" onclick="mp.id=${x.id};mp.tab='catalog';goMP('detail')">${cover(x)}<div class="mp-card-info"><h3>${esc(x.name)}</h3><p>共${x.chapters.length}节</p><span class="mp-price ${x.type==='free'?'free':''}">${x.type==='free'?'免费观看':money(x)}</span></div></div>`).join('')||'<div class="empty">暂无推荐课程</div>'}</div></div>`};
function mobileUserOrder(c){const o=currentOrder();if(!o)return phoneHead('订单详情',"goMP('list')")+'<div class="empty">暂无订单</div>';const snapshot=o.courseSnapshot||c;return phoneHead('订单详情',"goMP('list')")+`<div class="mpbody checkout-body"><div class="checkout-card"><h3 style="color:#6949bd">${coStates[coStatus(o)]}</h3><p class="muted">${o.status==='paid'?'课程已解锁，可在我的课程继续观看':'请在有效时间内完成付款'}</p></div><div class="checkout-card"><div class="mp-card">${cover(snapshot)}<div><h3>${esc(snapshot.name)}</h3><p class="muted">整门课程</p><span class="checkout-price">¥${coPrice(o).toFixed(2)}</span></div></div></div><div class="checkout-card"><div class="checkout-line"><span>课程原价</span><span>¥${coPrice(o).toFixed(2)}</span></div><div class="checkout-line"><span>优惠券优惠</span><span>-¥${Number(o.couponMoney||0).toFixed(2)}</span></div><div class="checkout-line"><span>积分抵扣</span><span>-¥${Number(o.pointsMoney||0).toFixed(2)}</span></div><div class="checkout-line"><span>${o.status==='paid'?'实付金额':'应付金额'}</span><span class="mp-price">¥${Number(o.amount).toFixed(2)}</span></div><div class="checkout-line"><span>订单备注</span><span class="value">${esc(o.buyerRemark||'无备注')}</span></div><div class="checkout-row-note">订单编号：${o.id}<br>创建时间：${o.created}${o.paidAt?'<br>付款时间：'+o.paidAt:''}</div></div></div><div class="mpbottom"><button class="mp-primary checkout-submit grow" onclick="${o.status==='paid'?'startLearning()':['pending','failed'].includes(o.status)?"goMP('payment')":"beginOrder()"}">${o.status==='paid'?'开始观看':['pending','failed'].includes(o.status)?'继续支付':'重新购买'}</button></div>`}

function expireCourseOrders(){let changed=false;for(const o of db.orders){if(!['pending','failed'].includes(o.status))continue;if(!o.expiresAt){const created=Date.parse(String(o.created).replace(' ','T')+'+08:00');if(Number.isFinite(created))o.expiresAt=created+1800000}if(o.expiresAt&&Date.now()>=o.expiresAt){o.status='cancelled';o.adminState='closed';o.closedAt=now();o.closeReason='超时未支付，系统自动关闭';o.logs??=[];o.logs.push({time:o.closedAt,actor:'系统',content:o.closeReason,change:'待付款 → 已关闭'});changed=true}}if(changed)save()}

function myOrderById(id){return myCourseOrders().find(o=>o.id===id)}
function openMyCourseOrder(id){const o=myOrderById(id);if(!o)return toast('订单不存在');mp.order=id;mp.id=o.course;goMP('user-order')}
function resumeMyCoursePayment(id){const o=myOrderById(id);if(!o)return toast('订单不存在');mp.order=id;mp.id=o.course;if(o.status==='paid')return startLearning();if(coStatus(o)==='closed'){goMP('user-order');return toast('订单已关闭，请重新购买')}o.status='pending';save();goMP('payment')}

function repurchaseMyCourseOrder(id){const o=myOrderById(id);if(!o)return;const c=find(o.course);if(!c||c.deleted||c.status!=='up')return toast('该课程暂不可购买');mp.order=null;mp.checkout=null;mp.id=o.course;beginOrder()}
function mobileCourseOrders(){const rows=myCourseOrders().filter(o=>mp.orderFilter==='all'||coStatus(o)===mp.orderFilter);return phoneHead('课程订单',"goMP('my')")+`<div class="mpbody no-footer"><div class="mp-order-tabs">${[['all','全部'],['pending','待付款'],['completed','已完成'],['closed','已关闭']].map(([k,label])=>`<button class="${mp.orderFilter===k?'active':''}" onclick="mp.orderFilter='${k}';renderMobile()">${label}</button>`).join('')}</div><div class="mp-order-list">${rows.map(o=>{const c=o.courseSnapshot||find(o.course)||{name:'课程已删除',id:o.course},st=coStatus(o);return `<article class="mp-order-card" onclick="openMyCourseOrder('${o.id}')"><div class="mp-order-card-head"><span class="mp-order-number">订单号：${o.id}</span><span class="tiny-tag">课程订单</span><span class="mp-order-state ${st}">${coStates[st]}</span></div><div class="mp-order-product">${cover(c)}<div class="mp-order-product-info"><h3>${esc(c.name)}</h3><p>整门课程</p><div class="mp-order-unit"><span>¥${coPrice(o).toFixed(2)}</span><small>×1</small></div></div></div><div class="mp-order-total">总价 ¥${coPrice(o).toFixed(2)}　<strong>${st==='completed'?'实付':'应付'} ¥${Number(o.amount).toFixed(2)}</strong></div><div class="mp-order-actions" onclick="event.stopPropagation()">${st==='pending'?`<button onclick="cancelMyCourseOrder('${o.id}')">取消订单</button><button class="accent" onclick="resumeMyCoursePayment('${o.id}')">继续支付</button>`:st==='completed'?`<button class="accent" onclick="watchMyCourseOrder('${o.id}')">观看课程</button>`:`<button class="accent" onclick="repurchaseMyCourseOrder('${o.id}')">重新购买</button>`}</div></article>`}).join('')||`<div class="empty" style="padding:70px 10px"><div style="color:#cbb9ec;margin-bottom:16px">${icon('book',44)}</div>暂无${mp.orderFilter==='all'?'':coStates[mp.orderFilter]}课程订单<p style="font-size:12px">选择适合自己的课程，开始陪伴学习</p><button class="mp-primary" onclick="goMP('list')">去看看课程</button></div>`}${rows.length?'<div class="mp-order-loading-note">没有更多订单了</div>':''}</div></div>`}
function cancelMyCourseOrder(id){const o=myOrderById(id);if(!o||coStatus(o)!=='pending')return;checkoutSheet('取消订单','<div class="checkout-sheet-text">确认取消这笔课程订单？取消后如需购买，需要重新下单。</div>',`<button class="mp-primary" onclick="confirmCancelMyCourseOrder('${id}')">确认取消订单</button>`)}

const finishWithPendingOrders=finishPay;finishPay=function(state){const o=currentOrder();if(!o)return;if(coStatus(o)==='closed')return toast('订单已关闭，请重新购买');if(o.status==='paid'){goMP('result');return}if(state==='cancelled'&&o.status!=='paid'){o.status='pending';o.adminState='pending';o.lastPaymentResult='cancelled';o.updated=now();o.logs??=[];o.logs.push({time:o.updated,actor:'用户',content:'取消本次支付，订单保留待付款',change:'待付款 → 待付款'});save();goMP('result');return}o.lastPaymentResult=state;finishWithPendingOrders(state)};

lick="resumeMyCoursePayment('${o.id}')">继续支付</button>`:st==='completed'?`<button class="mp-primary checkout-submit grow" onclick="watchMyCourseOrder('${o.id}')">观看课程</button>`:`<button class="mp-primary checkout-submit grow" onclick="repurchaseMyCourseOrder('${o.id}')">重新购买</button>`}</div>`};
