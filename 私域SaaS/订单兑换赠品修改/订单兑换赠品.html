const embeddedDoc="# 订单兑换赠品需求文档\n\n> 版本：V2.1｜更新日期：2026-11-03。本文已按当前原型归并最终规则，不再保留被后续修改替代的逐次追加说明。\n\n## 1. 业务背景\n\n### 1.1 需求描述\n\n1. 公域平台订单可在微信小程序参与订单兑换赠品。查询来源默认包括平台接口订单与运营导入的订单白名单。\n2. 公域店铺维护默认赠品池，活动可配置统一、按店铺或按店铺产品组发放规则；店铺维度支持不同门槛对应不同赠品的多阶梯配置。\n3. 赠品兑换成功表示获得赠品选择资格，不等于赠品已经领取。用户选择赠品后需完成收货信息提交；有运费时还需支付成功，才算领取成功。\n4. 赠品的规格、库存、重量、供应商、发货仓和运费模板由商品管理维护。\n\n### 1.3 目标结果\n\n1. 形成赠品商品维护、店铺配置、活动配置、公域订单验证、赠品选择、提单、支付、履约的完整链路。\n2. 支持运营Excel 导入白名单订单，并通过兑换数据、审核与订单详情追溯结果。\n\n### 1.4 本期范围\n\n1. 商品中心：商品列表、新建/编辑、赠品类型、规格及商品服务配置。\n2. 订单中心：订单列表、赠品订单详情及发货操作。\n3. 营销中心：订单兑换列表、新建/编辑、公域店铺、赠品设置、订单白名单、兑换数据及兑换审核。\n4. 微信小程序：订单兑换、成功弹窗、兑换记录、个人中心、我的赠品、赠品选择、确认订单、订单支付、支付结果、赠品及赠品订单详情。\n5. 兑换数据双工作表 Excel 导出、兑换审核 Excel 导出、白名单导入校验与操作日志。\n\n## 2. 关键业务规则\n\n### 4.1 唯一性 / 并发性\n\n1. 原型按公域订单号检查已兑换记录，接口订单、白名单订单及人工审核共享去重。命中多个同号订单时阻断，不自动选取第一条。\n2. 单订单兑换或累计兑换确认成功后保存结果：积分直接发放；赠品保存待选择资格，并标记实际来源订单已用于兑换。仅加入累计不视为已兑换；退出赠品选择不恢复订单次数。\n3. 同一赠品选择资格只确认一次。确认选择时生成所选 SKU 的领取记录并占用库存；返回后继续流程复用这些记录，不再次发放或扣库存。\n4. 人工审核通过前再次检查该公域订单是否已兑换，已兑换时禁止重复审核发奖。\n5. 同一用户、活动、累计范围形成一个持久集罐。全部订单移出后后台保留原ID和日志，再加入复用；小程序隐藏空罐。\n6. 单订单与累计兑换整单互斥；集罐兑换只执行一次最高达标档，锁定所有本次有效来源订单，不把超出门槛的余额留作重复兑换。\n\n### 4.2 字段定义\n\n#### 4.2.1 商品管理列表\n\n##### 页面路径\n\n商品中心—商品管理。\n\n##### 列表逻辑\n\n1. 商品类型包含普通商品、跨境商品、直邮商品、赠品。\n\n#### 4.2.2 商品新建 / 编辑\n\n##### 页面路径\n\n商品中心—商品管理—新增/编辑。\n\n##### 表单逻辑\n\n1. 基本信息：商品类型单选，包含赠品商品。\n2. 价格/库存可维护划线价、成本价、库存、重量、限购。批量填写包含这五项，并应用到所有规格行。\n3. 赠品成本价、主图非必填并去掉必填星号；划线价沿用选填。\n\n#### 4.2.3 订单管理列表\n\n##### 页面路径\n\n订单中心—订单管理。\n\n##### 列表逻辑\n\n1. 赠品订单单价统一显示 `¥0.00`；数量取实际领取/下单数量；优惠统一显示“—”，不展示赠品优惠抵扣。\n\n##### 列表交互\n\n1. 点击详情进入对应订单详情，携带实际订单ID。\n\n##### 手动发货\n\n1. 入口位置：订单管理列表中待发货订单的订单头提供“发货”；订单详情中待发货状态提供“发货”。支持普通订单、跨境订单、赠品订单。\n2. 点击打开PC后台发货弹窗，默认选择物流发货。弹窗内切换方式保留草稿，只展示、校验、保存最终方式相关字段；取消或关闭不修改订单。\n\n| 字段 / 操作 | 含义与填写方式 | 必填 / 默认 | 范围及限制 |\n| --- | --- | --- | --- |\n| 发货类型 | 单选：物流发货、送货上门、用户自提、虚拟发货 | 必填；默认物流发货 | 每次提交选择一种方式 |\n| 物流公司 | 下拉单选 | 物流发货必填；默认空 | 原型选项：顺丰、中通、圆通、申通、韵达、极兔、京东物流、邮政EMS、其他；正式以物流字典为准 |\n| 物流单号 | 文本输入 | 物流发货必填；默认空 | 去除首尾空格后1—50字，不允许空白值 |\n| 发货商品 | 按订单商品行勾选，展示图片、名称、属性、商品金额、数量 | 物流发货必填；初始一组物流选中全部商品 | 支持全选、半选；本单全部商品完整且唯一分配 |\n| 添加物流 | 新增一组物流公司、单号和商品选择 | 初始一组；新增组未选择商品 | 新增后不自动复制已有组商品 |\n| 删除 / 全部删除 | 删除当前物流组或全部物流组 | 直接修改草稿 | 全删后可再次添加；无物流组不可提交 |\n| 收货地址 | 读取订单地址 | 送货上门展示；只读 | 缺失显示“—” |\n| 配送人员 | 文本输入 | 送货上门选填；默认空 | 最多30字 |\n| 联系电话 | 文本输入 | 送货上门选填；默认空 | 填写时5—20个字符，允许数字、空格、+、括号、连字符；正式校验沿用联系电话规范 |\n| 自提地址 | 文本输入 | 用户自提选填；默认空；无必填星号 | 最多200字；留空也可确认发货 |\n| 发货备注 / 发货说明 | 多行文本 | 非物流方式选填；默认空 | 最多200字；虚拟发货字段名为“发货说明” |\n| 确定 | 校验并执行发货 | 有效待发货订单可提交 | 成功后关闭弹窗并刷新列表/详情 |\n\n3. 物流发货选择商品时，将该商品从其他物流组移除，避免一单商品被分配到多组；提交前仍需完整检查是否漏选或重复。\n4. 送货上门、用户自提、虚拟发货默认发送本单全部商品，不展示“发货商品”区域，不填写物流公司、物流单号。\n5. 切换发货方式后，隐藏字段不参与该方式校验。例如物流方式不因此前填写的配送电话错误而阻止提交。\n6. 确认后记录发货类型、发货时间、对应物流分组或配送/自提/说明信息。物流公司和单号可在详情汇总展示，多组物流保留各组商品关联。\n\n#### 4.2.4 订单兑换活动列表\n\n##### 页面路径\n\n营销中心—订单兑换。\n\n##### 列表逻辑\n\n1. 查询条件：活动类型为四种积分活动及两种赠品活动，订单金额固定积分、订单金额比例积分、商品数量固定积分、商品数量比例积分、订单金额固定赠品、商品数量固定赠品\n\n##### 列表交互\n\n1. 右上入口新增订单白名单。\n\n#### 4.2.5 订单兑换新建 / 编辑\n\n##### 页面路径\n\n营销中心—订单兑换—新增/编辑。\n\n##### 公共配置\n\n| 字段 | 含义与填写方式 | 必填 / 默认 | 范围及限制 |\n| --- | --- | --- | --- |\n| 活动类型 | 既有积分类型及订单金额固定赠品、商品数量固定赠品 | 沿用既有默认值 | 六种活动类型同一行展示；本次累计改造针对赠品类型 |\n| 兑换订单范围—开始时间 | 订单完成时间下界，日期时间选择 | 选填；默认空 | 包含该时间点 |\n| 兑换订单范围—结束时间 | 订单完成时间上界，日期时间选择 | 选填；默认空 | 包含该时间点；不得早于开始时间 |\n| 兑换维度 | 统一维度、店铺维度、店铺产品组维度 | 必填；沿用已有活动选择 | 本次独立方式、多阶梯与累计配置针对店铺/店铺产品组；统一维度沿用原单订单配置 |\n| 兑换方式 | 复选：单订单兑换、多订单累计兑换 | 每个店铺/产品组至少勾选一项；默认仅单订单 | 支持仅单订单、两者同时、仅累计 |\n| 赠品领取有效期 | 资格发放后允许领取的天数 | 选填；默认空 | 空白表示长期有效；填写时为1—365天正整数 |\n\n1. 订单范围说明固定为：“若配置，仅允许该时间范围内完成的订单”。\n2. 只设置开始时间时限制下界，只设置结束时间时限制上界，均不填则不限制订单完成时间。范围与活动自身开始/结束时间分开维护。\n3. 未勾选的兑换方式不展示、不执行，也不校验其门槛或赠品配置；数据作为草稿保留，重新勾选恢复。\n4. 取消最后一个已勾选方式时恢复原勾选并提示“请至少勾选一种兑换方式”。\n5. 历史未配置兑换方式标记的数据，视为启用单订单；已保存的累计启用状态保留。\n6. 保存成功更新活动及小程序实际执行配置；失败保留输入。取消未保存活动修改沿用确认放弃草稿交互。\n\n##### 分组及阶梯配置\n\n1. 添加店铺：只列出已有赠品池的公域店铺，支持名称搜索、勾选、全选、分页；已添加店铺不可再次选择。\n2. 添加产品组：弹窗标题“选择公域店铺产品组”，搜索项为产品组名称，表格字段为勾选框、店铺名称、产品组名称、默认积分、创建时间。\n   1. 仅列出启用的产品组；已添加项勾选且禁用，不能重复添加。\n   2. 支持跨页保留选择、当前页全选及半选、数字分页、每页10/20/50条；无新增选择时“确定”禁用。\n   3. 名称模糊搜索，搜索后回到第1页；取消不写入活动。\n   4. 默认积分只作产品组信息展示，不作为赠品阶梯门槛或奖励数。\n3. 添加后按“平台＋店铺”或“平台＋店铺＋产品组”分组。组标题展示店铺ID，提供添加阶梯、移除店铺/产品组；下方设置兑换方式。\n4. 每种启用方式各有阶梯表格，字段统一为：活动赠品规则、赠品设置、操作。单订单行文案为“订单满X元／商品满X件，可兑N个赠品”；累计行为“累计满X元／件，可兑N个赠品”。\n\n| 阶梯字段 | 必填 / 默认 | 范围及限制 |\n| --- | --- | --- |\n| 金额门槛X | 启用方式必填；新增默认空 | 大于0，最多两位小数，单位元 |\n| 数量门槛X | 启用方式必填；新增默认空 | 正整数，单位件 |\n| 可兑换赠品数N | 启用方式必填；默认1 | 正整数，不得超过该档不同SKU个数 |\n| 赠品设置（x） | 启用方式至少配置一个SKU | x为本档不同SKU数；点击打开活动店铺赠品设置 |\n| 删除 | 直接删除当前阶梯 | 不二次确认，未保存前只影响草稿 |\n\n5. 新增店铺/产品组、增加阶梯时带入所属店铺赠品池快照；各档独立修改，不反向修改公域店铺或其他阶梯。\n6. 单订单最后一档删除时移除对应分组；累计最后一档删除时，如单订单仍启用则关闭累计方式，如仅累计则保留待补充规则状态，需补充阶梯后保存。\n7. 移除店铺、产品组及删除阶梯直接执行，不二次确认。保存活动后生效，取消活动草稿不影响已保存配置。\n8. 批量设置可填写门槛、赠品个数，至少填写一项；只更新各分组当前启用方式的首档，空字段不覆盖，同时启用时分别更新两套首档。不修改后续阶梯及关闭方式的草稿。\n9. 批量设置前整体校验，任一首档SKU数不足或产生同方式重复门槛时，整批不写入。\n10. 配置区说明为“兑换取满足条件的最高阶梯。”，不再展示首档批量设置的长提示。\n11. 活动店铺页复用店铺分组配置和校验；使用独立草稿，保存只修改本活动店铺及规则，不覆盖其他打开的活动编辑草稿。\n\n##### 各阶梯赠品设置\n\n1. 弹窗标题“活动店铺赠品设置”，当前阶梯独立编辑。\n2. 顶部提供添加赠品、批量赠送数量、批量商品活动数量、批量设置。批量只填写一项时不覆盖另一项，未填写或无商品时不可执行。\n3. 添加赠品只从所属店铺赠品池选择SKU，已添加项禁用；支持全选、半选及确认，取消不写入。\n\n| 字段 | 含义 | 必填 / 默认 / 限制 |\n| --- | --- | --- |\n| 赠送数量 | 用户选中该SKU后获得的件数 | 必填，红色星号；正整数；初始读取店铺池配置 |\n| 库存数量 | 商品SKU库存 | 只读 |\n| 商品活动数量 | 本档该SKU活动数量限制 | 选填；非负整数；空白不限制 |\n| 排序值 | 赠品展示排序 | 非负整数；默认沿用池配置或0 |\n| 售价 | 读取商品当前价格 | 只读；不作为用户支付的商品金额 |\n| 商品名称 | 图片、名称、商品ID | 只读 |\n| 属性 | 当前SKU属性 | 只读；缺失显示“—” |\n| 规格数量 | SKU包装/规格数量 | 只读，与赠送数量分开 |\n| 删除 | 移除本档SKU | 直接删除，不修改店铺赠品池 |\n\n4. 保存校验至少一个SKU及数量、活动数量、排序值；回写当前阶梯。阶梯可兑换个数是否超过SKU数在活动整体保存时校验。\n5. 取消不修改阶梯；保存弹窗仅更新活动草稿，活动保存后生效。店铺池后续变化不自动覆盖已保存活动快照。\n\n#### 4.2.6 活动店铺\n\n1. 页面路径：营销中心—订单兑换—活动店铺。\n2. 添加店铺、批量首档规则、多阶梯增删、各档门槛及可兑换个数、从店铺赠品池选择赠品、移除店铺，与活动新建/编辑复用同一套规则。\n3. 页面使用独立编辑草稿；保存只更新该活动店铺及规则，不覆盖其他打开的新建/编辑页面，也不修改公域店铺默认赠品。\n4. 取消需确认放弃未保存修改；顶部不重复展示活动类型/兑换维度说明。\n\n#### 4.2.7 公域店铺列表\n\n##### 页面路径\n\n营销中心—订单兑换—公域店铺。\n\n##### 列表逻辑\n\n1. 列表字段：新增赠品数；赠品数按配置SKU行数统计。\n\n##### 列表交互\n\n1. 行内操作：新增赠品设置\n2. 点击赠品数或赠品设置打开赠品配置。\n\n#### 4.2.8 公域店铺赠品设置及商品选择\n\n1. 赠品设置弹窗只维护SKU及其赠送数量、商品活动数量、排序值。\n2. 明细表字段：赠送数量（红色必填星号）、库存数量、商品活动数量、排序值、售价、商品名称、属性、规格数量、操作。\n3. 赠送数量为正整数，默认1；商品活动数量选填，留空表示不限制，填写时为非负整数；排序值为非负整数，默认0。\n4. 批量设置仅包含赠送数量、商品活动数量。\n5. 添加赠品先打开商品选择弹窗，再打开规格选择弹窗；按商品+规格标识去重，同一商品可选择多个不同规格。\n6. 商品选择支持名称、类型、商品ID、品牌、SPU、分类、创建方式、商品状态条件及分页；只加入赠品类型商品。已加入规格不可重复添加。\n7. 配置阶段可查看下架/无库存商品；实际兑换及领取时检查上架和可用库存，不因已配置而免除校验。\n8. 保存所选规格后返回明细表。\n\n#### 4.2.9 订单白名单\n\n##### 页面路径\n\n营销中心—订单兑换—订单白名单。\n\n##### 列表逻辑\n\n1. 查询条件：订单号模糊、兑换状态（全部/未兑换/已兑换）。\n2. 列表字段：订单号、平台/店铺、订单金额、订单完成时间、订单商品、兑换状态、操作。\n3. 订单商品点击弹窗展示商品ID、商品名称、下单数量。\n4. 操作仅移除白名单。\n5. 右上角可查看操作日志、下载模板、导入订单。\n\n##### 列表交互\n\n1. 下载模板为一个 `.xlsx` 文件，两个工作表：\n   1. 订单维度：平台、店铺ID、订单号、订单完成时间、订单金额。\n   2. 商品维度：订单号、商品 ID、商品名称、下单数量。\n2. 两表一次上传，按订单号关联；订单维度订单号唯一，一订单可有多条商品明细。同号多店铺不能在同批中歧义关联。\n3. 表头按字段和顺序校验，忽略标题内空白及末尾空白列；实际缺列、错列或多余非空表头提示预期/实际表头。\n4. 平台、店铺ID须匹配现有店铺；订单金额非负且最多两位小数；完成时间支持Excel日期或北京时间文本，不可晚于当前时间；商品ID、名称必填，下单数量为正整数。\n5. 文件须为.xlsx，不超过10MB；单次最多5000个订单、20000条商品明细。不接受加密工作簿和公式结果未转为值的单元格。\n6. 保留文本ID前导零；过长数值型订单号/商品ID拒绝，提示改用文本。\n7. 校验重复订单、重复商品、缺明细、孤立明细、字段冲突；错误订单整单不进入待导入集合。相同已导入数据跳过，冲突或已兑换订单不覆盖。\n8. 校验预览显示可导入数、重复数、错误数以及工作表/行号/原因。用户点击确认导入后才写入完整有效订单；取消不导入。\n9. 移除白名单需确认，移除后从名单列表和白名单校验中排除，不回收既有兑换及赠品订单。\n10. 操作日志弹窗展示时间、操作人、操作类型、内容；记录模板下载、导入校验/失败、确认导入及移除白名单。当前实现未提供错误文件下载入口。\n\n#### 4.2.10 兑换数据\n\n##### 页面路径\n\n营销中心—订单兑换—兑换数据，包含兑换记录、集罐记录两个页签。\n\n##### 兑换记录\n\n1. 筛选按用户信息、用户昵称、活动名称、订单号/集罐ID、兑换店铺、活动状态、积分发放日期、赠品状态排列；不同条件AND。\n2. 字段：兑换记录ID、兑换订单号/集罐ID、兑换店铺、活动信息、用户信息、兑换积分、兑换赠品、奖励发放时间。活动信息展示名称、ID及活动类型，订单号旁不展示后台导入/平台接口说明。\n3. 单订单显示真实订单号并点击查看订单详情；集罐兑换显示集罐ID并点击查看全部来源订单，使用单订单/集罐标签区分。不能用首笔来源订单号代表整次累计兑换。\n4. 兑换赠品展示真实领取状态及赠品详情；无赠品显示—。赠品详情展示商品名称（图/名称/ID）、属性、规格数量、赠送数量、赠品订单号；未选择时展示候选池，选择后展示实际领取记录，未建单订单号为—。\n5. 点击赠品订单号进入后台赠品订单详情。查询、导出和详情都保留订单来源关联。\n6. 集罐记录字段、明细和日志见4.2.21。操作列仅日志，订单明细统一从集罐订单列进入，不重复提供两个入口。\n\n#### 4.2.11 兑换审核\n\n##### 页面路径\n\n营销中心—订单兑换—兑换审核。\n\n##### 列表逻辑\n\n1. 待审核不展示已发奖励；通过为积分时显示“+N 积分”和兑换店铺；通过为赠品时仅显示“赠品未领取/赠品已领取”和兑换店铺；驳回显示意见。\n2. 已通过赠品的领取状态由真实领取/支付结果计算，不以审核通过代替领取成功。\n3. 待审核提供审核入口；已审核可查看只读详情。\n\n##### 列表交互\n\n1. 赠品审核弹窗按以下顺序展示：\n   1. 申请信息：下单平台、申请店铺名称、申请人/手机号、用户ID、申请活动及ID、提交时间、补充说明、订单截图。\n   2. 审核结果：通过/驳回单选，默认通过。\n   3. 通过时选择兑换店铺，自动带出该店铺配置的赠品；表格展示商品名称、属性、规格数量、赠送数量、操作。\n   4. 审核意见最多200字符，通过选填、驳回必填；底部取消、确定。\n2. 切换店铺立即更新赠品列表，保留已填意见；提交前不改写原申请。申请店铺与实际兑换店铺分别保存。\n3. 通过时需选有效店铺且至少存在可领取赠品，保存店铺赠品池快照，生成待选择资格，不立即扣减候选池全部商品库存。\n4. 用户之后按资格上限选择赠品；上限优先取对应活动配置，缺失时按最多可领处理，并不超过赠品SKU数。\n5. 通过前检查订单未兑换；重复审核不重复发奖。已审核详情只读，按审核时保存的赠品配置回显。\n6. 有订单截图时可点击放大，无图显示暂无订单截图，不生成模拟凭证图片。\n7. 驳回意见未填写时阻止提交；取消不保存。\n\n#### 4.2.12 小程序订单兑换及成功弹窗\n\n##### 页面路径\n\n微信小程序—订单兑换。\n\n1. 同一活动全部分组仅启用累计时，输入按钮文案为“添加订单”；其他情况沿用“立即兑换”。\n2. 仅单订单：输入订单，校验后直接执行单订单兑换；仅累计且唯一匹配累计分组：输入后加入累计；同时支持：展示兑换方式底部弹层。多个可加入的累计分组时，通过下拉选择目标分组。\n3. 底部弹层限制在手机画布内：遮罩只覆盖手机，顶部圆角、居中标题、右上角关闭；两张卡片的可用按钮采用相同紫色渐变、白字、尺寸、圆角，不通过颜色突出任一方式。\n4. 弹层标题“请选择兑换方式”；展示订单号及“可参与的兑换赠品活动”。\n\n| 卡片 | 展示内容 | 按钮与状态 |\n| --- | --- | --- |\n| 本单兑换赠品 | 单个订单满X件/元，可兑换N个赠品 | “立即兑换赠品”；未达标展示原因并禁用 |\n| 店铺集罐兑换赠品 | 累计满X件/元，可兑换N个赠品；本单加入后累计Y件/元，满X件/元即可兑换 | “将本单加入累计”；已累计兑换的分组不可再次加入 |\n\n5. 单订单展示实际最高达标档，未达标则展示最低档。累计展示本单加入后可达的最高档，仍未达标则展示最低档；加入后已达标时，进度文案为“本单加入后累计Y件/元，已达到兑换门槛”。门槛及赠品个数重点展示。\n6. 底部提示：“同一订单不可重复兑换。两种方式可选的赠品可能不同，详情请咨询在线客服。”客服入口沿用既有能力，不新增真实客服接入。\n7. 选择单订单兑换：成功生成奖励资格，展示兑换成功奖励弹窗，继续选择赠品、确认收货订单。\n8. 选择加入累计：成功后仅提示“已加入累计”，直接进入集罐独立页并定位对应店铺/产品组，不显示奖励成功弹窗。\n\n9. 赠品兑换成功弹窗展示候选奖励及可选择个数，点击进入赠品选择。积分成功直接展示实际积分；一个订单不同时发放积分和赠品。关闭弹窗不撤销资格或恢复订单兑换次数。\n\n#### 4.2.13 小程序兑换记录\n\n##### 页面路径\n\n订单兑换—兑换记录。\n\n##### 页面逻辑\n\n1. 页签为全部、兑换成功、兑换失败；记录按时间倒序展示。\n2. 卡片展示平台、店铺、结果、奖励类型、兑换订单、奖励数量及时间。\n3. 赠品未选择、已选择但未提单、已提单但未付运费，都显示点击领取；完成免运费提单或运费支付后显示查看订单。\n4. 失败记录展示提交订单号、失败原因和时间，不展示已发奖励。\n\n##### 页面交互\n\n1. 点击领取进入我的赠品—赠品选择。已选内容保留；未建单继续确认订单，有待付款订单继续原单支付。\n2. 查看订单：只关联一个赠品订单时直接进入赠品订单详情；关联多个赠品订单时进入我的赠品—已领取列表。\n\n3. 当前已保存活动至少一个分组启用累计时，在兑换记录页右侧展示订单集罐记录竖向悬浮入口；不与奖励记录混排，不占状态筛选栏。兑换主页不展示该入口。点击进入4.2.19独立页面。\n\n#### 4.2.14 个人中心及我的赠品\n\n##### 页面路径\n\n微信小程序—个人中心—我的赠品。\n\n##### 页面逻辑\n\n1. 我的赠品保留全部、待领取、已领取、已失效筛选；从个人中心进入默认全部。待选择赠品归入全部及待领取。\n2. 未完成选择、提单或运费支付的资格展示待选择赠品及选择赠品入口。\n3. 已领取卡片展示图片、名称、属性/规格、数量和查看订单。\n4. 可领取的历史独立资格卡片保留立即领取入口，不额外显示“待领取”字样；可显示有效期或长期有效。当前新兑换流程优先使用待选择资格入口。\n5. 已失效赠品保留商品信息，内容置灰并显示“已失效”印章，禁止领取。待选择资格到期时显示失效，不开放继续选择。\n6. 全部为空时展示插画及去兑换赠品入口；单状态为空展示对应状态无赠品。\n\n##### 页面交互\n\n1. 选择赠品进入选择页；未建单继续确认订单，有待付款订单继续支付。\n2. 已领取商品点击或查看订单进入赠品订单详情；未领取商品详情使用同一套卡片风格，展示赠品信息并保留立即领取，失效时禁用。\n3. 已发货可通过物流入口查看物流。\n\n#### 4.2.15 赠品选择\n\n1. 页面路径：我的赠品—赠品选择，也可由兑换成功弹窗、兑换记录点击领取进入。\n2. 首次选择展示该次兑换保存的候选SKU、商品图片/名称、属性、赠送数量、可选N个说明和已选数量。\n3. 最少选择1个、最多N个不同SKU。达到上限后其他未选项禁用；无库存、已下架或活动数量不足的SKU不可选择。\n4. 确认领取再次校验资格有效期和库存，生成所选领取记录并占用对应SKU数量，然后进入确认订单。\n5. 已确认选择但未完成提单/支付时，重新进入展示原选择，不再分配第二批赠品；确认后继续确认订单或原单支付。\n6. 选择页返回不删除资格、不重复恢复已占用库存；尚未确认的勾选不视为领取成功。\n\n#### 4.2.16 确认订单\n\n1. 页面路径：我的赠品—赠品选择/立即领取—确认订单。\n2. 页面模块：收货地址、赠品商品信息、费用明细、订单备注、购买须知、底部总计及提交订单。\n3. 商品展示图片、名称、规格、金额 `¥0.00` 及数量。数量默认该资格赠送数量，步进范围为1至该资格数量，不能超过已分配数量。\n4. 费用明细展示商品原价 `¥0.00`、运费、订单备注。运费按所选SKU商品运费相加。\n5. 提交时再次验证资格未领取/未失效及地址完整。失败保留输入，不重复创建订单。\n6. 运费为0：生成待发货订单并进入成功页；运费大于0：生成待付款订单并进入订单支付页。\n\n#### 4.2.17 支付及结果\n\n1. 页面路径：确认订单—订单支付—支付结果，或免运费提单直接到支付结果样式的成功页。\n2. 支付页展示实际待付运费、订单编号及支付方式。\n\n#### 4.2.18 小程序赠品及订单详情\n\n1. 已领取赠品订单详情按最终参考图展示：订单状态、物流摘要、收货信息、商品明细、应付合计、商品总额、运费、订单信息及底部操作。\n2. 商品明细显示名称、图片、属性、实付0元和实际领取数量；订单信息含订单编号、下单、支付、发货、完成时间及备注，缺失时间为“—”。\n3. 收货手机号在该详情中脱敏；订单编号可复制。物流弹窗展示已有运单及节点。\n4. 待付款显示支付运费；待收货/已发货显示查看物流、确认收货；已完成显示查看物流、去评价/查看评价；其他状态提供我的赠品入口。\n5. 确认收货需确认，成功后记录完成时间。评价仅已完成订单可提交，保存后可查看，不能重复评价。\n6. 未领取商品详情展示赠品信息、领取有效期、赠送数量和费用；立即领取进入确认订单，已失效时禁用。\n\n#### 4.2.19 小程序订单集罐记录独立页\n\n1. 固定入口只在“兑换记录”页展示，采用类似活动规则的右侧竖向悬浮标签；兑换主页不展示入口、不展示累计列表。\n2. 当前已保存活动至少一个店铺或产品组启用多订单累计时才显示入口；均未启用则隐藏，不预留空位。\n3. 仅列出本人已加入累计或已用于累计兑换订单的分组，未添加的分组不显示，全部订单已移出的分组隐藏。历史实际参与记录可查，不允许从历史分组兑换当前活动奖励。\n4. 精简卡片展示：\n   1. 第一行：平台、店铺、“已累计X件/元”；已兑换时展示兑换时累计值及“已兑换”。\n   2. 产品组维度补充产品组名称，用于区分同店铺不同组。\n   3. 下方展示各档兑换规则和订单明细入口，不展开逐笔订单。\n   4. 不展示累计进度条，不展示“已达标/未达标”文案，不展示无操作意义的禁用兑换按钮。\n5. 未兑换且当前活动启用累计时提供“继续添加订单”，返回订单兑换页并聚焦输入框；达到任一累计阶梯后提供“兑换赠品”。\n6. 累计兑换成功后进入既有奖励成功弹窗及领取链路。用户关闭弹窗或暂未提单，仍可从兑换记录/集罐记录继续领取，不可重新兑换。\n7. 已兑换卡片显示“领取赠品”或“查看订单”，按实际领取状态判断。关联一个赠品订单进入详情，多个订单沿用我的赠品—已领取列表。\n8. 从兑换记录进入时返回兑换记录；从添加订单成功进入时返回订单兑换。空列表提供“去添加订单”。\n\n#### 4.2.20 小程序累计订单明细\n\n1. 点击分组“订单明细（n笔）”打开底部弹层，背景保留集罐独立页。\n2. 顶部展示平台、店铺，产品组维度补充产品组名称。\n3. 每笔订单精简为两行：第一行订单号、数量、金额；第二行完成时间，右侧为“移出累计”按钮。不再展示“累计中”状态。\n4. 未用于兑换的订单可直接移出；已用于兑换的订单不显示移出按钮。\n5. 移出后状态改为已移出累计，重新计算进度并刷新页面；最后一笔移出后明细为空，关闭/返回时对应分组隐藏。\n6. 关闭弹层回到集罐页；明细层保留返回集罐记录操作。连续查看、移出、返回不得丢失当前页面或遗留遮罩。\n\n#### 4.2.21 后台集罐记录\n\n##### 页面定位与记录粒度\n\n1. 页面路径：营销中心—订单兑换—兑换数据—集罐记录。与兑换记录并列页签，不新增一级或二级菜单；原订单参与明细按订单展示的方式由集罐汇总取代。\n2. 一条集罐由用户ID、活动ID、累计范围共同确定；店铺维度的范围为店铺ID，产品组维度为店铺ID＋产品组ID。同一用户在不同店铺、产品组、活动分别建罐，不合并累计。\n3. 首笔订单成功加入后创建集罐并生成唯一集罐ID。仅配置累计但没有用户加入订单时，不生成空罐。\n4. 全部订单移出后后台仍保留集罐ID、开始时间、订单历史、日志；后续再次加入同一范围复用原罐。用户端隐藏没有有效参与订单的空罐。\n5. 集罐状态独立于赠品领取状态。兑换成功已生成奖励资格即为已兑换，不等待选择赠品、填写地址或支付运费。\n\n##### 筛选、排序与分页\n\n| 条件 | 类型 / 默认 | 查询逻辑 |\n| --- | --- | --- |\n| 集罐ID | 文本；默认空 | 模糊匹配完整集罐ID |\n| 用户信息 | 文本；默认空 | 昵称、手机号、用户ID任一匹配，字段内部OR |\n| 活动名称 | 下拉单选；默认全部 | 按活动ID匹配，显示活动名称 |\n| 集罐状态 | 下拉单选；默认全部 | 累计中、已兑换、已结束 |\n\n1. 不同条件之间AND；点击搜索从第1页查询，下拉切换立即查询，清空恢复全部条件及第1页。\n2. 按更新时间倒序，每页20条，当前页超出范围时回到最大有效页；无结果显示暂无符合条件的记录。\n3. 查询只读取有权限的集罐，不通过缺失用户信息补造昵称或手机号；手机号缺失显示“—”。正式手机号脱敏按既有数据权限执行。\n\n##### 列表字段及入口\n\n| 字段 | 来源与展示规则 | 可点击操作 |\n| --- | --- | --- |\n| 集罐ID | 首次加入生成的唯一编号；刷新、移出、再加入均不变化 | 本列只展示编号 |\n| 用户信息 | 用户昵称、手机号、用户ID，分行展示 | 无 |\n| 活动信息 | 活动名称、活动ID、活动类型；活动缺失读取已保存信息 | 无 |\n| 累计范围 | 平台、店铺名；产品组维度补充产品组名称 | 无 |\n| 累计数量／金额 | 未兑换统计当前有效参与订单；已兑换统计本次已使用订单的累计值。数量单位件，金额单位元、两位小数，金额缺失明确显示缺失 | 无 |\n| 集罐订单 | “X笔订单”；X为该罐历史加入过的不同订单数，包含已移出订单，同一订单再加入不重复计数 | 唯一的订单明细入口，打开集罐订单明细弹窗 |\n| 集罐状态 | 累计中、已兑换、已结束 | 无 |\n| 开始集罐时间 | 首笔订单首次成功加入时间，不随清空或再次加入重置 | 无 |\n| 更新时间 | 最近加入、移出、累计兑换成功时间；仅查看不更新时间 | 无 |\n| 关联兑换记录 | 未兑换显示“—”；成功后关联本次兑换记录ID | 打开关联兑换记录弹窗 |\n| 操作 | 仅“日志” | 打开集罐操作日志；不重复提供订单明细，不提供删除集罐或人工改状态 |\n\n1. 时间展示为北京时间YYYY-MM-DD HH:mm:ss。缺失历史数据显示“—”，不使用当前查看时间代替真实开始时间。\n2. 空罐的当前累计值为0，集罐订单仍展示历史笔数，可查看已移出状态及日志；没有兑换结果时关联兑换记录仍为“—”。\n3. 一个罐在本活动中只累计兑换一次，已兑换罐不继续接受新订单。新增活动形成新罐，不复用其他活动的ID。\n\n##### 集罐订单明细弹窗\n\n1. 点击集罐订单列“X笔订单”打开PC后台弹窗，标题展示集罐订单明细及集罐ID；关闭后保留原列表筛选、页码和滚动位置。\n2. 弹窗字段：\n\n| 字段 | 展示规则 |\n| --- | --- |\n| 订单号 | 原公域订单号，保留完整值，可点击查看该订单详情 |\n| 平台 | 来源订单所属平台 |\n| 店铺名 | 来源订单所属店铺，不以当前活动其他店铺替代 |\n| 订单完成时间 | 订单数据中的真实完成时间，缺失“—” |\n| 有效数量 | 该订单对本罐有效贡献的数量；产品组只统计组内商品 |\n| 有效金额 | 该订单对本罐有效贡献的金额；缺失“—”，0元显示¥0.00 |\n| 订单状态 | 已加入累计、已移出累计、已用于累计兑换 |\n\n3. 已移出订单继续展示，但不计入当前累计；不因用户端移出而删除后台历史。再次加入后展示最新状态，历次加入/移出过程由日志保留。\n4. 点击订单号进入既有订单详情弹窗，包含基本信息、商品明细、物流信息三个页签。切换页签保持本订单上下文；提供返回集罐订单入口，返回原罐全部来源订单，不回到其他集罐。\n5. 此弹窗只读，不提供后台移出累计操作。用户移出仍在小程序集罐订单明细中执行。\n\n##### 关联兑换记录弹窗\n\n1. 展示兑换记录ID、集罐ID、活动名称、兑换时间、奖励及赠品领取状态，提供查看全部来源订单入口。\n2. 未兑换、奖励生成失败的集罐不创建虚假关联记录。兑换成功后，集罐与奖励记录双向关联，不拿首笔来源订单号代表整个集罐。\n3. 关闭关联详情不改变集罐、资格或领取状态；再次查看读取同一兑换结果。\n\n##### 集罐日志与空罐保留\n\n1. 操作列只保留日志。弹窗字段为日志ID、操作人、操作描述、关联订单号、操作时间，按时间倒序。\n2. 记录成功加入、成功移出、累计兑换及来源订单锁定；首次加入同时确立集罐开始时间。页面查看、重复被拒绝的加入不产生第二笔有效贡献。\n3. 同一订单加入、移出、再次加入时保留完整操作历史；集罐订单笔数不按事件次数累加。\n4. 全部订单移出后，后台保留集罐及日志，不提供删除操作；用户端隐藏空罐，后台可通过ID、用户、活动继续查询。\n5. 迁移已有累计数据时，为能够关联的用户、活动、范围生成集罐ID，保留真实已知时间、来源订单和奖励；历史时间无法还原时标为缺失，不补造。迁移不得重复发奖或重置订单锁定。\n\n##### 集罐状态判定\n\n| 状态 | 判定条件 | 记录与操作 |\n| --- | --- | --- |\n| 累计中 | 尚无兑换结果，活动进行中且该范围仍启用累计 | 可累计；空罐仍可保持累计中，不能用是否为空判定活动结束 |\n| 已兑换 | 已成功生成累计奖励资格并关联兑换记录 | 状态优先级最高，领取未完成也属于已兑换；查看订单、关联奖励及日志 |\n| 已结束 | 无兑换结果，活动已结束/非进行中、活动不存在或该累计规则已停用 | 保留历史，只读；不重新发放累计奖励 |\n\n##### 兑换记录的订单号／集罐ID\n\n1. 列名和搜索项统一为“兑换订单号/集罐ID”，使用单订单/集罐标签区分。\n2. 单订单兑换显示原公域订单号，点击查看订单详情；集罐兑换显示唯一集罐ID，点击打开该罐全部来源订单明细。\n3. 按集罐ID查询可定位累计兑换结果；底层真实来源订单关联继续保留，不把集罐ID当成平台订单号查询接口或创建赠品订单。\n4. 单订单历史记录不生成集罐；历史累计记录关联对应集罐，不重复生成奖励。导出规则见6.1。\n\n### 4.3 计算规则\n\n1. **数量口径：**店铺维度累计有效订单商品数量；产品组维度仅统计订单中商品ID命中该组的商品数量，不计其他商品。\n2. **金额口径：**店铺维度使用有效订单实付金额；产品组维度仅使用命中组商品的行实付总额。金额按分累计后以元、两位小数展示，不能用整单金额代替产品组金额。\n3. **单订单阶梯：**按当前订单有效数量或金额，取不高于实际值的最高门槛，不按配置行顺序取最高档，不叠加低档。\n4. **累计阶梯：**按同一用户、活动及分组中“已加入累计”且仍有效的订单求和，取最高达标档。兑换前重查订单限制、有效性、时间、归属及分组匹配。\n5. 同一订单商品命中多个产品组时，单订单按配置顺序取首个达标组，再在组内取最高档；累计可加入的分组由用户选择，一笔订单只加入一个分组。\n6. 数量/金额等于门槛视为达标。未达到最低档不能兑换，但满足基础条件时可以加入累计。\n7. 累计兑换成功锁定本次全部有效参与订单，不仅锁定刚好凑够门槛的部分，也不保留超出门槛的可再用余额。无效订单不计入本次奖励。\n8. “可兑换赠品数”统计可选的不同SKU；“赠送数量”指选中该SKU后实际发几件。例：可选1个SKU、保温杯赠送数量2，用户获得2只保温杯。\n9. 达标组全部候选SKU不可领取时提示暂无可领取赠品，不自动降档。后续选择、库存占用、运费及提单校验沿用原领取规则。\n\n| 示例 | 输入 | 结果 |\n| --- | --- | --- |\n| 单订单阶梯 | 满15/20/30件对应三档，本单25件 | 只获得20件档资格 |\n| 累计数量 | 产品组111/222/333，三单分别6/5/9件 | 累计20件；其他商品不计入 |\n| 累计金额 | 组内实付60元＋80元，订单其他商品500元 | 组内累计140元，不是640元 |\n| 订单互斥 | A订单已生成单订单奖励资格，但尚未填写地址 | A不能加入累计；其他未使用订单仍可加入 |\n| 累计一次 | 累计35件，最高档门槛30件并兑换 | 本次有效来源订单锁定；该分组本活动内不再累计兑换 |\n\n10. 赠品领取成功：无运费提单成功，或有运费支付成功；只选择或生成待付款订单不算领取成功，但不解除来源订单的兑换锁定。\n11. 商品金额为0，订单应付为运费。领取时间按免运费提单时间或运费支付成功时间。\n12. 资格有效期为空长期有效，否则发放时间加D天并保存快照；库存于确认所选SKU时按赠送数量扣减，候选池资格发放时不占用全部候选库存。\n\n### 4.4 关键联动逻辑\n\n1. 自动兑换：商品/店铺配置 → 活动规则 → 用户输入订单 → 校验成功并标记已兑换 → 积分成功弹窗或赠品成功弹窗。\n2. 赠品领取：成功弹窗/我的赠品/兑换记录 → 赠品选择 → 确认订单 → 免运费成功，或待付款 → 支付成功 → 成功页 → 订单详情。\n3. 中途退出：未提单/未支付 → 我的赠品仍为待选择 → 恢复原选择 → 继续原提单/支付；不重新发奖、扣库存或建单。\n4. 人工审核：待审核 → 积分通过直接发积分；赠品通过保存所选兑换店铺赠品池及限选数 → 用户按同一领取链路继续；驳回保存原因，不发奖励。\n5. 配置快照：公域店铺默认赠品变更不覆盖已保存的活动独立配置；活动编辑不回改已发资格；已审核赠品详情读取审核时配置。\n6. 同步状态：领取结果驱动我的赠品、兑换记录、兑换数据、审核列表；发货、确认收货和评价更新赠品订单。\n7. 多订单查看：兑换记录关联一个赠品订单直接查看；多个进入我的赠品—已领取列表。\n8. 订单限制优先于兑换资格校验。两个来源同号或来源冲突不静默合并。\n\n9. 多订单累计：输入订单 → 校验并加入累计 → 集罐独立页 → 最高档达标后兑换 → 生成资格、锁定所有有效来源订单 → 奖励成功弹窗 → 原赠品领取流程。\n10. 订单用途互斥及集罐留存：单订单兑换后的订单不可累计；未兑换的累计订单可移出；空罐后台保留ID/历史/日志，小程序隐藏；重新加入复用原罐。\n11. 发货类型及状态、字段详见4.2.3；物流、上门、自提进入待收货，虚拟发货直接完成。\n\n### 4.5 异常处理规则\n\n| 场景 | 页面处理 |\n| --- | --- |\n| 订单号为空 | 提示请输入单号进行兑换，不新增兑换记录 |\n| 未找到订单 | 提示核对订单号，记录失败尝试用于兑换失败页签 |\n| 已兑换 | 阻止再次发奖；存在未选赠品资格时可恢复选择，否则提示查看兑换记录 |\n| 同号多个订单 | 提示核对平台和店铺，不自动取首条 |\n| 活动状态、店铺、完成时间、门槛或次数不符 | 提示具体原因，不发奖励 |\n| 无可用赠品/库存不足 | 阻止确认，保留资格和已填信息，不提示领取成功 |\n| 超过SKU选择上限 | 限制继续勾选，提示最多选择N个 |\n| 领取资格已失效 | 展示失效状态，禁止新选择/新提单 |\n| 收货信息不完整 | 提示并打开地址编辑，不提交订单 |\n| 未同意购买须知 | 提交按钮禁用 |\n| 重复审核/提单/支付 | 读取已有状态，不重复创建奖励或订单 |\n| 驳回无意见 | 阻止提交，提示填写审核意见 |\n\n### 4.6 数据来源\n\n1. 公域订单来源为预置接口订单或确认导入的白名单；审核材料来自已有申请记录，缺失图片/物流不补造。\n\n\n2. 产品组金额必须取得组内商品实付总额，不能用整单金额替代。白名单现有商品维度缺少该字段时不允许此类金额核验，正式补充接口/导入方案待确认。\n3. 平台买家与小程序用户归属、真实接口查询、并发/幂等、退款影响及角色权限为正式接入项；原型本地模拟不代表已接通。\n\n## 5. 状态与异常\n\n### 5.1 业务状态\n\n1. 我的赠品筛选：全部、待领取、已领取、已失效；待选择属于待领取范围。\n2. 赠品订单：待付款、待发货、待收货、已完成、已关闭；后台已发货页签对应待收货。\n3. 白名单：页面仅区分未兑换/已兑换，移除后不在列表展示。\n4. 集罐状态：累计中、已兑换、已结束；来源订单状态保留已加入累计、已移出累计、已用于累计兑换。空罐不自动等同于已结束。\n\n\n### 5.2 状态-操作矩阵\n\n| 对象状态 | 页面操作 | 结果/限制 |\n| --- | --- | --- |\n| 活动待开始 | 编辑、复制、删除、推广、日志；赠品店铺维度可进活动店铺 | 统一维度不显示活动店铺 |\n| 活动进行中 | 编辑、复制、立即结束、推广、日志；符合条件展示活动店铺 | 结束不回收已发资格 |\n| 活动已结束 | 复制、删除、推广、日志；赠品店铺维度可进活动店铺 | 不重新开启当前兑换 |\n| 审核待审核 | 通过/驳回、选择相应奖励、填意见 | 只发一种奖励 |\n| 审核通过/驳回 | 只读详情、日志 | 通过赠品显示实际领取状态 |\n| 赠品未选择 | 选择赠品 | 确认后生成所选资格并占用库存 |\n| 已选择、未提单 | 仍显示待选择，恢复选择/确认订单 | 不再次扣库存 |\n| 有运费、未支付 | 仍显示待选择，恢复原单支付 | 不重复建单，不算已领取 |\n| 免运费提单成功/运费支付成功 | 查看订单，进入已领取 | 已关联一个订单直达详情，多个到已领取列表 |\n| 赠品已失效 | 查看信息及失效标志 | 禁止新领取 |\n| 订单待付款 | 支付运费、查看详情 | 支付成功后待发货及成功页 |\n| 订单待发货 | 用户查看；后台备注、四类发货 | 物流/上门/自提待收货，虚拟发货已完成 |\n| 订单待收货/已发货 | 查看物流、确认收货 | 确认后已完成 |\n| 订单已完成 | 查看物流、去评价/查看评价 | 不重复提交评价 |\n| 导入校验完成 | 确认导入、取消 | 仅导入有效完整订单 |\n| 白名单已兑换/未兑换 | 查看商品、移除 | 移除不撤销已发奖励 |\n| 集罐累计中（含空罐） | 后台集罐订单、关联信息、日志；小程序可添加/移出/达标兑换 | 小程序隐藏空罐，后台不删除 |\n| 集罐已兑换 | 查看已使用订单、关联兑换、日志；用户继续领取/查看订单 | 领取未完成也不可重复兑换 |\n| 集罐已结束 | 查询历史订单与日志 | 不允许当前已结束规则新增兑换 |\n\n### 5.3 状态流转\n\n1. 积分：输入订单 → 验证通过 → 标记兑换成功/发放积分 → 成功弹窗 → 我的积分。\n2. 赠品：输入订单 → 验证通过 → 标记兑换成功/创建待选择资格 → 成功弹窗 → 赠品选择 → 确认订单。\n3. 免运费：确认订单提交 → 待发货/领取成功 → 成功页 → 订单详情。\n4. 有运费：确认订单提交 → 待付款/仍未领取 → 支付成功 → 待发货/领取成功 → 成功页。\n5. 中断：未提单或未支付 → 我的赠品待选择 → 恢复所选内容或原支付订单；不重新验证兑换或重复扣库存。\n6. 审核：待审核 → 驳回（不发奖励），或通过 → 积分发放/待选择赠品资格 → 与自动兑换共用后续流程。\n7. 履约：待发货 → 物流/上门/自提 → 待收货 → 确认收货 → 已完成 → 评价；虚拟发货确认后直接已完成。\n8. 累计：未使用订单 → 已加入累计 → 可移出后重新参与，或达标兑换后已用于累计兑换；来源订单锁定与资格同时生成。\n\n## 6. 衍生需求与默认授权项\n\n### 6.1 导出\n\n1. 兑换数据：当前筛选全量结果导出 `.xlsx`，文件名 `兑换数据_YYYY-MM-DD.xlsx`，包含两个工作表。\n   1. sheet1字段顺序：活动名称、活动ID、用户ID、用户昵称、兑换订单号/集罐ID、兑换积分、积分发放时间、赠品状态、赠品领取时间、兑换店铺、电商平台。\n   2. sheet2字段顺序：兑换订单号/集罐ID、兑换店铺、电商平台、赠品名称、赠品ID、属性、规格数量、赠送数量、订单号。\n   3. sheet1每条兑换一行；sheet2按实际SKU/领取记录展开，尚未选择时沿用当前赠品详情的候选池快照。积分记录不生成赠品明细行。\n   4. 赠品奖励兑换积分为0，积分发放时间留空；无赠品的赠品状态为“—”。未领取时间留空，已领取取提单/支付时间。\n2. 兑换审核：当前筛选全量结果导出 `.xlsx`，文件名 `兑换审核_YYYY-MM-DD.xlsx`，单工作表“兑换审核”。\n   1. 字段顺序：下单平台、店铺名称、提交单号、补充说明、活动ID、用户昵称、用户ID、提交时间、截图、审核时间、审核结果、兑换积分、赠品状态、兑换店铺、关联产品组。\n   2. 下单平台/店铺名称取原申请店铺，兑换店铺取审核实际选择，不混用。\n   3. 只有审核通过的积分奖励填写实际积分，其他为0；审核通过的赠品填写已领取/未领取，其他为“—”。\n   4. 截图导出链接，多张按换行分隔；关联产品组导出实际记录的组名称，未关联留空，不根据店铺全部产品组推断。\n3. Excel冻结首行、设置列宽和筛选，ID保留文本，积分及数量为数值，时间列使用日期格式。导出无数据时提示，不下载空数据文件。\n4. 商品及订单原有导出入口保持各自范围，不强行套用上述两类字段；当前原型基础导出仍采用CSV，商品导入修改也使用CSV，不代表全部文件功能已统一成Excel。\n\n5. 两个Sheet的兑换订单号/集罐ID：单订单填真实公域单号，累计填集罐ID。赠品订单号字段保持原含义；集罐真实来源订单通过集罐明细追溯，不新增第三个Sheet。\n\n### 6.2 集罐与发货日志\n\n集罐记录操作列只保留日志；首次加入、移出、再加入、兑换及锁定均可追溯。空罐保留历史。发货记录订单、类型、操作者、时间及必要履约信息。后台订单明细从集罐订单列唯一进入。\n\n### 6.3 正式接入与待确认\n\n1. PC后台使用后台对话框；小程序使用手机画布内底部弹层，支持关闭、遮罩关闭及内容滚动，页面切换清理弹层。\n2. 原型通过本地模拟数据实现联动及刷新持久化，不具备真实并发控制、支付、平台订单查询、买家账号绑定、物流承运服务或正式权限校验。\n3. 原型已覆盖字段校验、三种兑换组合、订单用途互斥、累计重算、集罐独立页、来源订单锁定及四种发货方式；正式接口需补齐事务、幂等及数据权限。\n4. **待确认：**秒级时间选择、活动重叠校验范围、产品组行实付接口/导入字段、退款后奖励处理、角色权限及业务规模上限。未确认项不应被理解为当前原型已实现。\n5. 虚拟发货当前按确认即已完成实现；若正式系统存在虚拟权益到账确认或失败回滚，需要另行补充状态，不在本期默认引入。\n\n### 6.4 关联文档\n\n[订单发货及订单兑换活动修改需求文档](./订单发货及订单兑换活动修改需求文档.md)按用户指定模板整理本次增量的完整字段、状态、权限、日志及验收边界，两份文档同步维护。\n";

function menu(q=''){menus.innerHTML=Object.entries(groups).map(([g,ps])=>{let found=ps.filter(p=>names[p].includes(q));return found.length?`<b>${g}</b>${found.map(p=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${names[p]}</button>`).join('')}`:''}).join('')||'<div class="empty">暂无匹配报表</div>'}
function go(p){page=p;if(!opened.includes(p))opened.push(p);render()}function closeTab(p){opened=opened.filter(x=>x!==p);if(!opened.length)opened=['config'];if(page===p)page=opened.at(-1);render()}
function tabContext(e,p){e.preventDefault();context.style.cssText=`display:block;left:${e.clientX}px;top:${e.clientY}px`;context.innerHTML=`<button onclick="closeTab('${p}')">关闭当前</button><button onclick="opened=['${p}'];go('${p}')">关闭其他</button><button onclick="opened=['config'];go('config')">关闭全部</button>`}document.addEventListener('click',()=>context.style.display='none');
function render(){menu();tabs.innerHTML=opened.map(p=>`<button class="${p===page?'active':''}" onclick="go('${p}')" oncontextmenu="tabContext(event,'${p}')">${names[p]} <span onclick="event.stopPropagation();closeTab('${p}')">×</span></button>`).join('');main.innerHTML=views[page]();}
function phone(title,content,back=''){return `<div class="phone"><div class="status">10:14 <span style="float:right">▮▮▮ Wi-Fi ▰</span></div><div class="mpnav">${back?`<button onclick="go('${back}')">‹</button>`:''}<span style="margin-left:${back?'24':'0'}px">${title}</span></div><div class="capsule">··· │ ⊙</div><div class="mpbody">${content}</div></div>`}
function table(headers,rows){return `<table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">暂无符合条件的记录</td></tr>`}</tbody></table>`}

function activityMore(e,id){clearTimeout(window.activityHoverTimer);let x=db.activities.find(a=>a.id===id),r=e.currentTarget.getBoundingClientRect(),m=document.getElementById('hovermenu');m.innerHTML=`${x.dimension==='店铺维度'&&(isGiftActivity(x)||x.status==='进行中')?`<button onclick="openActivityStores('${id}');hideHover()">活动店铺</button>`:''}${x.status!=='已结束'?`<button onclick="promoteActivity('${id}');hideHover()">推广</button>`:''}<button onclick="showLogs('${id}');hideHover()">日志</button>`;m.style.cssText=`display:block;left:${Math.min(r.left,innerWidth-130)}px;top:${Math.min(r.bottom,innerHeight-(m.querySelectorAll('button').length*32+8))}px`;e.currentTarget.onmouseleave=()=>window.activityHoverTimer=setTimeout(hideHover,80);m.onmouseenter=()=>clearTimeout(window.activityHoverTimer);m.onmouseleave=()=>window.activityHoverTimer=setTimeout(hideHover,80)}
let promotionState=null;
function promotionDataUri(svg){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function promotionCodeSvg(){let dots='';for(let r=0;r<6;r++){let radius=40+r*10,n=18+r*9;for(let i=0;i<n;i++){if((i*7+r*11)%5===0)continue;let theta=i/n*Math.PI*2;dots+=`<circle cx="${100+Math.cos(theta)*radius}" cy="${100+Math.sin(theta)*radius}" r="${r%2?1.7:2.1}" fill="#333"/>`}}return `<svg xmlns="http://www.w3.org/2000/svg" width="220" height="250" viewBox="-10 -10 220 250"><rect x="-10" y="-10" width="220" height="250" fill="white"/>${dots}<circle cx="100" cy="100" r="24" fill="#6949bd"/><path d="M89 101c-13-12 6-25 14-14 12 13-6 25-14 14m15-2c13 12-6 25-14 14" fill="none" stroke="white" stroke-width="5"/><text x="100" y="225" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#888">小程序码示意</text></svg>`}
function promotionDefaultPoster(){return promotionDataUri(`<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1000" viewBox="0 0 750 1000"><defs><linearGradient id="bg" x2=".7" y2="1"><stop stop-color="#c49af5"/><stop offset=".55" stop-color="#ece1ff"/><stop offset="1" stop-color="#fff0f7"/></linearGradient><radialGradient id="light"><stop stop-color="white" stop-opacity=".8"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient></defs><rect width="750" height="1000" rx="12" fill="url(#bg)"/><path d="M375 530 60 0h100zm0 0L280 0h120zm0 0L590 0h120zm0 0L750 240v150zm0 0L0 270v160z" fill="white" opacity=".16"/><circle cx="375" cy="500" r="360" fill="url(#light)"/><text x="50" y="75" fill="white" font-size="30" font-family="sans-serif" font-weight="bold">YOU · 会员好礼</text><text x="375" y="255" text-anchor="middle" fill="#7946d5" stroke="white" stroke-width="12" paint-order="stroke" font-family="sans-serif" font-size="100" font-weight="bold">好礼兑不停</text><text x="375" y="307" text-anchor="middle" fill="#8860c5" font-size="22" font-family="sans-serif" letter-spacing="3">REDEEM YOUR REWARDS</text><g transform="translate(60 330) scale(3.3)">${giftHero().replace(/<svg[^>]*>|<\/svg>/g,'')}</g><ellipse cx="375" cy="844" rx="280" ry="38" fill="#d6c2f5" opacity=".6"/><text x="65" y="913" fill="#6949bd" font-size="23" font-family="sans-serif">复制订单号 · 领取会员好礼</text><text x="65" y="950" fill="#999" font-size="17" font-family="sans-serif">兑换后请前往个人中心领取赠品</text></svg>`)}
function promoteActivity(id){let a=db.activities.find(x=>x.id===id);promotionState={id,tab:'link',title:a.shareTitle||a.name,shareImage:a.shareImage||promotionDefaultPoster(),poster:a.poster||a.posterImage||promotionDefaultPoster()};modal.style.width='800px';renderPromotion();modal.showModal()}
function promotionNav(){return `<aside class="promotion-nav"><button class="${promotionState.tab==='link'?'active':''}" onclick="switchPromotionTab('link')">小程序<br>链接与二维码</button><button class="${promotionState.tab==='share'?'active':''}" onclick="switchPromotionTab('share')">小程序<br>分享设置</button></aside>`}
function switchPromotionTab(tab){promotionState.tab=tab;renderPromotion()}
function promotionUpload(key,poster=false){let src=promotionState[key];return `<label class="promotion-upload ${poster?'portrait':''}" title="点击上传图片"><img src="${esc(src)}"><input hidden type="file" accept="image/png,image/jpeg,image/webp" onchange="uploadPromotionImage(this.files[0],'${key}')"></label>`}
function renderPromotion(){let p=promotionState,a=db.activities.find(x=>x.id===p.id),path=a.miniProgramPath||'pages/order-exchange/index?activityId='+p.id,link=a.miniProgramLink||'',code=a.miniProgramCode||promotionDataUri(promotionCodeSvg());modal.classList.add('promotion-dialog');modal.innerHTML=`<div class="gift-modal-head"><h1>推广</h1><button class="link" onclick="closePromotion()">×</button></div><div class="promotion-layout">${promotionNav()}${p.tab==='link'?`<section class="promotion-poster-preview"><img class="promotion-poster-image" src="${esc(p.poster)}"><img class="promotion-code-overlay" src="${esc(code)}" alt="${a.miniProgramCode?'小程序码':'小程序码示意'}"></section><section class="promotion-link-fields"><div><h3>小程序链接</h3><div class="promotion-copy"><input id="promotionMiniLink" readonly value="${esc(link)}" placeholder="生成后显示小程序链接"><button ${link?'':'disabled'} onclick="copyPromotionValue('promotionMiniLink')">复制链接</button></div></div><div><h3>小程序路径</h3><div class="promotion-copy"><input id="promotionMiniPath" readonly value="${esc(path)}"><button onclick="copyPromotionValue('promotionMiniPath')">复制链接</button></div></div><div class="promotion-download"><button onclick="downloadPromotion('code')">＋ 下载小程序码</button><button onclick="downloadPromotion('poster')">＋ 下载海报</button></div></section>`:`<section class="promotion-share-preview"><h3>小程序分享卡片设置</h3><div class="promotion-chat"><div class="promotion-avatar"></div><div class="promotion-card"><div class="promotion-card-brand">◉　YOU母婴</div><div class="promotion-card-title" id="promotionTitlePreview">${esc(p.title)}</div><img id="promotionSharePreview" src="${esc(p.shareImage)}"><div class="promotion-card-footer">小程序</div></div></div></section><section class="promotion-share-fields"><h3 class="req">分享标题</h3><input id="promotionShareTitle" maxlength="50" value="${esc(p.title)}" placeholder="请输入分享标题" oninput="promotionState.title=this.value;document.getElementById('promotionTitlePreview').textContent=this.value"><h3 class="req">分享图</h3>${promotionUpload('shareImage')}<small>分享图尺寸建议：宽高比例5:4；适用于分享给好友与微信朋友圈</small><h3>海报</h3>${promotionUpload('poster',true)}<small>海报尺寸建议：750px×1000px；适用于分享海报</small></section>`}</div><div class="modalfooter">${p.tab==='link'?'<button onclick="closePromotion()">关闭</button>':'<button onclick="closePromotion()">取消</button><button class="primary" onclick="savePromotion()">保存</button>'}</div>`}
function closePromotion(){promotionState=null;modal.close()}
async function uploadPromotionImage(file,key){if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type))return toast('请上传PNG、JPG或WEBP图片');if(file.size>4*1024*1024)return toast('图片请小于4MB');let result=await new Promise(resolve=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)});if(!promotionState)return;promotionState[key]=result;renderPromotion()}
async function copyPromotionValue(id){let value=document.getElementById(id).value;if(!value)return;try{await navigator.clipboard.writeText(value);toast('复制成功')}catch(e){let field=document.getElementById(id);field.select();if(document.execCommand('copy'))toast('复制成功');else toast('请手动复制已选中的内容')}}
function savePromotion(){let p=promotionState;if(!p.title.trim())return toast('请输入分享标题');if(!p.shareImage)return toast('请上传分享图');let a=db.activities.find(x=>x.id===p.id);Object.assign(a,{shareTitle:p.title.trim(),shareImage:p.shareImage,poster:p.poster,updated:stamp()});try{save('活动推广设置 '+p.id)}catch(e){return toast('保存失败，请减小上传图片后重试')}closePromotion();render();toast('推广设置已保存')}
async function downloadPromotion(kind){let a=db.activities.find(x=>x.id===promotionState.id),src=kind==='code'?(a.miniProgramCode||promotionDataUri(promotionCodeSvg())):promotionState.poster;try{let img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=src});let canvas=document.createElement('canvas');canvas.width=kind==='code'?440:750;canvas.height=kind==='code'?500:1000;let ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);if(kind==='poster'){let code=new Image();await new Promise((ok,no)=>{code.onload=ok;code.onerror=no;code.src=a.miniProgramCode||promotionDataUri(promotionCodeSvg())});ctx.drawImage(code,535,745,170,194)}canvas.toBlob(blob=>{if(!blob)return toast('图片导出失败');let url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download=(kind==='code'?(a.miniProgramCode?'小程序码':'小程序码示意'):'活动海报')+'_'+a.id+'.png';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('图片已下载')},'image/png')}catch(e){toast('图片下载失败，请检查上传图片')}}
modal.addEventListener('close',()=>{modal.classList.remove('promotion-dialog');promotionState=null});

let activityStoresId=null;
let activityStoresDraft=null;
function activityRuleDraft(){return page==='activitystores'?activityStoresDraft:activityDraft}
function activityStoreRuleExpression(a,r,id){if(isGiftActivity(a))return giftThresholdInput(a,r,id);let goods=a.type.includes('数量'),every=a.type.includes('比例'),prefix=`activityRuleDraft().storeRules[${JSON.stringify(id)}]`;return `<div class="gift-rule-expression">${goods?'商品':'订单'}${every?'每满':'满'} <input aria-label="店铺${id}兑换门槛" type="number" min="${goods?'1':'0.01'}" step="${goods?'1':'0.01'}" value="${r.threshold??''}" placeholder="${goods?'商品数量':'订单金额'}" oninput='${prefix}.threshold=this.value===\"\"?\"\":+this.value'> ${goods?'件':'元'}，可兑换 <input aria-label="店铺${id}兑换积分" type="number" min="1" step="1" value="${r.pointsValue??''}" placeholder="积分" oninput='${prefix}.pointsValue=this.value===\"\"?\"\":+this.value'> 积分</div>`}
function openActivityStores(id){let original=db.activities.find(a=>a.id===id);if(!original)return toast('活动不存在');activityStoresId=id;activityStoresDraft=normalizeActivityDraft(structuredClone(original));activityStoresDraft.stores=activityStoresDraft.stores.filter(id=>store(id));activityStoresDraft.stores.forEach(id=>{if(!activityStoresDraft.storeRules[id])activityStoresDraft.storeRules[id]={threshold:original.threshold??'',pointsValue:original.pointsValue??''}});names.activitystores='活动店铺';go('activitystores')}
views.activitystores=()=>{let a=activityStoresDraft;if(!a||a.id!==activityStoresId)return '<div class="empty">活动不存在</div>';return `<div class="topactions"><button class="link" onclick="cancelActivityStores()">‹ 活动店铺 · ${esc(a.name)}</button><span><button onclick="cancelActivityStores()">取消</button> <button class="primary" onclick="saveActivityStores()">保存</button></span></div><div class="activity-stores-workspace">${activityStoreRuleBox(a)}</div>`}
function cancelActivityStores(){if(!confirm('确认离开？当前未保存的活动店铺修改将不会保存。'))return;activityStoresDraft=null;go('activities')}
function saveActivityStores(){let a=activityStoresDraft,gift=isGiftActivity(a),goods=a.type.includes('数量');if(!a.stores.length)return toast('请至少添加一个店铺');for(let id of a.stores){let r=a.storeRules[id];if(gift&&r?.singleEnabled===false)continue;if(!store(id)||!r||!Number.isFinite(r.threshold)||r.threshold<=0||(goods?!Number.isInteger(r.threshold):Math.abs(r.threshold*100-Math.round(r.threshold*100))>0.000001))return toast((store(id)?.name||'店铺')+'的兑换门槛不正确');if(gift?!validateGiftConfig(r):!Number.isInteger(r.pointsValue)||r.pointsValue<1)return toast(store(id).name+(gift?'的赠品配置或可兑换个数不正确':'的兑换积分须为正整数'))}let original=db.activities.find(x=>x.id===a.id);if(!original)return toast('活动已不存在');original.stores=[...a.stores];original.storeRules=structuredClone(a.storeRules);original.updated=stamp();if(db.config.activityId===a.id)Object.assign(db.config,{stores:[...original.stores],storeRules:structuredClone(original.storeRules)});save('保存活动店铺及规则 '+a.id);activityStoresDraft=normalizeActivityDraft(structuredClone(original));toast('活动店铺及规则已保存');render()}


function hideHover(){document.getElementById('hovermenu').style.display='none'}function endActivity(id){if(!confirm('是否立即结束，结束后用户将不可新增兑换？'))return;let a=db.activities.find(a=>a.id===id);a.status='已结束';a.end=stamp().replace(' ','T');save('结束活动 '+id);hideHover();render()}function deleteActivity(id){if(!confirm('是否确认删除？'))return;db.activities=db.activities.filter(a=>a.id!==id);save('删除活动 '+id);hideHover();render()}

views.config=()=>{if(!activityDraft){activityDraft=structuredClone(db.activities[0]);currentActivity=db.activities[0].id;}let a=normalizeActivityDraft(activityDraft);return `${topactions(names.config,'persistActivity()','cancelActivity()')}<div class="visualgrid"><div class="activitypreview"><div class="banner" ${a.background?`style="background:url('${esc(a.background)}') center/cover"`:''}><small style="color:white;text-align:left">14:00</small><p>订单兑换</p><h3>好礼兑不停</h3>${a.background?'':giftHero()}</div><div class="previewcard"><input placeholder="请输入指定店铺订单号" disabled><button class="primary" disabled>立即兑换</button><button disabled>兑换记录</button></div><div class="previewcard"><b id="previewName">${esc(a.name||'活动规则说明')}</b><p class="hint">${[a.points?'积分':'',a.coupon?'优惠券':'',a.gift?'赠品':''].filter(Boolean).join(' + ')}</p></div></div><div><section class="formsection sect" id="abasic"><h2>基本信息</h2>${formrow('活动类型',`<div class="seg activity-type-options">${activityTypeOptions.map(t=>`<button class="${a.type===t?'selected':''}" onclick="changeActivityType('${t}')">${t}</button>`).join('')}</div>`,true)}${formrow('活动名称',textinput(a,'name','输入活动名称，限50字符','text','maxlength="50"'),true)}${formrow('活动时间',`<div style="display:flex;gap:8px"><input type="datetime-local" value="${a.start||''}" onchange="activityDraft.start=this.value"><span>至</span><input type="datetime-local" value="${a.end||''}" onchange="activityDraft.end=this.value"></div>`)}${formrow('活动背景图',`${imageUploader('activityDraft','background')} <button class="link" onclick="activityDraft.background='';render()">恢复默认图</button><small>尺寸建议750×900px，适用于页面头部背景</small>`,true)}<div class="row"><label>活动规则</label><div class="wide">${editor(a,'rules')}</div></div>${formrow('兑换次数限制',`${textinput(a,'limit','0表示不限制','number','min="0" step="1"')}<small>每个用户本次活动可成功兑换的订单数，0或不填表示不限</small>`)}</section><section class="formsection sect" id="arules"><h2>规则设置</h2>${renderActivityRules(a)}</section><section class="formsection sect" i function reviewAudit(id){let x=db.audits.find(a=>a.id===id),read=x.status!=='待审核',available=store(x.store).gifts;modal.innerHTML=`<h1>${read?'审核详情':'兑换审核'}</h1><form id="reviewForm"><h2>审核信息</h2><div class="row"><label>审核结果 *</label><select name="result" ${read?'disabled':''}><option ${x.status==='通过'?'selected':''}>通过</option><option ${x.status==='驳回'?'selected':''}>驳回</option></select></div><div class="row"><label>兑换积分</label><input type="number" name="points" min="0" step="1" value="${x.points}" ${read?'disabled':''}></div><p>兑换赠品</p>${available.map(pid=>`<p><label><input type="checkbox" name="gift" value="${pid}" ${x.gift.includes(pid)?'checked':''} ${read?'disabled':''}> ${esc(prod(pid).name)} · ${esc(prod(pid).sku)} × 1（可用库存 ${prod(pid).stock}）</label></p>`).join('')}<small>只可审核订单所属店铺已配置的赠品，通过时发放领取资格。</small><p>审核意见</p><textarea name="opinion" maxlength="200" style="width:100%;height:80px" ${read?'disabled':''}>${esc(x.opinion)}</textarea><h2>提交信息</h2><p>平台 / 店铺：${store(x.store).platform} / ${esc(store(x.store).name)}</p><p>单号：${x.order}</p><p>用户：${esc(x.user)} · ${x.mobile}</p><p>申请赠品：${x.gift.map(pid=>esc(prod(pid).name)).join('、')||'无'}</p><div class="modalfooter"><button type="button" onclick="modal.close()">${read?'关闭':'取消'}</button>${read?'':'<button class="primary">提交审核</button>'}</div></form>`;reviewForm.onsubmit=e=>{e.preventDefault();let f=new FormData(reviewForm),status=f.get('result'),gifts=f.getAll('gift'),points=+f.get('points'),opinion=f.get('opinion').trim();if(status==='驳回'&&!opinion)return toast('驳回时请填写审核意见');if(!Number.isInteger(points)||points<0)return toast('积分须为非负整数');if(status==='通过'){if(db.redemptions.some(r=>r.order===x.order))return toast('订单已兑换，不能重复审核发奖');if(gifts.length>reviewActivityGiftLimit(x)||gifts.some(pid=>!prod(pid).on||prod(pid).stock<1))return toast('赠品选择超限或库存不足');if(!points&&!gifts.length)return toast('通过时至少发放一种奖励');let r={id:uid('EX'),activity:x.activity,order:x.order,store:x.store,user:x.user,uid:x.uid,source:'人工审核',time:stamp(),points,coupon:false,claims:[],reward:points+'积分'};gifts.forEach(pid=>{let c={id:uid('CL'),product:pid,sourceOrder:x.order,user:x.uid,expires:giftExpiry(db.config.days),order:null};prod(pid).stock--;db.claims.push(c);r.claims.push(c.id)});db.redemptions.unshift(r)}Object.assign(x,{status,gift:gifts,points,opinion,reviewed:stamp()});save('审核 '+id+'：'+status);modal.close();render();toast('审核完成，奖励状态已更新')};modal.showModal()}

function deletePublicStore(id){if(!confirm('是否确认删除该公域店铺？'))return;if(db.activities.some(a=>(a.stores||[]).includes(id))||db.orders.some(o=>o.store===id)||db.redemptions.some(r=>r.store===id)||db.audits.some(a=>a.store===id))return toast('该店铺已关联活动或订单记录，暂不可删除');db.stores=db.stores.filter(s=>s.id!==id);save('删除公域店铺 '+id);render();toast('店铺已删除')}

function storeEdit(id){let s=id?store(id):{name:'',id:'',platform:'天猫'};modal.innerHTML=`<h1>${id?'编辑':'新建'}公域店铺</h1><form id="storeForm"><div class="row"><label>店铺名称 *</label><input name="name" required maxlength="50" value="${esc(s.name)}"></div><div class="row"><label>店铺ID *</label><input name="id" required value="${esc(s.id)}" ${id?'readonly':''}></div><div class="row"><label>电商平台 *</label><select name="platform">${['天猫','京东','淘宝','抖音','拼多多','其他'].map(p=>`<option ${s.platform===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="modalfooter"><button type="button" onclick="modal.close()">取消</button><button class="primary">保存</button></div></form>`;storeForm.onsubmit=e=>{e.preventDefault();let f=new FormData(storeForm),v={name:f.get('name').trim(),id:f.get('id').trim(),platform:f.get('platform')};if(!id&&db.stores.some(s=>s.id===v.id))return toast('店铺ID已存在');if(id)Object.assign(s,v);else db.stores.push({...v,gifts:[],groups:[]});save('保存店铺 '+v.id);modal.close();render()};modal.showModal()}
function ensurePublicStoreGroups(s){if(!s.groups)s.groups=[{name:'150积分',productIds:['NG000274','NG000272','NG000273','NG000846','NG000847','NG000845','300693','300699'],points:150,enabled:true}];return s.groups}

function togglePublicProductGroup(id,index){let s=store(id),g=s.groups[index];if(!confirm(`确认${g.enabled?'禁用':'启用'}该产品组？`))return;g.enabled=!g.enabled;s.updated=stamp();save((g.enabled?'启用':'禁用')+'产品组 '+id+' '+g.name);render();productGroups(id)}

function editPublicProductGroup(id,index){let g=index==null?{name:'',productIds:[],points:'',enabled:true}:store(id).groups[index];groupEditDialog.innerHTML=`<div class="gift-modal-head"><h1>${index==null?'新增':'编辑'}产品组</h1><button class="link" onclick="groupEditDialog.close()">×</button></div><form id="publicGroupForm"><div class="group-form-row"><label class="req" for="publicGroupName">产品组名称</label><div class="group-form-control group-name-control"><input id="publicGroupName" name="name" required maxlength="50" value="${esc(g.name)}" placeholder="例如：爆款口红系列" oninput="document.getElementById('publicGroupNameCount').textContent=this.value.length+' / 50'"><span id="publicGroupNameCount">${(g.name||'').length} / 50</span></div></div><div class="group-form-row"><label class="req" for="publicGroupIds">商品 ID 列表</label><div class="group-form-control"><textarea id="publicGroupIds" name="productIds" required placeholder="10001&#10;10002&#10;10003">${esc((g.productIds||[]).join('\n'))}</textarea><small>输入商品编码ID，支持以换行（回车）或逗号分隔录入多个商品</small></div></div><div class="group-form-row"><label for="publicGroupExcludedIds">不参与商品ID</label><div class="group-form-control"><textarea id="publicGroupExcludedIds" name="excludedProductIds" placeholder="请输入不参与的商品ID（选填）">${esc((g.excludedProductIds||[]).join('\n'))}</textarea><small>支持换行或逗号分隔，填写的商品不计入本产品组兑换数量和金额</small></div></div><div class="group-form-row"><label for="publicGroupPoints">默认积分：</label><div class="group-form-control"><input id="publicGroupPoints" name="points" type="number" min="1" step="1" value="${g.points??''}" placeholder="正整数，配置此维度默认分值"></div></div><div class="group-form-row"><label for="publicGroupState">产品组状态：</label><div class="group-form-control"><input id="publicGroupState" name="enabled" type="checkbox" role="switch" aria-label="产品组状态" class="group-state-switch" ${g.enabled?'checked':''}></div></div><div class="modalfooter"><button type="button" onclick="groupEditDialog.close()">取消</button><button class="primary">确定</button></div></form>`;groupEditDialog.querySelector('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),ids=[...new Set(f.get('productIds').split(/[\s,，;；]+/).map(x=>x.trim()).filter(Boolean))],points=f.get('points')===''?null:+f.get('points');if(!name||!ids.length)return toast('请填写产品组名称及商品ID列表');if(points!==null&&(!Number.isInteger(points)||points<1))return toast('默认积分须为正整数');let s=store(id);if(s.groups.some((g,i)=>i!==index&&g.name===name))return toast('该店铺已存在同名产品组');let excludedProductIds=[...new Set(String(f.get('excludedProductIds')||'').split(/[\s,，;；]+/).map(x=>x.trim()).filter(Boolean))];let v={name,productIds:ids,excludedProductIds,points,enabled:f.get('enabled')==='on',createdAt:index==null?stamp():s.groups[index].createdAt||s.groups[index].created||''};if(index==null)s.groups.push(v);else s.groups[index]={...s.groups[index],...v};s.updated=stamp();save((index==null?'新增':'编辑')+'产品组 '+id+' '+name);groupEditDialog.close();render();productGroups(id);toast('产品组已保存')};groupEditDialog.showModal()}

function removeGiftSetting(i){if(!confirm('是否确认删除该赠品规格？'))return;storeDraft.rows.splice(i,1);renderGiftSettings()}
function batchGiftSettings(){let values={quantity:giftBatchQuantity.value,activityStock:giftBatchActivityStock.value};if(!storeDraft.rows.length)return toast('请先添加赠品');if(Object.values(values).every(v=>v===''))return toast('请填写批量设置内容');if(Object.entries(values).some(([k,v])=>v!==''&&(!Number.isInteger(+v)||+v<(k==='quantity'?1:0))))return toast('赠送数量须为正整数，活动数量须为非负整数');storeDraft.rows.forEach(r=>Object.entries(values).forEach(([k,v])=>{if(v!=='')r[k]=+v}));renderGiftSettings();toast('批量设置已写入明细')}

views.products=()=>{let a=filteredProducts(),rows=sliced(a);return `<div class="page-tabs">${['全部商品','已上架','已下架'].map(t=>`<button class="${!showDeletedProducts&&productTab===t?'selected':''}" onclick="setProductTab('${t}')">${t}</button>`).join('')}<button style="margin-left:auto" onclick="showDeletedProducts=!showDeletedProducts;selectedProducts.clear();query()">${showDeletedProducts?'返回商品列表':'＋ 已删除商品'}</button></div><div class="toolbar product-search">${field('商品名称','name')}${field('商品类型','type','select',['普通商品','跨境商品','直邮商品','赠品'])}${field('商品品牌','brand','select',[...new Set(db.products.map(p=>p.brand).filter(Boolean))])}${field('所属SPU','spu','select',['宝宝日常用品','品牌礼赠系列'])}${field('商品ID','id')}<button aria-label="搜索" class="searchbtn" onclick="query()">${searchIcon}</button><button onclick="more.products=!more.products;render()">${more.products?'收起搜索':'更多搜索'} <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><path d="${more.products?'m1 7 4-4 4 4':'m1 3 4 4 4-4'}"/></svg></button><div class="right"><button onclick="exportProducts()">导出</button><button onclick="importProductChanges()">导入修改</button><button class="primary" onclick="newProduct()">⊕ 新增</button></div></div>${more.products?`<div class="morefilter">${field('API商品编码','api')}${field('商品分类','category','select',[...new Set(db.products.map(p=>p.category).filter(Boolean))])}${field('创建方式','source','select',['手动创建','API对接'])}<button class="link" onclick="clearFilter()">清空</button></div>`:''}<div class="product-scroll" id="productScroll"><table class="product-grid"><colgroup>${[40,240,90,100,160,95,140,80,115,80,80,80,80,90,155,155,80,150,140].map(n=>`<col style="width:${n}px">`).join('')}</colgroup><thead><tr><th class="p-check"><input id="productSelectAll" type="checkbox" onchange="selectProductPage(this.checked)"></th>${['商品名称','SPU','品牌','分类','商品来源','发货仓','售价','API商品编码','总库存','访客数','访问量','销量','虚拟销量','创建时间','更新时间','状态','提示','操作'].map((x,i)=>`<th class="${i===0?'p-name':i===17?'p function deleteProducts(){let a=db.products.filter(p=>selectedProducts.has(p.id)&&!p.deleted);if(!a.length)return toast('请先选择商品');if(a.some(p=>p.on||db.stores.some(s=>s.gifts.includes(p.id))||db.claims.some(c=>c.product===p.id)))return toast('已上架或被店铺 / 领取资格引用的商品不可删除');if(!confirm('是否确认删除所选商品？'))return;a.forEach(p=>{p.deleted=true;p.deletedAt=stamp();productLog(p.id,'删除商品','已下架','已删除')});selectedProducts.clear();render();toast('商品已移至已删除商品')}
function restoreProduct(id){if(!confirm('确认恢复该商品？恢复后为已下架状态。'))return;let p=prod(id);p.deleted=false;p.on=false;productLog(id,'恢复商品','已删除','已下架');render()}
function batchEditProducts(){if(!selectedProducts.size)return toast('请先选择商品');modal.innerHTML=`<h1>批量修改 · 已选${selectedProducts.size}件商品</h1><form id="batchProductForm"><p>库存（留空不修改）</p><input type="number" min="0" step="1" name="stock"><p>虚拟销量（留空不修改）</p><input type="number" min="0" step="1" name="virtualSales"><div class="modalfooter"><button type="button" onclick="modal.close()">取消</button><button class="primary">保存</button></div></form>`;batchProductForm.onsubmit=e=>{e.preventDefault();let f=new FormData(batchProductForm),stock=f.get('stock'),vs=f.get('virtualSales');if(stock===''&&vs==='')return toast('请至少填写一项');if([stock,vs].some(v=>v!==''&&(!Number.isInteger(+v)||+v<0)))return toast('请输入非负整数');let a=db.products.filter(p=>selectedProducts.has(p.id)&&!p.deleted);if(stock!==''&&a.some(p=>p.skus?.length>1))return toast('多规格商品请进入编辑页逐项修改库存');a.forEach(p=>{if(stock!==''){let before=p.stock;p.stock=+stock;if(p.skus?.length)p.skus[0].stock=+stock;productLog(p.id,'批量修改库存',before,p.stock,'库存')}if(vs!=='')p.virtualSales=+vs;p.updated=stamp()});save('商品批量修改');modal.close();render();toast('修改已保存')};modal.showModal()}
function importProductChanges(){modal.innerHTML=`<h1>导入修改商品</h1><p class="hint">演示文件为CSV，商品ID用于精确匹配，库存与虚拟销量为非负整数。</p><button onclick="download('商品ID,库存,虚拟销量\\nG001,20,100','商品导入修改模板.csv')">下载模板</button><p><input id="productChangeFile" type="file" accept=".csv"></p><pre id="productImportResult"></pre><div class="modalfooter"><button onclick="modal.close()">关闭</button><button class="primary" onclick="applyProductImport()">确认导入</button></div>`;modal.showModal()}
async function applyProductImport(){let file=productChangeFile.files[0];if(!file)return toast('请选择CSV文件');let lines=(await file.text()).replace(/^\ufeff/,'').trim().split(/\r?\n/);if(lines.shift()!=='商品ID,库存,虚拟销量')return toast('请使用模板表头');let updates=[],errors=[],seen=new Set();lines.forEach((line,i)=>{let [id,stock,vs]=line.split(',').map(x=>x.trim()),p=prod(id);if(!p||p.deleted||seen.has(id)||![stock,vs].every(v=>v!==''&&/^\d+$/.test(v))||p.skus?.length>1)errors.push('第'+(i+2)+'行：商品不存在、重复、数据无效或为多规格商品');else updates.push({p,stock:+stock,vs:+vs});seen.add(id)});if(errors.length){productImportResult.textContent=errors.join('\n');return toast('请修正错误后重新导入，本次未修改数据')}updates.forEach(({p,stock,vs})=>{productLog(p.id,'导入修改库存',p.stock,stock,'库存');p.stock=stock;if(p.skus?.length)p.skus[0].stock=stock;p.virtualSales=vs;p.updated=stamp()});save('导入修改商品 '+updates.length+'条');modal.close();render();toast('导入修改成功')}

lder="元"><span>库存</span><input id="batchStock" type="number" min="0" step="1" placeholder="数量"><span>重量(kg)</span><input id="batchWeight" type="number" min="0" step="0.01" placeholder="kg"><span>限购</span><input id="batchLimit" type="number" min="0" step="1" placeholder="数量"><button onclick="batchSku()">批量填写</button></div><div class="tablewrap">${table(['规格数量','划线价（元）',(p.type==='赠品'?'成本价（元）':'成本价（元）*'),'库存*','重量（kg）*','限购'],p.skus.map((s,i)=>`<tr><td>${esc(s.name||'未填写规格')} × ${s.count||1}</td>${['line','cost','stock','weight','limit'].map(k=>`<td><input style="width:95px" type="number" min="0" step="${['stock','limit'].includes(k)?'1':'0.01'}" value="${s[k]??''}" oninput="productDraft.skus[${i}].${k}=this.value===''?'':+this.value"></td>`).join('')}</tr>`).join(''))}</div></div></div>${formrow('供应商',pselect('supplier',['自营供应商','跨境供应商']),true)}${formrow('API商品编码',textinput(p,'apiCode','50字内','text','maxlength="50"'))}${formrow('三方编码',textinput(p,'thirdCode','50字内','text','maxlength="50"'))}${formrow('批次渠道扣点比例',textinput(p,'rate','最多2位小数','number','min="0" max="100" step="0.01"'))}${formrow('商品效期',textinput(p,'shelfLife','','month'))}${formrow('虚拟销量',textinput(p,'virtualSales','正整数','number','min="0" step="1"'))}</section><section class="formsection sect" id="pservice"><h2>商品服务</h2>${formrow('商品服务',`<label><input type="checkbox" ${p.serviceReturn?'checked':''} onchange="productDraft.serviceReturn=this.checked"> 支持售后</label>　<label><input type="checkbox" ${p.serviceInvoice?'checked':''} onchange="productDraft.serviceInvoice=this.checked"> 支持开票</label>`)}${formrow('发货仓',pselect('warehouse',['自营仓','华东仓','华南仓']))}${formrow('运费模板',`<select onchange="productDraft.freightTemplate=this.value;productDraft.freight=this.value==='包邮模板'?0:6;render()"><option ${p.freightTemplate==='包邮模板'||!p.freight?'selected':''}>包邮模板</option><option ${p.freightTemplate==='标准运费模板'||p.freight?'selected':''}>标准运费模板</option></select>`,true)}${formrow('物流时效',pselect('logisticsTime',['24小时内发货','48小时内发货','72小时内发货']))}</section><section class="formsection sect" id="pimages"><h2>图文描述</h2>${formrow('主图',`${imageUploader('productDraft','image')}<small>支持PNG / JPG；1:1，建议1440×1440及以上</small>`,p.type!=='赠品')}${formrow('视频',`<label class="upload"><span>＋</span>${esc(p.video||'上传视频')}<input hidden type="file" accept="video/*" onchange="productDraft.video=this.files[0]?.name||'';render()"></label>`)}<div class="row"><label>详情图文</label><div class="wide">${editor(p,'description')}</div></div></section><section class="formsection sect" id="ppublish"><h2>发布设置</h2>${formrow('发布设置',`<label><input type="radio" name="publishState" ${p.on?'checked':''} onchange="productDraft.on=true"> 立即上架</label>　<label><input type="radio" name="publishState" ${!p.on?'checked':''} onchange="productDraft.on=false"> 暂不上架</label>`,true)}${formrow('定时下架',textinput(p,'scheduled','','datetime-local'))}</section></div>${anchor([['pbasic','基本信息'],['pstock','价格库存'],['pservice','商品服务'],['pimages','图文描述'],['ppublish','发布设置']])}</div>`}
function addSku(){productDraft.skus.push({name:'',count:1,cost:'',line:'',price:'',stock:'',weight:'',limit:''});render()}function removeSku(i){if(productDraft.skus.length===1)return toast('至少保留一个规格');productDraft.skus.splice(i,1);render()}
function batchSku(){let inputs={line:batchLine.value,cost:batchCost.value,stock:batchStock.value,weight:batchWeight.value,limit:batchLimit.value};if(Object.values(inputs).every(v=>v===''))return toast('请填写批量设置值');if(Object.entries(inputs).some(([k,v])=>v!==''&&(!Number.isFinite(+v)||+v<0||(['stock','limit'].includes(k)&&!Number.isInteger(+v)))))return toast('划线价、成本价和重量须为非负数，库存和限购须为非负整数');productDraft.skus.forEach(s=>Object.entries(inputs).forEach(([k,v])=>{if(v!=='')s[k]=+v}));render();toast('已批量填写划线价、成本价、库存、重量和限购')}

function cancelProduct(){if(!productReadOnly&&!confirm('确认离开？当前修改将不会保存。'))return;go('products')}
function persistProduct(){let p=productDraft;if(!p.name?.trim()||!p.category||!p.brand||!p.supplier)return toast('请填写商品名称、分类、品牌与供应商');if(p.type!=='赠品'&&!p.image)return toast('请上传商品主图');if(p.skus.some(s=>!s.name.trim()||['cost','stock','weight'].some(k=>{let empty=s[k]===''||s[k]==null;if(k==='cost'&&p.type==='赠品'&&empty)return false;return empty||!Number.isFinite(+s[k])||+s[k]<0})||!Number.isInteger(+s.stock)||(s.limit!==''&&s.limit!=null&&(!Number.isInteger(+s.limit)||+s.limit<0))))return toast(p.type==='赠品'?'请填写规格、整数库存、重量和有效限购；成本价选填，填写时须为非负数':'请填写规格及非负成本价、整数库存、重量和有效限购');let v=structuredClone(p);v.id=p.id||uid('G');v.sku=v.skus.map(s=>s.name).join(' / ');v.price=v.type==='赠品'?0:(Number(v.skus[0].price)||0);v.stock=v.skus.reduce((n,s)=>n+Number(s.stock),0);v.updated=stamp();if(v.id&&prod(v.id))Object.assign(prod(v.id),v);else{v.created=stamp();db.products.unshift(v)}save('保存商品 '+v.id);go('products');toast('商品已保存，可在店铺赠品设置中选择')}

views.admindetail=()=>{let o=db.giftorders.find(x=>x.id===detailId)||normalOrders.find(x=>x.id===detailId);if(!o)return '<h1>订单详情</h1><div class="empty">订单不存在</div>';let gift=!!o.claims,ps=gift?o.claims.map(id=>prod(db.claims.find(c=>c.id===id).product)):[prod(o.product)];return `<div class="topactions"><button class="link" onclick="go('adminorders')">‹ 订单详情</button><span>${gift&&o.status==='待发货'?`<button class="primary" onclick="shipGiftOrder('${o.id}')">发货</button>`:''}</span></div><section class="formsection"><h2>订单信息</h2><p>订单编号：${o.id}　<span class="tag gift">${gift?'赠品订单':o.type}</span>　${o.status}</p><p>创建时间：${o.time||'2026-10-14 16:08:00'}</p>${gift?`<p>来源兑换订单：${o.claims.map(id=>db.claims.find(c=>c.id===id).sourceOrder).join('、')}</p>`:''}<h2>收货信息</h2><p>${esc(o.name)}　${o.mobile.slice(0,3)}****${o.mobile.slice(-4)}</p><p>${esc(o.address||'上海市徐汇区品牌路100号')}</p><h2>商品信息</h2>${table(['商品','规格','数量','售价','赠品优惠','商品实付'],ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td>${gift?1:o.quantity}</td><td>${money(p.price)}</td><td>${gift?money(p.price):'—'}</td><td>${gift?'¥0.00':money(p.price*o.quantity)}</td></tr>`).join(''))}${gift?`<p>运费：${money(o.freight)}　订单应付：${money(o.freight)}</p><small>领取资格：${o.claims.join('、')}</small>`:''}${o.tracking?`<h2>物流信息</h2><p>${esc(o.tracking)}</p>`:''}</section>`}
function shipGiftOrder(id){modal.innerHTML=`<h1>赠品订单发货</h1><form id="shippingForm"><p>物流公司与单号 *</p><input name="tracking" required placeholder="物流公司 / 运单号"><div class="modalfooter"><button type="button" onclick="modal.close()">取消</button><button class="primary">确认发货</button></div></form>`;shippingForm.onsubmit=e=>{e.preventDefault();let o=db.giftorders.find(x=>x.id===id);o.tracking=new FormData(shippingForm).get('tracking');o.status='待收货';o.shippedAt=stamp();save('发货 '+id);modal.close();render();toast('发货成功，用户订单已同步')};modal.showModal()}

function whiteLog(action,detail){db.whiteLogs??=[];db.whiteLogs.unshift({id:uid('WL'),time:stamp(),operator:'运营管理员',action,detail});save('订单白名单 '+action+' '+detail)}
function downloadTemplate(){let bytes=Uint8Array.from(atob(whiteTemplateBase64),c=>c.charCodeAt(0)),u=URL.createObjectURL(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})),a=document.createElement('a');a.href=u;a.download='订单白名单导入模板.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);whiteLog('下载模板','订单维度、商品维度')}
function whiteOrderRows(){let f=filters.import||{};return [...db.orders].reverse().filter(o=>o.source==='后台导入'&&!o.whiteRemoved&&o.valid!==false&&matches(o.id,f.order)&&(!f.exchange||(f.exchange==='已兑换'?o.used:!o.used)))}
views.import=()=>`<h1><button class="link" onclick="go('activities')">‹</button> 订单白名单</h1><div class="toolbar">${field('订单号','order')}${field('兑换状态','exchange','select',['未兑换','已兑换'])}<button aria-label="搜索" class="searchbtn" onclick="query()">${searchIcon}</button><button class="link" onclick="clearFilter()">清空</button><div class="right"><button onclick="whiteOperationLogs()">操作日志</button><button onclick="downloadTemplate()">下载模板</button><button class="primary" onclick="document.getElementById('whitefile').click()">导入订单</button><input id="whitefile" type="file" accept=".xlsx" hidden onchange="readOrders(this.files[0]);this.value=''"></div></div><div id="preview">${previewResult}</div><div id="orderTable">${whiteRows()}</div>`;
function whiteRows(){let a=whiteOrderRows();return frameTable(['订单号','平台 / 店铺','订单金额','订单完成时间','订单商品','兑换状态','操作'],sliced(a).map(o=>`<tr><td>${esc(o.id)}</td><td><span class="tag">${esc(store(o.store)?.platform||o.platform||'—')}</span> ${esc(store(o.store)?.name||o.store)}</td><td>${money(o.amount)}</td><td>${esc(o.completed)}</td><td><button class="link" onclick="whiteOrderProducts('${o.id}','${o.store}')">${o.items?.length||0} 个商品</button></td><td>${o.used?'已兑换':'未兑换'}</td><td><button class="link" onclick="removeWhitelistOrder('${o.id}','${o.store}')">移除白名单</button></td></tr>`).join(''),a)}
function whiteOrderProducts(id,sid){let o=db.orders.find(o=>o.id===id&&o.store===sid&&o.source==='后台导入'&&!o.whiteRemoved);if(!o)return toast('该白名单订单已移除');modal.innerHTML=`<div class="gift-modal-head"><h1>订单商品 · ${esc(id)}</h1><button class="link" onclick="modal.close()">×</button></div>${table(['商品 ID','商品名称','下单数量'],(o.items||[]).map(p=>`<tr><td>${esc(p.productId)}</td><td>${esc(p.name)}</td><td>${p.quantity}</td></tr>`).join(''))}<div class="modalfooter"><button onclick="modal.close()">关闭</button></div>`;modal.showModal()}
function removeWhitelistOrder(id,sid){if(!confirm('是否确认移除白名单？移除后该订单不再作为白名单兑换依据，已发放奖励不受影响。'))return;let o=db.orders.find(o=>o.id===id&&o.store===sid&&o.source==='后台导入'&&!o.whiteRemoved);if(!o)return toast('该订单已移除');o.whiteRemoved=true;o.removedAt=stamp();o.valid=false;whiteLog('移除白名单',store(sid).platform+' / '+store(sid).name+' / '+id);render();toast('已移除白名单')}

async function readOrders(file){if(!file||whiteImportBusy)return;whiteImportBusy=true;pending=[];whiteImportErrors=[];whiteImportFile=file.name;previewResult='<div class="notice">正在校验Excel文件，请稍候…</div>';render();try{if(!/\.xlsx$/i.test(file.name))throw Error('请选择.xlsx格式的Excel文件');if(file.size>10485760)throw Error('文件超过10MB');let wb=await whiteReadWorkbook(file),orders=wb.sheets[0],products=wb.sheets[1],norm=s=>String(s||'').replace(/\s/g,'');for(let [sheet,headers] of [[orders,['平台','店铺ID','订单号','订单完成时间','订单金额']],[products,['订单号','商品 ID','商品名称','下单数量']]]){let actual=[...(sheet.rows[0]?.values||[])];while(actual.length&&!norm(actual.at(-1)))actual.pop();if(actual.length!==headers.length||headers.some((h,i)=>norm(actual[i])!==norm(h)))throw Error(sheet.name+'表头不匹配：应为【'+headers.join('、')+'】，实际为【'+actual.map(v=>String(v||'').trim()||'空白').join('、')+'】')}let orderRows=orders.rows.slice(1),productRows=products.rows.slice(1);if(orderRows.length>5000||productRows.length>20000)throw Error('单次最多导入5000个订单、20000条商品明细');if(!orderRows.length)throw Error('订单维度工作表暂无订单');let records=new Map(),invalid=new Set(),seen=new Set(),dups=0;let error=(sheet,row,reason,id)=>{whiteImportErrors.push({sheet,row,reason});if(id)invalid.add(id)};

let jarAdminFilters={id:'',user:'',activity:'',status:''},jarAdminPage=1;
views.data=function(){let tabs=`<div class="page-tabs participation-tabs">${['兑换记录','集罐记录'].map(t=>`<button class="${redemptionDataTab===t?'selected':''}" onclick="redemptionDataTab='${t}';render()">${t}</button>`).join('')}</div>`;if(redemptionDataTab==='兑换记录')return tabs+beforeParticipationData();let f=jarAdminFilters,rows=db.jarRecords.filter(j=>matches(j.id,f.id)&&matches(j.uid+' '+j.user+' '+j.mobile,f.user)&&(!f.activity||j.activity===f.activity)&&(!f.status||adminJarState(j)===f.status)).sort((x,y)=>String(y.updatedAt).localeCompare(String(x.updatedAt))),max=Math.max(1,Math.ceil(rows.length/20));jarAdminPage=Math.min(jarAdminPage,max);return tabs+`<div class="toolbar"><span class="field">集罐ID：<input aria-label="筛选集罐ID" value="${esc(f.id)}" oninput="jarAdminFilters.id=this.value"></span><span class="field">用户信息：<input aria-label="筛选集罐用户" value="${esc(f.user)}" placeholder="昵称 / 手机号 / ID" oninput="jarAdminFilters.user=this.value"></span><span class="field">活动名称：<select aria-label="筛选集罐活动" onchange="jarAdminFilters.activity=this.value;jarAdminPage=1;render()"><option value="">全部</option>${db.activities.map(a=>`<option value="${esc(a.id)}" ${f.activity===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></span><span class="field">集罐状态：<select aria-label="筛选集罐状态" onchange="jarAdminFilters.status=this.value;jarAdminPage=1;render()"><option value="">全部</option>${['累计中','已兑换','已结束'].map(t=>`<option ${f.status===t?'selected':''}>${t}</option>`).join('')}</select></span><button class="searchbtn" aria-label="搜索集罐" onclick="jarAdminPage=1;render()">${searchIcon}</button><button class="link" onclick="jarAdminFilters={id:'',user:'',activity:'',status:''};jarAdminPage=1;render()">清空</button></div><div class="tablewrap admin-jar-table">${table(['集罐ID','用户信息','活动信息','累计范围','累计数量／金额','集罐订单','集罐状态','开始集罐时间','更新时间','关联兑换记录','操作'],rows.slice((jarAdminPage-1)*20,jarAdminPage*20).map(j=>{let a=db.activities.find(a=>a.id===j.activity),st=store(j.store),t=adminJarTotal(j);return `<tr><td>${esc(j.id)}</td><td>${esc(j.user||'—')}<small>手机号：${esc(j.mobile||'—')}<br>ID: ${esc(j.uid)}</small></td><td>${esc(a?.name||j.activityName||'—')}<small>ID: ${esc(j.activity)}<br>${esc(a?.type||j.activityType||'—')}</small></td><td>${esc(st?.platform||'—')} / ${esc(st?.name||j.store)}<small>${esc(j.groupName||'店铺维度')}</small></td><td>${t.quantity}件<small>${t.amount==null?'金额明细缺失':money(t.amount)}</small></td><td><button class="link" onclick='showAdminJarOrders(${JSON.stringify(j.id)})'>${j.orders.length}笔订单</button></td><td><span class="tag">${adminJarState(j)}</span></td><td>${esc(j.startedAt)}</td><td>${esc(j.updatedAt)}</td><td>${j.redemption?`<button class="link" onclick='showAdminJarRedemption(${JSON.stringify(j.id)})'>${esc(j.redemption)}</button>`:'—'}</td><td><button class="link" onclick='showAdminJarLogs(${JSON.stringify(j.id)})'>日志</button></td></tr>`}).join(''))}</div><div class="pagination">共 ${rows.length} 条 <button ${jarAdminPage===1?'disabled':''} onclick="jarAdminPage--;render()">‹</button>${jarAdminPage} / ${max}<button ${jarAdminPage===max?'disabled':''} onclick="jarAdminPage++;render()">›</button></div>`};
let adminJarOrderContext=null;
function showAdminJarOrders(id){let j=db.jarRecords.find(j=>j.id===id);if(!j)return;adminJarOrderContext=null;modal.style.width='1040px';modal.innerHTML=`<div class="gift-modal-head"><h1>集罐订单明细 · ${esc(j.id)}</h1><button class="link" aria-label="关闭集罐明细" onclick="modal.close()">×</button></div><div class="admin-jar-orders">${table(['订单号','平台','店铺名','订单完成时间','有效数量','有效金额','订单状态'],j.orders.map(row=>{let o=db.orders.find(o=>o.id===row.order&&o.store===row.store),st=store(row.store);return `<tr><td><button class="link" onclick='openJarPublicOrder(${JSON.stringify(id)},${JSON.stringify(row.order)})'>${esc(row.order)}</button></td><td>${esc(st?.platform||'—')}</td><td>${esc(st?.name||row.store)}</td><td>${esc(o?.completed||row.completed||'—')}</td><td>${row.quantity??'—'}件</td><td>${row.amount==null?'—':money(row.amount)}</td><td>${esc(row.status)}</td></tr>`}).join(''))}</div><div class="modalfooter"><button onclick="modal.close()">关闭</button></div>`;if(!modal.open)modal.showModal()}
function showAdminJarLogs(id){let j=db.jarRecords.find(j=>j.id===id);if(!j)return;modal.style.width='960px';modal.innerHTML=`<div class="gift-modal-head"><h1>集罐操作日志 · ${esc(id)}</h1><button class="link" onclick="modal.close()">×</button></div><div class="admin-jar-orders">${table(['日志ID','操作人','操作描述','订单号','操作时间'],j.logs.map(l=>`<tr><td>${esc(l.id)}</td><td>${esc(l.operator||'—')}</td><td>${esc(l.action)}</td><td>${esc(l.order||'—')}</td><td>${esc(l.time)}</td></tr>`).join(''))}</div><div class="modalfooter"><button onclick="modal.close()">关闭</button></div>`;if(!modal.open)modal.showModal()}
function showAdminJarRedemption(id){let j=db.jarRecords.find(j=>j.id===id);if(!j?.redemption)return toast('该集罐暂无关联兑换记录');if(modal.open)modal.close();redemptionDataTab='兑换记录';filters.data={order:j.id};paging.data=1;go('data')}

function openRedemptionSource(id){let r=db.redemptions.find(r=>r.id===id);if(!r)return;if(r.mode==='cumulative')return showAdminJarOrders(r.jarId||jarForScope(r.activity,r.uid||'147225',r.scopeKey)?.id);return viewPublicOrder(r.order)}
const beforeJarPublicOrder=viewPublicOrder,beforeJarPublicOrderRender=renderPublicOrderDetail;
viewPublicOrder=function(id){adminJarOrderContext=null;return beforeJarPublicOrder(id)};
function openJarPublicOrder(jarId,order){beforeJarPublicOrder(order);adminJarOrderContext=jarId;renderPublicOrderDetail()}
renderPublicOrderDetail=function(){beforeJarPublicOrderRender();if(adminJarOrderContext)modal.querySelector('.public-order-tabs')?.insertAdjacentHTML('beforebegin',`<button class="link jar-detail-return" onclick='showAdminJarOrders(${JSON.stringify(adminJarOrderContext)})'>‹ 返回集罐订单</button>`)};

// 个人中心我的订单：仅调整列表展示，继续读取现有赠品订单及详情。
names.orders='我的订单';
function memberOrderListItems(o){return adminOrderItems(o)}
function memberOrderListAmounts(o){let total=Number(o.freight)||0,paid=o.paidAmount!=null?Number(o.paidAmount):['待付款','已关闭'].includes(o.status)?0:total;return {total,paid:Number.isFinite(paid)?paid:0}}
views.orders=function(){let tabs=['全部','待付款','待发货','待收货','已完成'];if(['待评价','售后'].includes(memberOrderFilter))tabs.push(memberOrderFilter);let rows=db.giftorders.filter(o=>memberOrderFilter==='全部'||o.status===memberOrderFilter),content=`<div class="my-order-tabs">${tabs.map(t=>`<button class="${memberOrderFilter===t?'active':''}" onclick="memberOrderFilter='${t}';render()">${t}</button>`).join('')}</div><div class="my-order-list">${rows.map(o=>{let items=memberOrderListItems(o),amount=memberOrderListAmounts(o);return `<article class="my-order-card" role="button" tabindex="0" aria-label="查看订单${esc(o.id)}" onclick='openMemberGiftOrder(${esc(JSON.stringify(o.id))})' onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}"><div class="my-order-card-head"><strong title="${esc(o.id)}">订单号：${esc(o.id)}</strong><span>${esc(o.status==='已关闭'?'交易关闭':o.status)}</span></div>${items.map(item=>`<div class="my-order-product"><div class="my-order-product-art">${item.p.image?`<img src="${esc(item.p.image)}" alt="${esc(item.p.name)}">`:memberIcon('gift')}</div><div class="my-order-product-info"><h3><span class="my-order-product-tag">${o.type==='跨境订单'?'跨境':'赠品'}</span>${esc(item.p.name)}</h3><p>${esc(item.sku.name||item.p.sku||'默认规格')}</p><div class="my-order-product-bottom"><strong>¥0.00</strong><span>×${item.quantity}</span></div></div></div>`).join('')}<div class="my-order-card-amount"><span>总价 ${money(amount.total)}</span><strong>${o.status==='待付款'?'待付':'实付'} ${money(o.status==='待付款'?amount.total:amount.paid)}</strong></div></article>`}).join('')||'<div class="my-order-empty">暂无订单</div>'}</div>`;return memberPhone('我的订单',content).replace('member-gifts','member-my-orders')};

function effectiveGroupProductIds(g){let excluded=new Set((g.excludedProductIds||[]).map(String));return (g.productIds||[]).map(String).filter(id=>!excluded.has(id))}
page='activities';opened=['activities'];render();

</script></html>
