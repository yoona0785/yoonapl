function giftAuditRows(x){if(x.status!=='待审核'&&x.giftSnapshot)return x.giftSnapshot;let d=giftAuditDraft,st=store(d.store);if(!st)return [];d.rowsByStore??={};if(!Object.hasOwn(d.rowsByStore,st.id))d.rowsByStore[st.id]=structuredClone(configuredGiftRows(st));return d.rowsByStore[st.id]}
function renderGiftAuditDialog(){let d=giftAuditDraft,x=db.audits.find(x=>x.id===d?.id);if(!x)return;let read=x.status!=='待审核',submittedShop=store(x.submittedStore||x.store),a=db.activities.find(a=>a.id===x.activity),shops=db.stores.filter(st=>configuredGiftRows(st).length),rows=giftAuditRows(x),images=x.orderImages||x.evidenceImages||x.screenshots||[];if(!Array.isArray(images))images=[images];modal.style.width='580px';modal.innerHTML=`<div class="gift-audit-dialog"><div class="gift-modal-head"><h1>${read?'审核详情':'兑换审核'}</h1><button class="link" aria-label="关闭审核弹窗" onclick="modal.close()">×</button></div><div class="gift-audit-body"><div class="gift-audit-application"><div class="gift-audit-application-grid"><div>下单平台： <span class="tag">${esc(x.platform||submittedShop?.platform||'—')}</span></div><div>店铺名称： <span>${esc(submittedShop?.name||'—')}</span></div><div>申请人： <span>${esc(x.user)} (${esc(x.mobile)})</span></div><div>用户ID： <span>${esc(x.uid)}</span></div><div>申请活动： <span>${esc(a?.name||'订单兑换')} (ID: ${esc(x.activity)})</span></div><div>提交时间： <span>${esc(x.submitted||'—')}</span></div></div><div class="gift-audit-application-label">补充说明：</div><div class="gift-audit-supplement">${esc(x.supplement||x.description||'无')}</div><div class="gift-audit-application-label">订单截图：</div><div class="gift-audit-evidence">${images.length?images.map((src,i)=>`<button type="button" onclick="previewGiftAuditImage(${i})"><img src="${esc(typeof src==='string'?src:src.url||src.src)}" alt="订单截图${i+1}"></button>`).join(''):'<span class="gift-audit-no-image">暂无订单截图</span>'}</div></div><div class="gift-audit-label">审核结果 <span style="color:red">*</span></div><div class="gift-audit-radio">${['通过','驳回'].map(v=>`<label><input type="radio" name="giftAuditResult" value="${v}" ${d.result===v?'checked':''} ${read?'disabled':''} onchange="giftAuditDraft.result=this.value;renderGiftAuditDialog()">${v}</label>`).join('')}</div>${d.result==='通过'?`<div class="gift-audit-label">兑换店铺</div><select class="gift-audit-shop" aria-label="兑换店铺" ${read?'disabled':''} onchange="giftAuditDraft.store=this.value;renderGiftAuditDialog()"><option value="">请选择店铺</option>${shops.map(st=>`<option value="${st.id}" ${d.store===st.id?'selected':''}>${esc(st.name)}</option>`).join('')}${read&&!shops.some(st=>st.id===d.store)?`<option selected value="${esc(d.store)}">${esc(store(d.store)?.name||d.store)}</option>`:''}</select><div class="gift-audit-label">店铺赠品</div><div class="gift-audit-gifts">${table(['商品名称','属性','规格数量','赠送数量','操作'],rows.map((row,index)=>{let p=prod(row.product);if(!p)return '';let sku=giftSku(p,row.skuIndex||0);return `<tr><td><div class="productcell">${art(p)}<span>${esc(p.name)}<small>ID: ${esc(p.id)}</small></span></div></td><td>${esc(sku.name||p.sku||'—')}</td><td>${Number(sku.count)||1}</td><td>${Number(row.quantity)||1}</td><td>${read?'—':`<button class="link" onclick="removeGiftAuditRow(${index})">删除</button>`}</td></tr>`}).join(''))}</div>`:''}<div class="gift-audit-label">审核意见（${d.result==='驳回'?'必填':'选填'}）</div><div class="gift-audit-opinion"><textarea aria-label="审核意见" maxlength="200" ${read?'readonly':''} placeholder="在此处输入审核意见，驳回原因意见描述…" oninput="giftAuditDraft.opinion=this.value;document.getElementById('giftAuditOpinionCount').textContent=this.value.length+' / 200'">${esc(d.opinion)}</textarea><small id="giftAuditOpinionCount">${d.opinion.length} / 200</small></div></div><div class="modalfooter"><button onclick="modal.close()">${read?'关闭':'取消'}</button>${read?'':'<button class="primary" onclick="submitShopGiftAudit()">确定</button>'}</div></div>`}
function previewGiftAuditImage(index){let x=db.audits.find(x=>x.id===giftAuditDraft?.id),images=x?.orderImages||x?.evidenceImages||x?.screenshots||[];if(!Array.isArray(images))images=[images];let image=images[index],src=typeof image==='string'?image:image?.url||image?.src;if(!src)return;let dialog=document.getElementById('auditImageDialog');if(!dialog){dialog=document.createElement('dialog');dialog.id='auditImageDialog';document.body.append(dialog)}dialog.innerHTML=`<img src="${esc(src)}" alt="订单截图"><div class="modalfooter"><button onclick="document.getElementById('auditImageDialog').close()">关闭</button></div>`;dialog.showModal()}
function submitShopGiftAudit(){let d=giftAuditDraft,x=db.audits.find(x=>x.id===d?.id);if(!x||x.status!=='待审核')return;let opinion=d.opinion.trim();if(d.result==='驳回'){if(!opinion)return toast('驳回时请填写审核意见');Object.assign(x,{status:'驳回',rewardType:'赠品',points:0,opinion,reviewed:stamp()});save('审核 '+x.id+'：驳回');modal.close();render();return toast('审核已驳回')}let st=store(d.store);if(!st)return toast('请选择兑换店铺');let rows=giftAuditRows(x).map(row=>({...row,skuIndex:Number(row.skuIndex)||0,quantity:Math.max(1,Number(row.quantity)||1)}));if(!rows.length)return toast('请至少保留一个赠品后再通过审核');if(!rows.some(rewardRowAvailable))return toast('该店铺暂无可领取赠品，请重新选择');if(db.redemptions.some(r=>r.order===x.order))return toast('订单已兑换，不能重复审核发奖');let a=db.activities.find(a=>a.id===x.activity),config=a?.dimension==='店铺维度'?a.storeRules?.[st.id]:a?.giftConfig,limit=Math.min(rows.length,Math.max(1,Number(config?.selectableCount)||1)),r={id:uid('EX'),auditId:x.id,activity:x.activity,activityName:a?.name,activityType:a?.type,order:x.order,store:st.id,user:x.user,uid:x.uid,source:'人工审核',time:stamp(),points:0,pointsValue:0,coupon:false,claims:[],reward:'可选'+limit+'个赠品'},g={id:uid('GS'),redemption:r.id,auditId:x.id,sourceOrder:x.order,store:st.id,rows:structuredClone(rows),limit,expires:giftExpiry(a?.days??db.config.days),selected:false,time:stamp()};r.selectionId=g.id;db.giftSelections.unshift(g);db.redemptions.unshift(r);let o=db.orders.find(o=>o.id===x.order);if(o)o.used=true;Object.assign(x,{status:'通过',rewardType:'赠品',submittedStore:x.submittedStore||x.store,store:st.id,exchangeStore:st.id,gift:[...new Set(rows.map(row=>row.product))],giftSnapshot:structuredClone(rows),selectionId:g.id,points:0,opinion,reviewed:stamp()});save('审核 '+x.id+'：通过，店铺 '+st.name);modal.close();giftAuditDraft=null;render();toast('审核通过，赠品待选择领取')}


const auditExportHeaders=['下单平台','店铺名称','提交单号','补充说明','活动ID','用户昵称','用户ID','提交时间','截图','审核时间','审核结果','兑换积分','赠品状态','兑换店铺','关联产品组'];
