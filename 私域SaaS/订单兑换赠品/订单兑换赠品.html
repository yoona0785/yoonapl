const embeddedDoc="# 订单兑换赠品需求文档\n\n版本：V2.0（最终原型对齐版）  \n更新日期：2026-10-19  \n对应原型：本目录「订单兑换赠品-交互原型.html」\n\n本文整合本轮全部页面及交互调整，作为当前统一需求说明，不再保留相互覆盖的历史追加说明。页面、字段、按钮和已实现联动以最终原型为依据；真实接口、支付回调、权限与并发能力不属于本地原型已完成能力，边界及待确认项统一列在 6.5、6.6。\n\n## 1. 业务背景\n\n### 1.1 需求描述\n\n1. 公域平台订单可在微信小程序参与订单兑换。查询来源默认包括平台接口订单与运营导入的订单白名单，不再由运营勾选来源。\n2. 一个公域订单只能成功兑换一次，奖励为积分或赠品中的一种，不叠加发放积分、赠品及优惠券。\n3. 赠品兑换成功表示获得赠品选择资格，不等于赠品已经领取。用户选择赠品后需完成收货信息提交；有运费时还需支付成功，才算领取成功。\n4. 赠品商品、规格、库存、重量、供应商、发货仓和运费模板由商品管理维护；公域店铺维护默认赠品池，活动可配置统一或按店铺发放规则。\n\n### 1.3 目标结果\n\n1. 形成商品维护、店铺配置、活动配置、公域订单验证、赠品选择、提单、支付、履约的完整演示链路。\n2. 支持运营使用双工作表 Excel 导入白名单订单，并通过兑换数据、审核与订单详情追溯结果。\n3. 统一小程序、兑换记录、兑换数据及审核列表的赠品领取状态，避免重复发奖、建单或扣库存。\n\n### 1.4 本期范围\n\n1. 商品中心：商品列表、新建/编辑、赠品类型、规格及商品服务配置。\n2. 订单中心：订单列表、赠品订单详情、备注及发货操作。\n3. 营销中心：订单兑换列表、新建/编辑、活动店铺、推广、公域店铺、产品组、赠品设置、订单白名单、订单限制、兑换数据及兑换审核。\n4. 微信小程序：订单兑换、成功弹窗、兑换记录、个人中心、我的赠品、赠品选择、确认订单、订单支付、支付结果、赠品及赠品订单详情。\n5. 兑换数据双工作表 Excel 导出、兑换审核 Excel 导出、白名单导入校验与操作日志。\n\n### 1.5 本期不做\n\n1. 不增加优惠券兑换活动或多种奖励组合发放。\n2. 不建立独立赠品库存、价格或运费体系，不新增换购、转赠、折现能力。\n3. 不新增公域平台真实接口接入、OCR 自动识别、真实支付或真实物流服务。\n4. 不将本地原型中的支付、审核示例数据或本地存储视为生产系统能力；生产对接事项见 6.6。\n\n## 2. 关键业务规则\n\n### 4.1 唯一性 / 并发性\n\n1. 原型按公域订单号检查已兑换记录，接口订单、白名单订单及人工审核共享去重。命中多个同号订单时阻断，不自动选取第一条。\n2. 订单号、活动ID、用户ID、店铺ID、商品ID均作为字符串处理。导入/导出保留前导零和长编号，不转换为科学计数法。\n3. 验证通过后立即保存兑换结果：积分直接发放；赠品保存待选择资格，并标记公域订单已兑换。退出赠品选择不恢复公域订单的兑换次数。\n4. 同一赠品选择资格只确认一次。确认选择时生成所选 SKU 的领取记录并占用库存；返回后继续流程复用这些记录，不再次发放或扣库存。\n5. 已创建待付款订单时，继续领取恢复原订单支付；不再次创建同一资格的赠品订单。\n6. 人工审核通过前再次检查该公域订单是否已兑换，已兑换时禁止重复审核发奖。已审核记录只读。\n7. 真实系统的唯一键、事务锁、接口幂等及支付回调幂等尚未在本地实现，见 6.6；不能用前端状态判断替代服务端约束。\n\n### 4.2 字段定义\n\n#### 4.2.1 菜单及通用展示\n\n1. 一级菜单顺序固定为：商品中心、订单中心、营销中心、微信小程序。\n2. 二级菜单分别为：商品管理、订单管理、订单兑换；微信小程序下仅显示订单兑换、个人中心。\n3. 我的赠品、赠品订单不作为左侧菜单展示，通过个人中心或相关页面入口访问。新增、编辑、数据、审核、店铺及详情等已打开标签不额外加入菜单。\n4. 一级菜单可展开/收起，菜单搜索仅在实际菜单项中匹配；顶部保留打开页面的标签切换和关闭功能。\n5. 后台通用查询字段同时生效时采用 AND 关系。未提供的数据展示“—”，不伪造物流、时间、支付流水或用户信息。\n6. 通用列表默认每页20条，可选5/10/20/50条。独立选择弹窗按各自分页设置执行。时间统一展示北京时间，格式为 `YYYY-MM-DD HH:mm:ss`；金额单位元，保留两位小数。\n\n#### 4.2.2 商品管理列表\n\n##### 页面路径\n\n商品中心—商品管理。\n\n##### 列表逻辑\n\n1. 状态页签：全部商品、已上架、已下架；右上角提供已删除商品入口，可返回正常列表。\n2. 表搜索：商品名称模糊匹配；商品ID精确匹配；商品类型、品牌、所属SPU下拉筛选。更多搜索包含API商品编码、商品分类、创建方式；创建方式为手动创建/API对接。\n3. 商品类型包含普通商品、跨境商品、直邮商品、赠品。\n4. 查询表字段：商品名称及图片/ID、SPU、品牌、分类、商品来源、发货仓、售价、API商品编码、总库存、访客数、访问量、销量、虚拟销量、创建时间、更新时间、状态、提示、操作。\n5. 商品名称和操作列固定，表格支持横向滚动；访客数、访问量、销量可排序。商品目录售价仍可展示，赠品订单商品实付按0元处理。\n\n##### 列表交互\n\n1. 新增、编辑、预览、复制进入相应商品页面；复制生成新草稿，不覆盖原商品。\n2. 已上架商品更多操作：同步商详、日志、库存日志；已下架商品额外提供删除。\n3. 支持勾选、当前页全选及批量上架、下架、同步商详、批量修改、删除。\n4. 已上架或被店铺/领取记录引用的商品不可删除。删除需二次确认，删除后进入已删除商品，可恢复。\n5. 商品导出及导入修改沿用当前原型入口，不与兑换数据双工作表导出混用。\n\n#### 4.2.3 商品新建 / 编辑\n\n##### 页面路径\n\n商品中心—商品管理—新增/编辑。\n\n##### 表单逻辑\n\n1. 页面分区顺序：基本信息、价格库存、商品服务、图文描述、发布设置；右侧锚点用于定位分区。\n2. 基本信息：商品类型单选，包含赠品商品；商品名称必填，最多100字符；计量单位默认“个”；SPU选填；后台分类、品牌必填；商品卖点最多50字符，搜索词和商品标签保留输入入口。\n3. 赠品商品类型后不展示“用于活动兑换；商品库存、价格及运费模板统一维护”的说明。\n4. 商品规格可新增和删除，至少保留一项；每项包含规格信息、规格数量及图片入口。规格数量默认1。\n5. 价格/库存不设置售价输入；可维护划线价、成本价、库存、重量、限购。批量填写包含这五项，并应用到所有规格行。\n6. 赠品商品成本价（元）选填，不显示必填星号，留空可保存；填写时须为非负数。非赠品商品成本价仍必填。库存、重量必填且非负，库存为整数；划线价选填且非负，限购选填且为非负整数。\n7. 供应商必填；API商品编码、三方编码、批次渠道扣点比例、商品效期、虚拟销量保留原配置入口。\n8. 商品服务字段顺序固定为：商品服务、发货仓、运费模板、物流时效。运费模板必填；原型提供包邮模板和标准运费模板，对应0元/6元。\n9. 运费模板下不展示“演示模板：包邮0元/标准运费6元；实际按现有配送区域及计费规则”的说明。\n10. 赠品商品主图选填，不显示必填星号，未上传可保存并使用占位图；非赠品商品主图仍必填。视频、图文描述保留上传/编辑入口。发布设置可选立即上架或暂不上架，并支持定时下架配置入口。\n11. 不展示“赠品通过订单兑换领取，不进入普通商品推荐（业务规则待确认）”的说明。\n\n##### 列表交互\n\n1. 保存校验名称、分类、品牌、供应商及规格库存必填项；非赠品额外校验成本价、主图必填，赠品允许这两项留空。选填成本价有值时仍校验非负数；失败保留表单，成功返回商品列表。\n2. 取消未保存编辑时二次确认；预览为只读状态。\n\n#### 4.2.4 订单管理列表\n\n##### 页面路径\n\n订单中心—订单管理。\n\n##### 列表逻辑\n\n1. 页签：全部订单、待付款、待发货、已发货、已完成、已关闭；其中已发货对应赠品订单的待收货状态。\n2. 查询条件：关键词匹配订单号、收货人、手机号、商品名称；订单类型包含普通订单、跨境订单、赠品订单。\n3. 订单头展示订单编号、创建时间、订单类型；不展示来源、来源兑换订单号。\n4. 商品行字段：商品、单价、数量、优惠、售后状态、发货仓、用户、订单状态、订单推送状态。\n5. 单价统一显示 `¥0.00`；数量取实际领取/下单数量；优惠统一显示“—”，不展示赠品优惠抵扣。\n6. 发货仓只展示仓库名称，无值显示“—”，不附加供应商名称或“订单履约仓”说明。\n7. 用户信息依次展示用户ID、昵称、邀请人、收货人及手机号；邀请人缺失显示“—”。\n8. 订单状态下提供详情入口；待付款显示待推送，其余按原型展示推送成功或已有推送状态。\n\n##### 列表交互\n\n1. 点击详情进入对应订单详情，携带实际订单ID。\n2. 列表保留订单导出、商品导出入口，与兑换数据、审核导出区分。\n\n#### 4.2.5 后台订单详情\n\n##### 页面路径\n\n订单中心—订单管理—查看订单。\n\n##### 详情页逻辑\n\n1. 顶部展示订单状态、清关状态及四个进度节点：用户创建订单、用户付款、商家发货、订单完成。存在的时间据实展示，未发生的节点置灰。\n2. 订单信息：主单编号、订单编号、订单类型、创建时间、付款时间、支付方式、支付单号、交易流水号、已使用优惠券id、积分抵扣、买家备注；有商家备注时补充展示。\n3. 用户信息：用户ID、用户昵称、用户手机号、订单邀请人、订单邀请渠道、unionid、openid、external_userid、系统标签。\n4. 订单物流：收货人、收货人电话、收货地址、物流公司名称、运单号、发货仓。\n5. 商品信息：商品、批次、分账信息、规格、状态、商品售价、购买数量、商品原总价、商品实付总价、商品优惠、平台营销承担、商品税费、订单运费。\n6. 当前原型商品相关金额为0元、商品优惠为“—”；运费单独展示，不按每个商品行重复累计。底部订单实付金额等于该订单运费。\n\n##### 列表交互\n\n1. 顶部备注打开商家备注弹窗，最多300字符，保存后回显。\n2. 赠品订单待发货时提供发货按钮；填写物流公司/单号并确认后，更新为待收货，同步小程序订单状态。\n3. 分账信息打开只读弹窗；没有数据时展示暂无分账信息。\n\n#### 4.2.6 订单兑换活动列表\n\n##### 页面路径\n\n营销中心—订单兑换。\n\n##### 列表逻辑\n\n1. 查询条件：活动名称模糊、活动ID精确、活动时间范围、活动类型；更多搜索包含活动状态。活动时间范围按区间重叠筛选。\n2. 列表字段：活动信息、活动时间、兑换用户数、兑换订单数、创建时间、更新时间、活动状态、操作。\n3. 活动信息展示名称、ID、活动类型标签；不额外展示“赠品”标签。\n4. 活动类型为四种积分活动及两种赠品活动，枚举见4.2.7。活动状态为待开始、进行中、已结束。\n5. 当前原型人数和订单数使用关联兑换记录演示；生产统计口径见6.6。\n\n##### 列表交互\n\n1. 右上入口包含兑换数据、兑换审核、公域店铺、订单白名单、订单限制、新建。\n2. 进行中：行内编辑、复制、立即结束；更多操作含推广、日志。符合店铺维度条件时增加活动店铺。\n3. 已结束：行内复制、删除、推广；更多操作含日志。两种固定赠品活动为店铺维度时，仍展示活动店铺入口。\n4. 待开始：行内编辑、复制、删除；更多操作含推广、日志。两种固定赠品活动为店铺维度时增加活动店铺。\n5. 统一维度不展示活动店铺；活动店铺页顶部不展示“活动类型：……兑换维度：……”说明。\n6. 立即结束、删除需确认。活动编辑和结束不回收已发出的赠品选择资格。\n7. 订单限制入口支持输入公域订单号添加限制，重复限制不再次添加；列表展示订单号和添加时间，删除需确认。被限制订单在兑换前阻断。\n\n#### 4.2.7 订单兑换新建 / 编辑\n\n##### 页面路径\n\n营销中心—订单兑换—新增/编辑。\n\n##### 表单逻辑\n\n1. 页面为左侧小程序预览、右侧配置；分区为基本信息、规则设置、推广分享，右侧锚点定位。\n2. 活动类型必选，六项在同一行展示：订单金额固定积分、订单金额比例积分、商品数量固定积分、商品数量比例积分、订单金额固定赠品、商品数量固定赠品；新建默认订单金额固定积分。\n3. 活动名称必填，最多50字符；活动时间包含开始、结束时间，填写时结束须晚于开始；活动背景图可上传/恢复默认图，活动规则使用富文本。\n4. 兑换次数限制默认0，0或留空表示不限；活动内按兑换订单计次，不按赠品件数计次。\n5. 不展示“兑换订单来源”和“兑换的奖励”配置。默认查询平台接口及订单白名单，奖励由活动类型决定。\n6. 兑换订单范围选填，配置后仅允许该时刻及以后完成的订单参与。\n7. 积分活动保留统一维度、店铺维度、店铺产品组维度配置入口。固定/比例积分计算见4.3；产品组实际匹配接入边界见6.6。\n8. 赠品活动仅提供统一维度、店铺维度。\n   1. 订单金额固定赠品：订单满X元，可兑换N个赠品；X大于0，最多两位小数。\n   2. 商品数量固定赠品：商品满X件，可兑换N个赠品；X为正整数。\n   3. N为正整数，不得超过对应配置的不同SKU数。店铺维度新增行默认1；已保存的非空值保留。\n9. 统一维度直接提供添加赠品、规格选择及赠品明细表，不单独提供“设置赠品”按钮。添加/批量设置复用公域店铺赠品结构。\n10. 店铺维度提供批量门槛、批量赠品个数、添加店铺；店铺选择弹窗支持名称搜索、勾选、分页和确认，只列出有赠品配置的店铺。\n11. 店铺行展示平台/名称/ID、活动赠品规则、赠品设置、删除；表头、内容和操作统一左对齐。\n12. 店铺规则初始带入该店铺的赠品明细，在活动中编辑后形成独立配置，不覆盖公域店铺默认赠品；可兑换个数不从公域店铺继承。\n13. 赠品领取有效期选填，默认空白，表示没有期限；填写时为1—365天正整数。\n14. 推广分享保留播报、分享配置入口；分享标题和分享图按原型上传配置。未实现的播报数据接入见6.5。\n\n##### 列表交互\n\n1. 保存校验活动名称、时间、门槛、赠品SKU、赠送数量、可兑换个数、有效期，失败保留输入。\n2. 保存后生成/更新活动，并按开始、结束时间计算保存时的活动状态；实时状态刷新策略见6.6。\n3. 取消未保存修改需确认。\n\n#### 4.2.8 活动店铺\n\n1. 页面路径：营销中心—订单兑换—活动店铺。\n2. 添加店铺、批量规则、单店门槛及可兑换个数、赠品设置、删除，与活动新建/编辑复用同一套规则。\n3. 页面使用独立编辑草稿；保存只更新该活动店铺及规则，不覆盖其他打开的新建/编辑页面，也不修改公域店铺默认赠品。\n4. 取消需确认放弃未保存修改；顶部不重复展示活动类型/兑换维度说明。\n\n#### 4.2.9 推广弹窗\n\n1. 页面路径：营销中心—订单兑换—推广。\n2. 弹窗包含“小程序链接与二维码”“小程序分享设置”两项切换。\n3. 链接与二维码页展示活动海报、小程序链接、小程序路径、复制按钮、下载小程序码、下载海报。\n4. 未配置真实小程序链接时不伪造可用链接，复制对应链接按钮禁用；默认小程序码为示意图，真实码接入见6.5。\n5. 分享设置页展示分享卡片预览、分享标题、分享图及海报；标题/分享图必填，分享图建议5:4，海报建议750×1000；上传支持PNG/JPG/WEBP，单图不超过4MB。\n6. 保存只修改当前活动的分享配置；取消不保存。预览随标题和图片更新。\n\n#### 4.2.10 公域店铺列表\n\n##### 页面路径\n\n营销中心—订单兑换—公域店铺。\n\n##### 列表逻辑\n\n1. 查询条件：店铺名称、店铺ID、电商平台。当前名称模糊、ID精确；平台可选天猫、京东、淘宝、抖音、拼多多。\n2. 列表字段：店铺信息、产品组数、赠品数、创建时间、更新时间、操作。\n3. 店铺信息展示平台、名称、ID；产品组数展示启用/总数；赠品数按配置SKU行数统计。\n4. 不展示具体赠品名称摘要，也不展示单选/多选、最多N个或“赠品可选N个”。\n\n##### 列表交互\n\n1. 行内操作：编辑、产品组、删除、赠品设置；更多操作仅日志。\n2. 点击产品组数打开产品组配置，点击赠品数或赠品设置打开赠品配置。\n3. 删除需确认；关联活动、订单、兑换或审核记录的店铺禁止删除。\n4. 新建/编辑弹窗包含店铺名称（必填，最多50字符）、店铺ID（必填，新建查重，编辑只读）、电商平台（必填，可选天猫、京东、淘宝、抖音、拼多多、其他）；新建默认天猫，取消不保存。\n\n#### 4.2.11 产品组配置\n\n1. 产品组弹窗：新增产品组入口，列表展示产品组名称、商品ID列表、默认积分、状态、编辑、删除。\n2. 商品ID以标签展示；状态开关可启用/停用；保存、切换、删除后更新产品组数。\n3. 新增/编辑字段：产品组名称必填，最多50字符，同店铺不可重名；商品ID列表必填，支持换行或中英文逗号分隔，去空去重；默认积分选填，填写时为正整数；状态默认启用。\n4. 商品ID按文本保存；关联产品组的生产订单匹配逻辑见6.6。\n\n#### 4.2.12 公域店铺赠品设置及商品选择\n\n1. 赠品设置弹窗不展示用户选择方式、赠品可选个数及相关说明、校验或列表摘要。\n2. 可兑换的SKU个数仅在活动规则内维护。店铺弹窗只维护SKU及其赠送数量、商品活动数量、排序值。\n3. 明细表字段：赠送数量（红色必填星号）、库存数量、商品活动数量、排序值、售价、商品名称、属性、规格数量、操作。\n4. 赠送数量为正整数，默认1；商品活动数量选填，留空表示不限制，填写时为非负整数；排序值为非负整数，默认0。\n5. 批量设置仅包含赠送数量、商品活动数量，不包含排序值；批量区和字段统一左对齐。\n6. 添加赠品先打开商品选择弹窗，再打开规格选择弹窗；按商品+规格标识去重，同一商品可选择多个不同规格。\n7. 商品选择支持名称、类型、商品ID、品牌、SPU、分类、创建方式、商品状态条件及分页；只加入赠品类型商品。已加入规格不可重复添加。\n8. 配置阶段可查看下架/无库存商品；实际兑换及领取时检查上架和可用库存，不因已配置而免除校验。\n9. 保存所选规格后返回明细表；添加弹窗不展示“已选X个赠品/X个规格”汇总说明。\n10. 保存更新店铺赠品配置；活动中的赠品设置只更新活动快照。删除明细不会直接删除商品。\n\n#### 4.2.13 订单白名单\n\n##### 页面路径\n\n营销中心—订单兑换—订单白名单。\n\n##### 列表逻辑\n\n1. 查询条件：订单号模糊、兑换状态（全部/未兑换/已兑换）。不设置有效状态条件或列表字段。\n2. 列表字段：订单号、平台/店铺、订单金额、订单完成时间、订单商品、兑换状态、操作。\n3. 订单商品点击弹窗展示商品ID、商品名称、下单数量。\n4. 操作仅移除白名单，不提供查看、禁用；右上角有操作日志、下载模板、导入订单。\n5. 页面不展示旧版CSV及导入来源的解释说明。\n\n##### 列表交互\n\n1. 下载模板为一个 `.xlsx` 文件，两个工作表：\n   1. 订单维度：平台、店铺ID、订单号、订单完成时间、订单金额。\n   2. 商品维度：订单号、商品 ID、商品名称、下单数量。\n2. 两表一次上传，按订单号关联；订单维度订单号唯一，一订单可有多条商品明细。同号多店铺不能在同批中歧义关联。\n3. 表头按字段和顺序校验，忽略标题内空白及末尾空白列；实际缺列、错列或多余非空表头提示预期/实际表头。\n4. 平台、店铺ID须匹配现有店铺；订单金额非负且最多两位小数；完成时间支持Excel日期或北京时间文本，不可晚于当前时间；商品ID、名称必填，下单数量为正整数。\n5. 文件须为.xlsx，不超过10MB；单次最多5000个订单、20000条商品明细。不接受加密工作簿和公式结果未转为值的单元格。\n6. 保留文本ID前导零；过长数值型订单号/商品ID拒绝，提示改用文本。\n7. 校验重复订单、重复商品、缺明细、孤立明细、字段冲突；错误订单整单不进入待导入集合。相同已导入数据跳过，冲突或已兑换订单不覆盖。\n8. 校验预览显示可导入数、重复数、错误数以及工作表/行号/原因。用户点击确认导入后才写入完整有效订单；取消不导入。\n9. 移除白名单需确认，移除后从名单列表和白名单校验中排除，不回收既有兑换及赠品订单。\n10. 操作日志弹窗展示时间、操作人、操作类型、内容；记录模板下载、导入校验/失败、确认导入及移除白名单。当前实现未提供错误文件下载入口。\n\n#### 4.2.14 兑换数据\n\n##### 页面路径\n\n营销中心—订单兑换—兑换数据。\n\n##### 列表逻辑\n\n1. 查询条件固定顺序：用户信息、用户昵称、活动名称、订单号、兑换店铺、活动状态、积分发放日期、赠品状态。全部条件直接展示，可自然换行；不再展示奖励类型筛选或更多搜索入口。\n2. 用户信息按用户ID/手机号模糊匹配，昵称/订单号模糊匹配；活动名称、兑换店铺下拉精确筛选。活动状态为全部/待开始/进行中/已结束；积分发放日期按起止日期范围筛选，包含起止当日，设置日期时不纳入没有积分发放时间的赠品记录。赠品状态为全部/未领取/部分领取/已领取/已失效，选择具体状态时只纳入赠品奖励。多条件为AND关系，清空恢复全部；筛选结果同步影响导出。\n3. 列表字段：兑换记录ID、兑换订单号、兑换店铺、活动信息、用户信息、兑换积分、兑换赠品、奖励发放时间。\n4. 兑换订单号下不展示后台导入/平台接口来源；点击订单号打开公域订单详细信息。\n5. 活动信息展示名称、活动ID、活动类型标签；用户信息展示昵称、手机号、用户ID。\n6. 兑换积分显示实际积分数；赠品奖励不同时展示积分发放。\n7. 兑换赠品展示领取状态和“赠品详情”，无赠品显示“—”；状态与4.3.5一致，可出现未领取、部分领取、已领取、已失效。\n8. 赠品详情弹窗字段：商品名称（图片、名称、ID）、属性、规格数量、赠送数量、订单号。未选赠品时可查看候选池；已选择时展示实际领取记录，未建单订单号为“—”。\n\n##### 列表交互\n\n1. 赠品详情中点击关联订单号进入后台赠品订单详情。\n2. 兑换订单详细信息弹窗包含基本信息、商品明细、物流信息三个页签。\n   1. 基本信息分组：订单基本信息、收货与配送、时间节点、其他信息。字段包含订单号、第三方订单号、订单状态、店铺名称、销售平台、贸易模式、支付金额、第三方用户编码、EC店铺编码、收货地址、下单/支付/创建/出库/签收/完成/更新时间、兑换状态、备注。\n   2. 商品明细：商品名称、商品编码、单价、数量、成交金额、运费、活动折扣、优惠券抵扣、税金、商品实付金额；支持横向滚动。\n   3. 物流信息：商品名称、商品编码、物流公司、物流单据号、商品数量；无物流数据展示空态。\n   4. 仅按原订单已有字段展示；白名单未导入的用户、物流及费用拆分不补造。\n3. 导出使用当前筛选全量记录，生成双工作表Excel；字段及数据口径见6.1。\n\n#### 4.2.15 兑换审核\n\n##### 页面路径\n\n营销中心—订单兑换—兑换审核。\n\n##### 列表逻辑\n\n1. 查询条件：用户信息、用户昵称、活动名称、审核状态（待审核/通过/驳回），按AND关系生效。\n2. 列表字段：提交信息、活动信息、用户信息、提交时间、审核时间、审核状态/奖励、操作。\n3. 提交信息含申请平台/店铺、订单截图、账号截图入口及提交单号；用户信息含昵称、手机号、用户ID。\n4. 待审核不展示已发奖励；通过为积分时显示“+N 积分”和兑换店铺；通过为赠品时仅显示“赠品未领取/赠品已领取”和兑换店铺；驳回显示意见。\n5. 同一审核单只发积分或赠品，不允许两种同时发放。已通过赠品的领取状态由真实领取/支付结果计算，不以审核通过代替领取成功。\n6. 待审核提供审核入口；已审核可查看只读详情，保留日志入口。导出见6.1。\n\n##### 列表交互\n\n1. 积分审核弹窗仅显示积分奖励字段；通过时积分须为正整数，不同时发赠品。\n2. 赠品审核弹窗按以下顺序展示：\n   1. 申请信息：下单平台、申请店铺名称、申请人/手机号、用户ID、申请活动及ID、提交时间、补充说明、订单截图。\n   2. 审核结果：通过/驳回单选，默认通过。\n   3. 通过时选择兑换店铺，自动带出该店铺配置的赠品；表格展示商品名称、属性、规格数量、赠送数量、操作。待审核时可逐行删除SKU，删除仅影响本次审核草稿，不修改店铺默认配置；已审核只读，不提供删除。\n   4. 审核意见最多200字符，通过选填、驳回必填；底部取消、确定。\n3. 切换店铺立即更新赠品列表，保留已填意见及本次各店铺的赠品删除草稿；切回店铺时恢复该店铺的草稿。取消或关闭不保存，重新打开按店铺配置重新带入；提交前不改写原申请。申请店铺与实际兑换店铺分别保存。\n4. 通过时需选有效店铺，至少保留一个赠品且存在可领取SKU；全部删除时禁止通过并提示至少保留一个赠品。仅将本次审核保留的赠品保存为快照及用户候选池，生成待选择资格，不立即扣减候选池全部商品库存，也不发积分。\n5. 用户之后按资格上限选择赠品；上限优先取对应活动配置，缺失时按1处理，并不超过赠品SKU数。\n6. 通过前检查订单未兑换；重复审核不重复发奖。已审核详情只读，按审核时保存的赠品配置回显。\n7. 有订单截图时可点击放大，无图显示暂无订单截图，不生成模拟凭证图片。\n8. 驳回意见未填写时阻止提交；取消不保存。小程序直接提交截图申请的入口尚未在当前原型接通，见6.5。\n\n#### 4.2.16 小程序订单兑换及成功弹窗\n\n##### 页面路径\n\n微信小程序—订单兑换。\n\n##### 页面逻辑\n\n1. 页面内容依次为：活动主图、可兑换订单时间提示、订单号输入、立即兑换、兑换记录、适用店铺、兑换流程。\n2. 活动规则为侧边固定入口；适用店铺显示前三条及查看全部；规则和全部店铺打开弹窗。\n3. 兑换流程是一张固定说明图片，不是可点击的步骤控件，内容为进入平台查看订单、复制订单号、粘贴并兑换、成功后领取奖励。\n4. 输入公域订单号后点击立即兑换，校验订单限制、是否已兑换、候选订单是否唯一、活动状态、店铺、完成时间、奖励门槛及兑换次数；赠品还校验存在可领取SKU。\n5. 积分成功弹窗：成功图标、兑换成功、实际获得积分、温馨提示、查看奖励；查看奖励进入我的积分。\n6. 赠品成功弹窗：兑换成功、可从候选赠品选择N个、赠品及赠送数量、温馨提示、选择并领取赠品；点击进入赠品选择。\n7. 关闭成功弹窗不撤销已发积分或赠品资格。未完成赠品流程可通过我的赠品/兑换记录继续。\n8. 原型没有真实平台接口查询；无订单显示未找到可兑换订单提示，不自动创建审核申请。\n\n#### 4.2.17 小程序兑换记录\n\n##### 页面路径\n\n订单兑换—兑换记录。\n\n##### 页面逻辑\n\n1. 页签为全部、兑换成功、兑换失败；记录按时间倒序展示。\n2. 卡片展示平台、店铺、结果、奖励类型、兑换订单、奖励数量及时间。订单文案统一为“兑换订单：JD00111443111”，不使用“订单号兑换赠品/兑换积分”。\n3. 一个订单只展示积分或赠品一种奖励；积分显示“+N”，赠品显示个数，不叠加两个奖励区块。\n4. 赠品未选择、已选择但未提单、已提单但未付运费，都显示点击领取；完成免运费提单或运费支付后显示查看订单。\n5. 失败记录展示提交订单号、失败原因和时间，不展示已发奖励。\n\n##### 页面交互\n\n1. 点击领取进入我的赠品—赠品选择。已选内容保留；未建单继续确认订单，有待付款订单继续原单支付。\n2. 查看订单：只关联一个赠品订单时直接进入赠品订单详情；关联多个赠品订单时进入我的赠品—已领取列表，不再打开订单选择弹窗。\n3. 积分奖励入口进入我的积分；返回回到订单兑换。\n\n#### 4.2.18 个人中心及我的赠品\n\n##### 页面路径\n\n微信小程序—个人中心—我的赠品。\n\n##### 页面逻辑\n\n1. 个人中心包含头像/昵称/会员信息、优惠券与积分、专属邀请码、我的订单、服务入口、底部导航，样式按最终参考图。\n2. 服务入口保留在线客服、地址管理、我的收藏、我的信息、账号设置、反馈与投诉，增加我的赠品；入口右侧不展示“X件待领取”。非本期服务入口按原型保留展示或提示，不代表已接入完整业务模块。\n3. 我的赠品保留全部、待领取、已领取、已失效筛选；从个人中心进入默认全部。待选择赠品归入全部及待领取。\n4. 未完成选择、提单或运费支付的资格展示待选择赠品及选择赠品入口；不提前改为立即领取或查看订单。\n5. 已选但未完成的流程保留选择；后续恢复不会再次生成领取记录、扣库存或创建重复订单。\n6. 已领取卡片展示图片、名称、属性/规格、数量和查看订单；卡片不额外展示“已领取”文案。\n7. 可领取的历史独立资格卡片保留立即领取入口，不额外显示“待领取”字样；可显示有效期或长期有效。当前新兑换流程优先使用待选择资格入口。\n8. 已失效赠品保留商品信息，内容置灰并显示“已失效”印章，禁止领取。待选择资格到期时显示失效，不开放继续选择。\n9. 全部为空时展示插画及去兑换赠品入口；单状态为空展示对应状态无赠品。\n\n##### 页面交互\n\n1. 选择赠品进入选择页；未建单继续确认订单，有待付款订单继续支付。\n2. 已领取商品点击或查看订单进入赠品订单详情；未领取商品详情使用同一套卡片风格，展示赠品信息并保留立即领取，失效时禁用。\n3. 已发货可通过物流入口查看物流；个人中心我的订单入口保留相应订单状态入口。\n\n#### 4.2.19 赠品选择\n\n1. 页面路径：我的赠品—赠品选择，也可由兑换成功弹窗、兑换记录点击领取进入。\n2. 首次选择展示该次兑换保存的候选SKU、商品图片/名称、属性、赠送数量、可选N个说明和已选数量。\n3. 最少选择1个、最多N个不同SKU。达到上限后其他未选项禁用；无库存、已下架或活动数量不足的SKU不可选择。\n4. 确认领取再次校验资格有效期和库存，生成所选领取记录并占用对应SKU数量，然后进入确认订单。\n5. 已确认选择但未完成提单/支付时，重新进入展示原选择，不再分配第二批赠品；确认后继续确认订单或原单支付。\n6. 选择页返回不删除资格、不重复恢复已占用库存；尚未确认的勾选不视为领取成功。\n\n#### 4.2.20 确认订单\n\n1. 页面路径：我的赠品—赠品选择/立即领取—确认订单。\n2. 页面模块：收货地址、赠品商品信息、费用明细、订单备注、购买须知、底部总计及提交订单。\n3. 收货地址默认读取已保存地址或已有订单地址；点击弹窗编辑。收货人必填，最多20字符；手机号为11位且符合 `1[0-9]{10}`；详细地址必填，5—150字符。\n4. 商品展示图片、名称、规格、金额 `¥0.00` 及数量。数量默认该资格赠送数量，步进范围为1至该资格数量，不能超过已分配数量。\n5. 费用明细展示商品原价 `¥0.00`、运费、订单备注；不显示优惠抵扣。原型运费按所选SKU商品运费相加，生产配送模板合单规则见6.6。\n6. 备注选填，最多200字符。购买须知可弹窗查看，默认未勾选；未勾选时提交按钮禁用。\n7. 提交时再次验证资格未领取/未失效及地址完整。失败保留输入，不重复创建订单。\n8. 运费为0：生成待发货订单并进入成功页；运费大于0：生成待付款订单并进入订单支付页。\n\n#### 4.2.21 支付及结果\n\n1. 页面路径：确认订单—订单支付—支付结果，或免运费提单直接到支付结果样式的成功页。\n2. 支付页展示实际待付运费、订单编号及支付方式；默认微信支付，可选择支付宝支付，底部确认支付。\n3. 当前支付为本地状态模拟；确认后记录支付方式/时间，订单变为待发货，进入成功页。不实现真实扣款或自动支付倒计时关闭。\n4. 成功页展示成功图标、订单处理中提示、查看订单、去首页及推荐区。推荐区不加入赠品商品；未配置图片使用占位图。\n5. 查看订单进入本次赠品订单详情；去首页返回当前原型个人中心。待付款详情可再次进入原订单支付，不重新提单。\n\n#### 4.2.22 小程序赠品及订单详情\n\n1. 已领取赠品订单详情按最终参考图展示：订单状态、物流摘要、收货信息、商品明细、应付合计、商品总额、运费、订单信息及底部操作。\n2. 商品明细显示名称、图片、属性、实付0元和实际领取数量；订单信息含订单编号、下单、支付、发货、完成时间及备注，缺失时间为“—”。\n3. 收货手机号在该详情中脱敏；订单编号可复制。物流弹窗展示已有运单及节点，不伪造签收记录。\n4. 待付款显示支付运费；待收货/已发货显示查看物流、确认收货；已完成显示查看物流、去评价/查看评价；其他状态提供我的赠品入口。\n5. 确认收货需确认，成功后记录完成时间。评价仅已完成订单可提交，保存后可查看，不能重复评价。\n6. 未领取商品详情展示赠品信息、来源订单、领取有效期、赠送数量和费用；立即领取进入确认订单，已失效时禁用。\n\n### 4.3 计算规则\n\n1. 积分计算使用订单实付金额或订单商品下单数量，按活动类型区分：\n\n| 活动类型 | 计算方式 |\n| --- | --- |\n| 订单金额固定积分 | 金额达到门槛，发放固定积分值 |\n| 订单金额比例积分 | `floor(订单金额 / 门槛金额) × 每档积分` |\n| 商品数量固定积分 | 商品数量达到门槛，发放固定积分值 |\n| 商品数量比例积分 | `floor(商品数量 / 门槛数量) × 每档积分` |\n| 订单金额固定赠品 | 金额达到门槛，获得最多选择N个SKU的赠品资格 |\n| 商品数量固定赠品 | 商品数量达到门槛，获得最多选择N个SKU的赠品资格 |\n\n2. 商品数量取订单商品明细下单数量之和；缺失数量的订单不能凭金额替代数量条件。\n3. 可兑换赠品个数统计不同SKU，不是赠送总件数。例如可选1个SKU，所选SKU赠送数量为2，则用户获得该SKU 2份。\n4. 规格数量为商品规格本身的包装/数量字段，与赠送数量分别展示；SKU去重键为商品ID+规格。\n5. 赠品领取成功统一定义：无运费时提单成功且订单待发货；有运费时支付成功且订单进入后续履约状态。仅选择赠品或仅生成待付款订单均为未领取。部分关联资格已完成时后台可展示部分领取。\n6. 商品目录展示价不作为赠品订单优惠抵扣基数；赠品订单商品总额、原价及实付商品金额按0元展示，优惠为“—”。订单应付为运费。\n7. 原型运费为所选商品运费之和，不随同SKU领取数量重复计算；正式模板按区域/重量/合单计算的策略见6.6。\n8. 领取时间：免运费取提单时间，有运费取支付成功时间。多份已领取资格汇总导出使用已有领取时间中的最近一次；未领取记录留空。\n9. 有效期留空时不生成到期时间，显示长期有效；填写D天时以兑换/审核发放时刻加D天保存快照，不因后来修改活动而回改。\n10. 库存占用发生在用户确认所选SKU时，按赠送数量扣减；初始发放候选池资格及赠品审核通过不扣减候选池全部库存。超时、取消、部分数量领取余量策略见6.6。\n\n### 4.4 关键联动逻辑\n\n1. 自动兑换：商品/店铺配置 → 活动规则 → 用户输入订单 → 校验成功并标记已兑换 → 积分成功弹窗或赠品成功弹窗。\n2. 赠品领取：成功弹窗/我的赠品/兑换记录 → 赠品选择 → 确认订单 → 免运费成功，或待付款 → 支付成功 → 成功页 → 订单详情。\n3. 中途退出：未提单/未支付 → 我的赠品仍为待选择 → 恢复原选择 → 继续原提单/支付；不重新发奖、扣库存或建单。\n4. 人工审核：待审核 → 积分通过直接发积分；赠品通过保存所选兑换店铺赠品池及限选数 → 用户按同一领取链路继续；驳回保存原因，不发奖励。\n5. 配置快照：公域店铺默认赠品变更不覆盖已保存的活动独立配置；活动编辑不回改已发资格；已审核赠品详情读取审核时配置。\n6. 同步状态：领取结果驱动我的赠品、兑换记录、兑换数据、审核列表；发货、确认收货和评价更新赠品订单。\n7. 多订单查看：兑换记录关联一个赠品订单直接查看；多个进入我的赠品—已领取列表。\n8. 订单限制优先于兑换资格校验。两个来源同号或来源冲突不静默合并，正式优先级见6.6。\n\n### 4.5 异常处理规则\n\n| 场景 | 页面处理 |\n| --- | --- |\n| 订单号为空 | 提示请输入单号进行兑换，不新增兑换记录 |\n| 未找到订单 | 提示核对订单号，记录失败尝试用于兑换失败页签 |\n| 已兑换 | 阻止再次发奖；存在未选赠品资格时可恢复选择，否则提示查看兑换记录 |\n| 同号多个订单 | 提示核对平台和店铺，不自动取首条 |\n| 活动状态、店铺、完成时间、门槛或次数不符 | 提示具体原因，不发奖励 |\n| 无可用赠品/库存不足 | 阻止确认，保留资格和已填信息，不提示领取成功 |\n| 超过SKU选择上限 | 限制继续勾选，提示最多选择N个 |\n| 领取资格已失效 | 展示失效状态，禁止新选择/新提单 |\n| 收货信息不完整 | 提示并打开地址编辑，不提交订单 |\n| 未同意购买须知 | 提交按钮禁用 |\n| 重复审核/提单/支付 | 读取已有状态，不重复创建奖励或订单 |\n| 驳回无意见 | 阻止提交，提示填写审核意见 |\n| 导入表头错误 | 展示预期/实际表头；末尾空白列不误判 |\n| 导入行错误 | 展示工作表、行号和原因，错误订单整单排除 |\n| 没有可导出记录 | 提示暂无可导出记录，不生成空数据文件 |\n| 审核截图链接超过Excel单元格限制 | 提示链接内容过长，使用图片链接后再导出 |\n\n### 4.6 权限规则\n\n1. 角色使用现有运营后台和小程序会员概念；当前本地原型未实现账号登录、租户隔离和独立权限开关。\n2. 生产应对活动维护、白名单导入/移除、审核、导出、订单备注和发货分别授权，并校验本人赠品资格及订单访问权限；此项为真实系统对接要求，非当前原型已实现功能。\n3. 敏感信息脱敏在具体页面按原型展示，不能据此宣称生产数据权限已完成。\n\n### 4.7 时效与有效期\n\n1. 业务时间按北京时间展示，Excel日期导入支持1900/1904日期体系；文本日期需包含年月日及时间。\n2. 活动有效期与订单完成范围分别配置；订单完成时间等于下限时可通过范围校验。\n3. 领取有效期默认无限期，填写时1—365天；已发资格保留原到期快照。\n4. 原型不提供支付倒计时关单、到期释放库存或自动取消恢复资格。与未付款已占用订单的有效期优先级见6.6。\n\n### 4.8 数据来源\n\n1. 商品、SKU、仓库、库存及运费取商品管理模拟数据；店铺默认赠品、产品组取公域店铺配置。\n2. 活动规则、限选数、有效期取活动保存数据；审核兑换店铺以审核最终选择为准，申请店铺单独保留。\n3. 公域订单来源为预置接口模拟订单或确认导入的白名单；审核材料来自已有申请记录，缺失图片/物流不补造。\n4. 页面共用本地持久化数据，刷新保留；导出取当前筛选数据的全量结果，不取屏幕截图或仅当前分页。\n\n### 4.9 通知机制\n\n1. 使用页面成功弹窗、Toast、状态标签及结果页告知兑换、导入、审核、提单、支付和发货结果。\n2. 当前未实现短信、微信订阅消息或后台异步通知，不新增未经确认的通知渠道。\n\n### 4.10 上限与极限\n\n1. 活动名称50字符，商品名称100字符，产品组名称50字符；审核意见200字符，提单备注200字符，后台商家备注300字符。\n2. 赠品可选SKU数为1至对应配置的SKU数；赠送数量为正整数，活动数量/排序值为非负整数或允许留空的字段。\n3. 白名单文件10MB、5000订单、20000商品行；表头正确但无订单时提示暂无订单。\n4. Excel订单号与ID使用文本，积分/数量使用数值，时间使用日期单元格格式；截图链接文本每单元格不得超过32767字符。\n\n## 5. 状态与异常\n\n### 5.1 业务状态\n\n1. 活动：待开始、进行中、已结束。\n2. 兑换记录：兑换成功、兑换失败；赠品兑换成功后的资格可以尚未选择/领取。不要把待选择误记为兑换失败或尚未兑换。\n3. 审核：待审核、通过、驳回；奖励仅积分或赠品。\n4. 我的赠品筛选：全部、待领取、已领取、已失效；待选择属于待领取范围。\n5. 赠品订单：待付款、待发货、待收货、已完成、已关闭；后台已发货页签对应待收货。\n6. 白名单：页面仅区分未兑换/已兑换，移除后不在列表展示，不增加有效状态。\n\n### 5.2 页面默认态\n\n1. 后台启动展示订单兑换列表；一级菜单按商品、订单、营销、小程序排序。\n2. 活动新建默认订单金额固定积分、统一维度；赠品有效期空白；店铺赠品可兑换数默认1。\n3. 白名单默认兑换状态全部，未导入前可下载模板；校验预览确认前不写入。\n4. 个人中心进入我的赠品默认全部；兑换记录默认全部。未选、未提单或未支付的赠品仍可继续流程。\n5. 确认订单默认未勾选购买须知；支付方式默认微信支付。\n6. 已审核详情只读；公域订单详情弹窗默认基本信息页签。\n\n### 5.3 空态\n\n1. 后台无匹配数据展示暂无符合条件的记录，可清空搜索。\n2. 我的赠品全部为空展示插画和去兑换赠品；状态筛选为空展示对应状态暂无赠品。\n3. 商品/物流/截图/分账信息缺失据实展示空态，不使用其他订单数据填充。\n4. 店铺没有赠品时赠品明细为空，活动添加店铺和审核通过需满足可用配置约束。\n\n### 5.4 异常态 / 失败态\n\n1. 表单校验失败保留输入；切换审核店铺保留审核意见；取消不保存。\n2. 导入错误可查看表格原因，修正后重新上传；不覆盖冲突订单或重置已兑换订单。\n3. 领取中途退出保留资格与流程；未支付订单不算领取成功，恢复时进入原订单支付。\n4. 本地操作没有真实网络失败、支付回调失败或异步发奖重试状态；生产故障处理见6.6。\n\n### 5.5 权限态 / 不可操作态\n\n1. 已有规格禁用重复添加；超过赠品选择上限禁用其他未选项。\n2. 已失效赠品禁用领取；已领取记录不能重复建单。\n3. 已上架或被引用商品不可删除，关联业务的店铺不可删除；删除和结束操作需确认。\n4. 未同意购买须知不能提单；无有效店铺/赠品不能通过赠品审核；已审核不可重复提交。\n5. 真实无权限态由正式系统权限模型控制，原型未提供权限切换演示。\n\n### 5.6 状态-操作矩阵\n\n| 对象状态 | 页面操作 | 结果/限制 |\n| --- | --- | --- |\n| 活动待开始 | 编辑、复制、删除、推广、日志；赠品店铺维度可进活动店铺 | 统一维度不显示活动店铺 |\n| 活动进行中 | 编辑、复制、立即结束、推广、日志；符合条件展示活动店铺 | 结束不回收已发资格 |\n| 活动已结束 | 复制、删除、推广、日志；赠品店铺维度可进活动店铺 | 不重新开启当前兑换 |\n| 审核待审核 | 通过/驳回、选择相应奖励、填意见 | 只发一种奖励 |\n| 审核通过/驳回 | 只读详情、日志 | 通过赠品显示实际领取状态 |\n| 赠品未选择 | 选择赠品 | 确认后生成所选资格并占用库存 |\n| 已选择、未提单 | 仍显示待选择，恢复选择/确认订单 | 不再次扣库存 |\n| 有运费、未支付 | 仍显示待选择，恢复原单支付 | 不重复建单，不算已领取 |\n| 免运费提单成功/运费支付成功 | 查看订单，进入已领取 | 已关联一个订单直达详情，多个到已领取列表 |\n| 赠品已失效 | 查看信息及失效标志 | 禁止新领取 |\n| 订单待付款 | 支付运费、查看详情 | 支付成功后待发货及成功页 |\n| 订单待发货 | 用户查看；后台备注、发货 | 发货后待收货 |\n| 订单待收货/已发货 | 查看物流、确认收货 | 确认后已完成 |\n| 订单已完成 | 查看物流、去评价/查看评价 | 不重复提交评价 |\n| 导入校验完成 | 确认导入、取消 | 仅导入有效完整订单 |\n| 白名单已兑换/未兑换 | 查看商品、移除 | 移除不撤销已发奖励 |\n\n### 5.7 状态流转\n\n1. 积分：输入订单 → 验证通过 → 标记兑换成功/发放积分 → 成功弹窗 → 我的积分。\n2. 赠品：输入订单 → 验证通过 → 标记兑换成功/创建待选择资格 → 成功弹窗 → 赠品选择 → 确认订单。\n3. 免运费：确认订单提交 → 待发货/领取成功 → 成功页 → 订单详情。\n4. 有运费：确认订单提交 → 待付款/仍未领取 → 支付成功 → 待发货/领取成功 → 成功页。\n5. 中断：未提单或未支付 → 我的赠品待选择 → 恢复所选内容或原支付订单；不重新验证兑换或重复扣库存。\n6. 审核：待审核 → 驳回（不发奖励），或通过 → 积分发放/待选择赠品资格 → 与自动兑换共用后续流程。\n7. 履约：待发货 → 后台发货 → 待收货 → 确认收货 → 已完成 → 评价。\n\n## 6. 衍生需求与默认授权项\n\n### 6.1 导出\n\n1. 兑换数据：当前筛选全量结果导出 `.xlsx`，文件名 `兑换数据_YYYY-MM-DD.xlsx`，包含两个工作表。\n   1. sheet1字段顺序：活动名称、活动ID、用户ID、用户昵称、兑换订单、兑换积分、积分发放时间、赠品状态、赠品领取时间、兑换店铺、电商平台。\n   2. sheet2字段顺序：兑换订单、兑换店铺、电商平台、赠品名称、赠品ID、属性、规格数量、赠送数量、订单号。\n   3. sheet1每条兑换一行；sheet2按实际SKU/领取记录展开，尚未选择时沿用当前赠品详情的候选池快照。积分记录不生成赠品明细行。\n   4. 赠品奖励兑换积分为0，积分发放时间留空；无赠品的赠品状态为“—”。未领取时间留空，已领取取提单/支付时间。\n2. 兑换审核：当前筛选全量结果导出 `.xlsx`，文件名 `兑换审核_YYYY-MM-DD.xlsx`，单工作表“兑换审核”。\n   1. 字段顺序：下单平台、店铺名称、提交单号、补充说明、活动ID、用户昵称、用户ID、提交时间、截图、审核时间、审核结果、兑换积分、赠品状态、兑换店铺、关联产品组。\n   2. 下单平台/店铺名称取原申请店铺，兑换店铺取审核实际选择，不混用。\n   3. 只有审核通过的积分奖励填写实际积分，其他为0；审核通过的赠品填写已领取/未领取，其他为“—”。\n   4. 截图导出链接，多张按换行分隔；关联产品组导出实际记录的组名称，未关联留空，不根据店铺全部产品组推断。\n3. Excel冻结首行、设置列宽和筛选，ID保留文本，积分及数量为数值，时间列使用日期格式。导出无数据时提示，不下载空数据文件。\n4. 商品及订单原有导出入口保持各自范围，不强行套用上述两类字段；当前原型基础导出仍采用CSV，商品导入修改也使用CSV，不代表全部文件功能已统一成Excel。\n\n### 6.2 日志\n\n1. 记录活动保存/结束/删除、商品及库存相关操作、店铺赠品和产品组配置、白名单下载/校验/导入/移除、审核、兑换、赠品选择、提单、支付、发货、收货和评价。\n2. 白名单有独立操作日志弹窗，展示时间、操作人、类型、内容；其他页面保留日志入口。\n3. 当前通用日志按本地操作记录展示，尚未实现完整对象级权限、前后值差异或服务端审计隔离，不能作为生产审计系统。\n\n### 6.3 ID 规则\n\n1. 活动、商品、店铺、公域订单沿用已有ID；新兑换、赠品选择批次、领取记录、赠品订单、审核日志分别生成独立ID。\n2. 公域订单号与赠品订单号不能混用。兑换记录连接公域订单、选择资格和领取记录，领取记录再关联赠品订单。\n3. 原型以本地生成字符串模拟ID；生产由服务端生成并校验归属。\n\n### 6.4 通知\n\n1. 积分使用兑换成功弹窗，赠品使用兑换成功及选择领取入口；提单/支付成功使用结果页。\n2. 我的赠品、兑换记录、兑换数据及审核列表读取一致的领取状态，避免只更新单页。\n3. 暂不新增短信、订阅消息、自动提醒或异步发放通知。\n\n### 6.5 端能力限制\n\n1. 当前交付为单文件HTML本地交互原型，本地持久化保存模拟数据；不代表生产后端开发已完成。\n2. 真实平台API、会员身份/订单归属核验、真实微信/支付宝支付、支付回调、物流查询及仓库发货均未接入。\n3. 白名单下载/解析导入及两类Excel导出为可实际操作能力；导出数据仍来自当前本地模拟数据。\n4. 小程序人工截图申请提交链路未新增，审核使用已有/模拟申请；个人中心非本期服务入口、真实首页和普通商品推荐落地页未完整实现。\n5. 推广默认二维码为示意，真实链接/码须由正式小程序能力生成；活动播报与分享投放也未接真实服务。\n6. 后台产品组可维护，但正式订单与产品组命中、产品组积分优先级没有完整服务端实现。\n\n### 6.6 默认授权项\n\n1. 本文更新当前目录需求文档并同步当前原型的嵌入需求说明，不修改「2.6订单兑换」历史文件，不因文档更新改写原型业务功能。\n2. 以下为生产对接待确认项，不覆盖本文已明确的最终页面行为：\n   1. 公域订单唯一键是否需要平台+店铺维度；接口/白名单同号冲突、真实接口异常和先后查询优先级。\n   2. 买家身份归属、租户/用户权限、敏感字段脱敏及下载权限。\n   3. 商品数量活动中的产品组过滤、店铺产品组积分命中优先级，以及真实统计人数按用户去重口径。\n   4. 活动是否允许时间重叠、状态实时刷新与开始/结束边界、结束后审核历史申请的处理。\n   5. 库存占用超时、到期释放、取消/关闭恢复、下架后已有资格履约，以及减少领取数量后的剩余数量处理。\n   6. 多仓/供应商拆单、区域/重量运费模板与合单计算、真实支付回调及超时关单；未付款已占用订单与资格到期的优先级。\n   7. 公域原订单退款后积分/资格回收、赠品售后、分账、税费及履约补偿。\n   8. 服务端事务、并发幂等、网络失败重试、接口超时已有结果查询及正式操作审计。\n3. 不再把“积分与赠品是否叠加”“公域店铺是否维护可选个数”“有效期是否默认30天”“无运费是否需要支付”列为待确认：这些均已由本轮最终实现明确。\n\n## 附件 / 补充材料\n\n### A. 参考图\n\n1. 采用本会话2026-10-14至2026-10-16用户提供的后台及小程序截图，覆盖商品管理、订单管理、活动/店铺/审核/数据、个人中心、兑换/领取/支付/订单详情。\n2. 截图中的商品、用户、物流、金额与统计数用于样式参考；文档不将截图示例值写为固定业务数据。\n3. 兑换流程固定图片已包含在当前HTML原型内，不要求另建可交互步骤。\n\n### B. 历史页面\n\n1. 历史基线为「../2.6订单兑换/」下活动新增、活动店铺、兑换审核、小程序订单兑换页面及原需求文档。\n2. 历史页面仅用于理解沿用能力；与本文冲突时以本文及最终原型为准，不保留旧组合奖励或旧领取状态口径。\n\n### C. 相关文档\n\n1. 本目录「订单兑换赠品-交互原型.html」：最终页面与交互核对依据，左侧需求说明与本文同步。\n2. 本目录「订单白名单导入模板.xlsx」：订单维度/商品维度双表模板。\n3. 本目录「订单兑换赠品需求分析.md」：前期分析过程材料，不能替代本文最终规则。\n\n### D. 验收场景\n\n1. 一级菜单顺序正确；我的赠品和赠品订单不出现在菜单中，个人中心及记录入口仍可访问。\n2. 新建赠品商品可维护五项批量规格数据及四项商品服务，商品表单不再出现售价输入和已删除说明。\n3. 同一公域订单只兑换积分或赠品；积分成功弹窗为实际积分值，赠品成功弹窗展示候选SKU及可选数。\n4. 固定赠品支持统一/店铺维度；新增店铺默认可兑换1个，不能超过配置SKU数；统一维度不显示活动店铺入口。\n5. 公域店铺赠品设置没有可选个数字段或旧摘要；赠送数量、规格数量与可兑换SKU个数分开校验。\n6. 未选择/已选择未提单/有运费未支付时，我的赠品仍为待选择；继续不重复发奖、扣库存、创建订单。\n7. 免运费提单直接成功，有运费先支付再成功；成功页查看订单进入本次订单详情。\n8. 兑换记录已领取关联单一订单直达详情，多个订单到我的赠品—已领取；文案为“兑换订单：编号”。\n9. 后台订单列表无来源，单价0.00、优惠“—”、仓库仅名称、用户含邀请人；详情备注/发货同步生效。\n10. 兑换数据不展示来源，活动含类型，赠品详情五列完整；公域订单弹窗三个页签不补造数据。\n11. 审核单一奖励；选择兑换店铺后自动带出该店铺赠品，申请店铺不被提前覆盖，审核意见保留；通过赠品为待选择资格。\n12. 审核赠品领取状态以免运费提单/运费支付成功为准；驳回需意见，已审核只读且不重复发奖。\n13. 白名单双表导入保留长ID及前导零；商品表末尾空白E列不误报表头；缺失/冲突订单不整单误导入。\n14. 兑换数据导出2个sheet，审核导出1个sheet，字段顺序分别符合6.1；筛选影响导出全量范围，订单号不丢精度。\n15. 保存后刷新保持活动、导入、审核、选择、订单及支付结果；原型中的本地模拟限制不误写为真实系统已上线能力。\n";

function menu(q=''){menus.innerHTML=Object.entries(groups).map(([g,ps])=>{let found=ps.filter(p=>names[p].includes(q));return found.length?`<b>${g}</b>${found.map(p=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${names[p]}</button>`).join('')}`:''}).join('')||'<div class="empty">暂无匹配报表</div>'}
function go(p){page=p;if(!opened.includes(p))opened.push(p);render()}function closeTab(p){opened=opened.filter(x=>x!==p);if(!opened.length)opened=['config'];if(page===p)page=opened.at(-1);render()}
function tabContext(e,p){e.preventDefault();context.style.cssText=`display:block;left:${e.clientX}px;top:${e.clientY}px`;context.innerHTML=`<button onclick="closeTab('${p}')">关闭当前</button><button onclick="opened=['${p}'];go('${p}')">关闭其他</button><button onclick="opened=['config'];go('config')">关闭全部</button>`}document.addEventListener('click',()=>context.style.display='none');

function verify(){let id=exchangeNumber.value.trim(),all=db.orders.filter(o=>o.id===id);verified=null;chosen=[];if(!id)return toast('请输入单号进行兑换');if(all.some(o=>o.used))return toast('订单已兑换，请查看兑换记录');let a=all.filter(o=>!o.whiteRemoved&&o.valid&&true);if(!a.length)return toast('未找到可兑换订单；实际系统保留人工审核入口');if(a.length>1)return toast('同号订单存在多个店铺，请核对平台与店铺');verified=a[0];render()}

function exchangeGiftSelectionLimit(){let a=db.config,rule=a.dimension==='店铺维度'?a.storeRules?.[verified?.store]:a.giftConfig,count=rule?.selectableCount;return Number.isInteger(count)&&count>0?count:(store(verified?.store)?.gifts.length||0)}

function selectionView(){let s=store(verified.store);return `<div class="mpcard"><b>${esc(s.name)}</b><p class="hint">${verified.source} · ${money(verified.amount)}</p>${db.config.gift?`<p>选择赠品 · 最多${exchangeGiftSelectionLimit()}个</p>${s.gifts.map(id=>{let p=prod(id);return `<label><input type="checkbox" ${chosen.includes(id)?'checked':''} ${!p.on||!p.stock?'disabled':''} onchange="choose('${id}',this)"><span>${esc(p.name)}<small>${esc(p.sku)} · ${p.freight?'运费'+money(p.freight):'包邮'}<br>${p.stock?'库存'+p.stock:'暂时售罄'}</small></span></label>`}).join('')}`:''}<p class="hint">${db.config.points?'获得100积分　':''}${db.config.coupon?'获得1张优惠券':''}</p><button class="primary" onclick="redeem()">确认兑换</button></div>`}
function choose(id,el){let s=store(verified.store);if(el.checked&&chosen.length>=exchangeGiftSelectionLimit()){el.checked=false;return toast('最多可选择'+exchangeGiftSelectionLimit()+'个赠品')}chosen=el.checked?[...chosen,id]:chosen.filter(x=>x!==id)}
function redeem(){if(!verified||verified.used)return toast('订单已兑换');if(db.config.gift&&!chosen.length)return toast('请至少选择1个赠品');if(chosen.some(id=>!prod(id).on||prod(id).stock<1))return toast('赠品库存不足，请重新选择');let r={id:uid('EX'),order:verified.id,store:verified.store,source:verified.source,time:stamp(),points:db.config.points,coupon:db.config.coupon,claims:[],reward:[db.config.points?'100积分':'',db.config.coupon?'1张优惠券':'',chosen.length?chosen.length+'件赠品':''].filter(Boolean).join(' + ')};chosen.forEach(id=>{let p=prod(id),c={id:uid('CL'),product:id,sourceOrder:verified.id,expires:giftExpiry(db.config.days),order:null};p.stock--;db.claims.push(c);r.claims.push(c.id)});verified.used=true;db.redemptions.unshift(r);save('兑换成功 '+r.order);verified=null;chosen=[];go('claims');toast('兑换成功，赠品待领取')}

function giftExpiry(days){return days===''||days==null?null:new Date(Date.now()+Number(days)*86400000).toISOString()}
function isGiftClaimExpired(c){return !!c.expires&&new Date(c.expires).getTime()<=Date.now()}

function claimRows(){let a=db.claims.filter(c=>claimFilter==='全部'||(claimFilter==='已领取'?!!c.order:claimFilter==='待领取'?!c.order&&!isGiftClaimExpired(c):!c.order&&isGiftClaimExpired(c)));return a.map(c=>{let p=prod(c.product),expired=isGiftClaimExpired(c);return `<div class="mpcard"><label><input type="checkbox" ${claimSelection.includes(c.id)?'checked':''} ${c.order||expired?'disabled':''} onchange="claimSelection=this.checked?[...claimSelection,'${c.id}']:claimSelection.filter(x=>x!=='${c.id}')"><span>${esc(p.name)}<small>${esc(p.sku)} × 1<br>${c.order?'已领取':expired?'已过期':'待领取'}${c.expires?' · 到期 '+new Date(c.expires).toLocaleDateString('zh-CN'):' · 长期有效'}</small></span></label><small>来源订单 ${esc(c.sourceOrder)}</small>${c.order?`<button onclick="detailId='${c.order}';go('detail')">查看订单</button>`:''}</div>`}).join('')||'<div class="empty">暂无符合条件的赠品</div>'}

function matches(value,q){return !q||String(value??'').includes(q)}
function sliced(a){let p=paging[page]||1,n=filters[page]?.size||20;return a.slice((p-1)*n,p*n)}
function pager(a){let p=paging[page]||1,n=filters[page]?.size||20,total=Math.max(1,Math.ceil(a.length/n));return `<div class="pagination">共 ${a.length} 条 <button ${p===1?'disabled':''} onclick="paging[page]=${p-1};render()">‹</button><button class="primary">${p}</button><button ${p>=total?'disabled':''} onclick="paging[page]=${p+1};render()">›</button><select onchange="setFilter('size',+this.value);query()">${[5,10,20,50].map(x=>`<option value="${x}" ${+n===x?'selected':''}>${x}条/页</option>`).join('')}</select></div>`}

function exportRows(rows,name){if(!rows.length)return toast('暂无可导出记录');let ks=Object.keys(rows[0]);download([ks.join(','),...rows.map(r=>ks.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n'),name+'.csv');toast('已导出演示数据')}
function topactions(title,savefn,cancelfn){return `<div class="topactions"><button class="link" onclick="${cancelfn}">‹ ${title}</button><span><button onclick="${cancelfn}">取消</button> <button class="primary" onclick="${savefn}">保存</button></span></div>`}
function formrow(n,c,required=false){return `<div class="row"><label class="${required?'req':''}">${n}</label><div class="control">${c}</div></div>`}
function textinput(obj,k,placeholder='',type='text',extra=''){return `<input type="${type}" value="${esc(obj[k]??'')}" placeholder="${placeholder}" ${extra} oninput="${obj===activityDraft?'activityDraft':'productDraft'}.${k}=${type==='number'?'Number(this.value)':'this.value'};${obj===activityDraft&&k==='name'?"document.getElementById('previewName').textContent=this.value":''}">`}
function anchor(items){return `<aside class="anchor">${items.map(([id,n])=>`<button onclick="document.getElementById('${id}').scrollIntoView({behavior:'smooth'})">${n}</button>`).join('')}</aside>`}
function editor(obj,k){let prefix=obj===activityDraft?'activityDraft':'productDraft';return `<div class="editor"><div class="editorbar">正文　│ <button type="button" onclick="formatEditor('${prefix}','${k}','**')"><b>B</b></button><button type="button" onclick="formatEditor('${prefix}','${k}','_')"><i>I</i></button>　字号　字体　行高　│　图文内容</div><textarea id="editor-${k}" placeholder="请输入内容" oninput="${prefix}.${k}=this.value">${esc(obj[k]||'')}</textarea></div>`}

function imageUploader(o,k){let obj=o==='activityDraft'?activityDraft:productDraft;return `<label class="upload">${obj[k]?`<img src="${esc(obj[k])}">`:'<span>＋</span>上传图片'}<input hidden type="file" accept="image/png,image/jpeg" onchange="uploadTo(this.files[0],'${o}','${k}')"></label>`}

const activityTypeOptions=['订单金额固定积分','订单金额比例积分','商品数量固定积分','商品数量比例积分','订单金额固定赠品','商品数量固定赠品'];
let activityGiftSettingContext=null,activityShopSelection=new Set();
function isGiftActivity(a){return !!a&&['订单金额固定赠品','商品数量固定赠品'].includes(a.type)}

function giftThresholdInput(a,rule,key){let amount=a.type==='订单金额固定赠品';let prefix=key?'activityRuleDraft().storeRules['+JSON.stringify(key)+']':'activityDraft';return `<div class="gift-rule-expression">${amount?'订单满':'商品满'} <input aria-label="${key?'店铺'+key:'统一'}兑换门槛" type="number" min="${amount?'0.01':'1'}" step="${amount?'0.01':'1'}" value="${rule.threshold??''}" placeholder="${amount?'订单金额':'商品数量'}" oninput='${prefix}.threshold=this.value===\"\"?\"\":+this.value'> ${amount?'元':'件'}，可兑换 <input aria-label="${key?'店铺'+key:'统一'}可兑换赠品个数" type="number" min="1" step="1" max="${activityGiftSkuCount(key?rule:a.giftConfig)}" value="${key?rule.selectableCount??'':a.giftConfig.selectableCount??''}" placeholder="赠品个数" oninput='${key?prefix:'activityDraft.giftConfig'}.selectableCount=this.value===\"\"?\"\":+this.value'> 个赠品</div>`}
function openUnifiedActivityGiftProducts(){normalizeActivityDraft(activityDraft);activityGiftSettingContext={sid:null,direct:true};storeDraft={rows:structuredClone(activityDraft.giftConfig.giftItems||[])};openGiftProducts()}
function uniformActivityGiftToolbar(){return `<div class="bar gift-batch"><span>批量设置：</span><span>赠送数量</span><input id="activityGiftBatchQuantity" type="number" min="1" step="1" placeholder="请输入数量"><span>商品活动数量</span><input id="activityGiftBatchStock" type="number" min="0" step="1" placeholder="不填表示不限购"><button onclick="batchUniformActivityGifts()">批量设置</button><button class="link" style="margin-left:auto" onclick="openUnifiedActivityGiftProducts()">＋ 添加赠品</button></div>`}
function renderActivityGiftItems(config){let rows=config.giftItems||[];return table(['赠送数量 <span style="color:#ff0000">*</span>','库存数量','商品活动数量','排序值','售价','商品名称','属性','规格数量','操作'],rows.map((r,i)=>{let p=prod(r.product);if(!p)return '';let sku=giftSku(p,r.skuIndex);return `<tr><td><input style="width:90px" aria-label="活动赠送数量${i}" type="number" min="1" step="1" value="${r.quantity}" oninput="activityDraft.giftConfig.giftItems[${i}].quantity=this.value===''?'':+this.value"></td><td>${sku.stock??p.stock}</td><td><input style="width:110px" aria-label="活动商品数量${i}" type="number" min="0" step="1" value="${r.activityStock??''}" placeholder="不填表示不限购" oninput="activityDraft.giftConfig.giftItems[${i}].activityStock=this.value===''?'':+this.value"></td><td><input style="width:80px" aria-label="活动排序值${i}" type="number" min="0" step="1" value="${r.sort??0}" oninput="activityDraft.giftConfig.giftItems[${i}].sort=this.value===''?'':+this.value"></td><td>${money(sku.price||0)}</td><td><span class="tag gift">赠品</span> ${esc(p.name)}<small>ID: ${p.id}</small></td><td>${esc(sku.name||'—')}</td><td>${sku.count||1}</td><td><button class="link" onclick="removeUniformActivityGift(${i})">删除</button></td></tr>`}).join(''))}
function batchUniformActivityGifts(){let q=activityGiftBatchQuantity.value,n=activityGiftBatchStock.value,rows=activityDraft.giftConfig.giftItems;if(!rows.length)return toast('请先添加赠品');if(q===''&&n==='')return toast('请填写批量设置内容');if(q!==''&&(!Number.isInteger(+q)||+q<1)||n!==''&&(!Number.isInteger(+n)||+n<0))return toast('赠送数量须为正整数，活动数量须为非负整数');rows.forEach(r=>{if(q!=='')r.quantity=+q;if(n!=='')r.activityStock=+n});render();toast('批量设置已写入赠品明细')}
function removeUniformActivityGift(i){if(!confirm('是否确认删除该赠品规格？'))return;activityDraft.giftConfig.giftItems.splice(i,1);render()}

function activityGiftRules(a){let uniform=a.dimension==='统一维度';return `${uniform?`<div class="row"><label class="req">赠品发放规则</label><div class="wide">${giftThresholdInput(a,a,null)}${uniformActivityGiftToolbar()}<div class="tablewrap">${renderActivityGiftItems(a.giftConfig)}</div></div></div>`:activityStoreRuleBox(a)}${formrow('赠品领取有效期',`<input aria-label="赠品领取有效期" type="number" min="1" max="365" step="1" value="${a.days??''}" placeholder="不填写表示没有期限" oninput="activityDraft.days=this.value===''?'':+this.value">`)}`}
function renderActivityRules(a){normalizeActivityDraft(a);let dimensions=a.gift?['统一维度','店铺维度']:['统一维度','店铺维度','店铺产品组维度'];return `${formrow('兑换订单范围',`<input type="datetime-local" value="${a.completedAfter||''}" onchange="activityDraft.completedAfter=this.value"><small>若配置，仅允许该时间及以后完成的订单</small>`)}${formrow('兑换维度',`<div class="seg">${dimensions.map(t=>`<button class="${a.dimension===t?'selected':''}" onclick="activityDraft.dimension='${t}';render()">${t}</button>`).join('')}</div>`,true)}${a.gift?activityGiftRules(a):formrow('积分发放规则',`<div class="compact">${a.type.includes('数量')?'商品满':'订单满'} <input type="number" value="${a.threshold??''}" min="0" oninput="activityDraft.threshold=+this.value"> ${a.type.includes('数量')?'件':'元'}，可兑换 <input type="number" value="${a.pointsValue??''}" min="1" oninput="activityDraft.pointsValue=+this.value"> 积分</div>`,true)}`}
function openActivityGiftSettings(sid=null,addImmediately=false){normalizeActivityDraft(activityRuleDraft());let conf=sid?activityRuleDraft().storeRules[sid]:activityRuleDraft().giftConfig;if(!conf)return toast('请先添加店铺');activityGiftSettingContext={sid};giftSettingsStore=sid;storeDraft={rows:structuredClone(conf.giftItems||[])};modal.style.width='1180px';renderGiftSettings();modal.showModal();if(addImmediately)openGiftProducts()}
function activityGiftSettingsTitle(){return activityGiftSettingContext?(activityGiftSettingContext.sid?store(activityGiftSettingContext.sid).name+' · 活动赠品设置':'统一维度 · 赠品设置'):store(giftSettingsStore).name+' · 赠品设置'}
function commitActivityGiftSettings(){let sid=activityGiftSettingContext.sid,conf=sid?activityRuleDraft().storeRules[sid]:activityRuleDraft().giftConfig;conf.giftItems=structuredClone(storeDraft.rows);activityGiftSettingContext=null;modal.close();render();toast('活动赠品设置已更新，保存活动后生效')}
let activityShopPicker={query:'',page:1,size:10};
function activityStoreRuleBox(a){return `<div class="activity-store-rulebox"><div class="activity-store-batch"><b>批量设置：</b><input id="activityStoreBatchThreshold" aria-label="批量门槛" type="number" min="${a.type.includes('金额')?'0.01':'1'}" step="${a.type.includes('金额')?'0.01':'1'}" placeholder="${a.type.includes('金额')?'批量门槛金额':'批量门槛数量'}"><input id="activityStoreBatchGifts" aria-label="批量赠品个数" type="number" min="1" step="1" placeholder="${isGiftActivity(a)?'批量赠品个数':'批量积分'}"><button onclick="batchActivityStoreRules()">批量设置</button><button class="link" style="margin-left:auto" onclick="chooseGiftActivityStores()">＋ 添加店铺</button></div><div class="tablewrap">${table(['店铺',isGiftActivity(a)?'活动赠品规则':'活动积分规则','操作'],a.stores.map(id=>{let s=store(id),r=a.storeRules[id];if(!s||!r)return '';return `<tr><td><span class="tag">${s.platform}</span> ${esc(s.name)}<small>(ID: ${s.id})</small></td><td>${activityStoreRuleExpression(a,r,id)}</td><td style="white-space:nowrap">${isGiftActivity(a)?`<button class="link" onclick="openActivityGiftSettings('${id}')">赠品设置</button>`:''}<button class="link" style="color:#ff4100" onclick="removeGiftActivityStore('${id}')">删除</button></td></tr>`}).join(''))}</div></div>`}
function batchActivityStoreRules(){let t=activityStoreBatchThreshold.value,n=activityStoreBatchGifts.value,a=activityRuleDraft(),amount=a.type.includes('金额');if(!a.stores.length)return toast('请先添加店铺');if(t===''&&n==='')return toast('请填写批量设置内容');if(t!==''&&(!Number.isFinite(+t)||+t<=0||(amount?Math.abs(+t*100-Math.round(+t*100))>0.000001:!Number.isInteger(+t))))return toast(amount?'门槛金额须大于0且最多两位小数':'商品门槛数量须为正整数');if(n!==''&&(!Number.isInteger(+n)||+n<1))return toast('可兑换赠品个数须为正整数');if(isGiftActivity(a)&&n!==''&&a.stores.some(id=>+n>activityGiftSkuCount(a.storeRules[id])))return toast('赠品个数不能超过任一店铺配置的赠品SKU数');a.stores.forEach(id=>{if(t!=='')a.storeRules[id].threshold=+t;if(n!=='')a.storeRules[id][isGiftActivity(a)?'selectableCount':'pointsValue']=+n});render();toast('店铺规则已批量设置')}
function chooseGiftActivityStores(){activityShopSelection=new Set();activityShopPicker={query:'',page:1,size:10};renderGiftActivityStorePicker();modal.showModal()}
function activityShopPickerRows(){return db.stores.filter(s=>(!isGiftActivity(activityRuleDraft())||configuredGiftRows(s).length>0)&&matches(s.name,activityShopPicker.query))}
function renderGiftActivityStorePicker(){let a=activityShopPickerRows(),max=Math.max(1,Math.ceil(a.length/activityShopPicker.size));activityShopPicker.page=Math.min(activityShopPicker.page,max);let rows=a.slice((activityShopPicker.page-1)*activityShopPicker.size,activityShopPicker.page*activityShopPicker.size);modal.style.width='760px';modal.innerHTML=`<div class="gift-modal-head"><h1>选择公域店铺</h1><button class="link" onclick="modal.close()">×</button></div><div class="activity-shop-search"><label>店铺名称：</label><input id="activityShopQuery" value="${esc(activityShopPicker.query)}" placeholder="输入店铺名称" onkeydown="if(event.key==='Enter')searchActivityShops()"><button class="searchbtn" aria-label="搜索店铺" onclick="searchActivityShops()">${searchIcon}</button></div><div class="activity-shop-table">${table(['<input id="activityShopAll" aria-label="全选店铺" type="checkbox" onchange="selectAllActivityShops(this.checked)">','平台','店铺名称','店铺ID','创建时间'],rows.map(s=>{let added=activityRuleDraft().stores.includes(s.id);return `<tr><td><input type="checkbox" data-activity-shop="${s.id}" ${added||activityShopSelection.has(s.id)?'checked':''} ${added?'disabled':''} onchange="this.checked?activityShopSelection.add('${s.id}'):activityShopSelection.delete('${s.id}');updateActivityShopAll()"></td><td>${s.platform}</td><td>${esc(s.name)}</td><td>${s.id}</td><td>${esc(s.createdAt||s.created||'2026-07-31 15:33:03')}</td></tr>`}).join(''))}</div><div class="pagination">共 ${a.length} 条 <button ${activityShopPicker.page===1?'disabled':''} onclick="activityShopPicker.page--;renderGiftActivityStorePicker()">‹</button> <button class="primary">${activityShopPicker.page}</button> <button ${activityShopPicker.page>=max?'disabled':''} onclick="activityShopPicker.page++;renderGiftActivityStorePicker()">›</button><select aria-label="店铺每页条数" onchange="activityShopPicker.size=+this.value;activityShopPicker.page=1;renderGiftActivityStorePicker()">${[10,20,50].map(n=>`<option value="${n}" ${n===activityShopPicker.size?'selected':''}>${n}条/页</option>`).join('')}</select></div><div class="modalfooter"><button onclick="modal.close()">取消</button><button class="primary" onclick="commitGiftActivityStores()">确定</button></div>`;updateActivityShopAll()}
function searchActivityShops(){activityShopPicker.query=activityShopQuery.value.trim();activityShopPicker.page=1;renderGiftActivityStorePicker()}
function updateActivityShopAll(){let all=modal.querySelector('#activityShopAll'),a=[...modal.querySelectorAll('[data-activity-shop]:not(:disabled)')],n=a.filter(e=>activityShopSelection.has(e.dataset.activityShop)).length;all.checked=!!a.length&&n===a.length;all.indeterminate=n>0&&n<a.length;all.disabled=!a.length}
function selectAllActivityShops(on){modal.querySelectorAll('[data-activity-shop]:not(:disabled)').forEach(e=>{e.checked=on;on?activityShopSelection.add(e.dataset.activityShop):activityShopSelection.delete(e.dataset.activityShop)});updateActivityShopAll()}

function commitGiftActivityStores(){activityShopSelection.forEach(id=>{if(activityRuleDraft().stores.includes(id))return;let s=store(id);activityRuleDraft().stores.push(id);activityRuleDraft().storeRules[id]=isGiftActivity(activityRuleDraft())?{threshold:'',giftItems:configuredGiftRows(s),selectableCount:1}:{threshold:'',pointsValue:''}});modal.close();render()}
function removeGiftActivityStore(id){if(!confirm('确认移除该活动店铺及其赠品规则？'))return;activityRuleDraft().stores=activityRuleDraft().stores.filter(s=>s!==id);delete activityRuleDraft().storeRules[id];render()}
function validateGiftConfig(config){let count=activityGiftSkuCount(config);return count>0&&Number.isInteger(config.selectableCount)&&config.selectableCount>0&&config.selectableCount<=count&&(config.giftItems||[]).every(r=>prod(r.product)&&Number.isInteger(r.quantity)&&r.quantity>0&&(r.activityStock===''||r.activityStock==null||Number.isInteger(r.activityStock)&&r.activityStock>=0)&&(r.sort===''||r.sort==null||Number.isInteger(r.sort)&&r.sort>=0))}
function persistActivity(){let a=normalizeActivityDraft(activityDraft);if(!a.name?.trim())return toast('请填写活动名称');if(a.start&&a.end&&a.start>=a.end)return toast('活动结束时间须晚于开始时间');if(a.gift){let amount=a.type==='订单金额固定赠品',validThreshold=n=>Number.isFinite(n)&&n>0&&(amount?Math.abs(n*100-Math.round(n*100))<0.000001:Number.isInteger(n));if(a.days!==''&&a.days!=null&&(!Number.isInteger(a.days)||a.days<1||a.days>365))return toast('赠品领取有效期须为1—365天整数，或留空表示没有期限');if(a.dimension==='统一维度'){if(!validThreshold(a.threshold))return toast(amount?'请填写大于0且最多两位小数的订单金额':'请填写正整数商品数量');if(!validateGiftConfig(a.giftConfig))return toast('请添加赠品规格，可兑换个数不能超过赠品SKU数')}else{if(!a.stores.length)return toast('请添加有赠品的店铺');for(let id of a.stores){let r=a.storeRules[id];if(!store(id)||!r||!validThreshold(r.threshold)||!validateGiftConfig(r))return toast((store(id)?.name||'店铺')+'的门槛或赠品配置不完整')}}}else if(!(a.threshold>0)||!Number.isInteger(a.pointsValue)||a.pointsValue<1)return toast('请填写大于0的门槛和正整数积分');let v=structuredClone(a);v.id=currentActivity||uid('OE');v.status=v.end&&new Date(v.end)<new Date()?'已结束':v.start&&new Date(v.start)>new Date()?'待开始':'进行中';v.updated=stamp();if(currentActivity)Object.assign(db.activities.find(x=>x.id===currentActivity),v);else db.activities.unshift(v);Object.assign(db.config,{activityId:v.id,name:v.name,api:true,imported:true,points:v.points,coupon:false,gift:v.gift,days:v.days??'',type:v.type,dimension:v.dimension,threshold:v.threshold,giftConfig:structuredClone(v.giftConfig),storeRules:structuredClone(v.storeRules),stores:[...v.stores]});save('保存活动 '+v.id);activityDraft=null;go('activities');toast('活动已保存')}

function activityRows(){let f=filters.activities||{};return db.activities.filter(a=>matches(a.name,f.name)&&(!f.start||(a.end||'9999')>=f.start)&&(!f.end||(a.start||'0000')<=f.end)&&(!f.id||a.id===f.id)&&(!f.type||a.type===f.type)&&(!f.status||a.status===f.status))}

function activityMore(e,id){clearTimeout(window.activityHoverTimer);let x=db.activities.find(a=>a.id===id),r=e.currentTarget.getBoundingClientRect(),m=document.getElementById('hovermenu');m.innerHTML=`${x.dimension==='店铺维度'&&(isGiftActivity(x)||x.status==='进行中')?`<button onclick="openActivityStores('${id}');hideHover()">活动店铺</button>`:''}${x.status!=='已结束'?`<button onclick="promoteActivity('${id}');hideHover()">推广</button>`:''}<button onclick="showLogs('${id}');hideHover()">日志</button>`;m.style.cssText=`display:block;left:${Math.min(r.left,innerWidth-130)}px;top:${Math.min(r.bottom,innerHeight-(m.querySelectorAll('button').length*32+8))}px`;e.currentTarget.onmouseleave=()=>window.activityHoverTimer=setTimeout(hideHover,80);m.onmouseenter=()=>clearTimeout(window.activityHoverTimer);m.onmouseleave=()=>window.activityHoverTimer=setTimeout(hideHover,80)}
let promotionState=null;
function promotionDataUri(svg){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function promotionCodeSvg(){let dots='';for(let r=0;r<6;r++){let radius=40+r*10,n=18+r*9;for(let i=0;i<n;i++){if((i*7+r*11)%5===0)continue;let theta=i/n*Math.PI*2;dots+=`<circle cx="${100+Math.cos(theta)*radius}" cy="${100+Math.sin(theta)*radius}" r="${r%2?1.7:2.1}" fill="#333"/>`}}return `<svg xmlns="http://www.w3.org/2000/svg" width="220" height="250" viewBox="-10 -10 220 250"><rect x="-10" y="-10" width="220" height="250" fill="white"/>${dots}<circle cx="100" cy="100" r="24" fill="#6949bd"/><path d="M89 101c-13-12 6-25 14-14 12 13-6 25-14 14m15-2c13 12-6 25-14 14" fill="none" stroke="white" stroke-width="5"/><text x="100" y="225" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#888">小程序码示意</text></svg>`}
function promotionDefaultPoster(){return promotionDataUri(`<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1000" viewBox="0 0 750 1000"><defs><linearGradient id="bg" x2=".7" y2="1"><stop stop-color="#c49af5"/><stop offset=".55" stop-color="#ece1ff"/><stop offset="1" stop-color="#fff0f7"/></linearGradient><radialGradient id="light"><stop stop-color="white" stop-opacity=".8"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient></defs><rect width="750" height="1000" rx="12" fill="url(#bg)"/><path d="M375 530 60 0h100zm0 0L280 0h120zm0 0L590 0h120zm0 0L750 240v150zm0 0L0 270v160z" fill="white" opacity=".16"/><circle cx="375" cy="500" r="360" fill="url(#light)"/><text x="50" y="75" fill="white" font-size="30" font-family="sans-serif" font-weight="bold">YOU · 会员好礼</text><text x="375" y="255" text-anchor="middle" fill="#7946d5" stroke="white" stroke-width="12" paint-order="stroke" font-family="sans-serif" font-size="100" font-weight="bold">好礼兑不停</text><text x="375" y="307" text-anchor="middle" fill="#8860c5" font-size="22" font-family="sans-serif" letter-spacing="3">REDEEM YOUR REWARDS</text><g transform="translate(60 330) scale(3.3)">${giftHero().replace(/<svg[^>]*>|<\/svg>/g,'')}</g><ellipse cx="375" cy="844" rx="280" ry="38" fill="#d6c2f5" opacity=".6"/><text x="65" y="913" fill="#6949bd" font-size="23" font-family="sans-serif">复制订单号 · 领取会员好礼</text><text x="65" y="950" fill="#999" font-size="17" font-family="sans-serif">兑换后请前往个人中心领取赠品</text></svg>`)}
function promoteActivity(id){let a=db.activities.find(x=>x.id===id);promotionState={id,tab:'link',title:a.shareTitle||a.name,shareImage:a.shareImage||promotionDefaultPoster(),poster:a.poster||a.posterImage||promotionDefaultPoster()};modal.style.width='800px';renderPromotion();modal.showModal()}
function promotionNav(){return `<aside class="promotion-nav"><button class="${promotionState.tab==='link'?'active':''}" onclick="switchPromotionTab('link')">小程序<br>链接与二维码</button><button class="${promotionState.tab==='share'?'active':''}" onclick="switchPromotionTab('share')">小程序<br>分享设置</button></aside>`}

function renderPromotion(){let p=promotionState,a=db.activities.find(x=>x.id===p.id),path=a.miniProgramPath||'pages/order-exchange/index?activityId='+p.id,link=a.miniProgramLink||'',code=a.miniProgramCode||promotionDataUri(promotionCodeSvg());modal.classList.add('promotion-dialog');modal.innerHTML=`<div class="gift-modal-head"><h1>推广</h1><button class="link" onclick="closePromotion()">×</button></div><div class="promotion-layout">${promotionNav()}${p.tab==='link'?`<section class="promotion-poster-preview"><img class="promotion-poster-image" src="${esc(p.poster)}"><img class="promotion-code-overlay" src="${esc(code)}" alt="${a.miniProgramCode?'小程序码':'小程序码示意'}"></section><section class="promotion-link-fields"><div><h3>小程序链接</h3><div class="promotion-copy"><input id="promotionMiniLink" readonly value="${esc(link)}" placeholder="生成后显示小程序链接"><button ${link?'':'disabled'} onclick="copyPromotionValue('promotionMiniLink')">复制链接</button></div></div><div><h3>小程序路径</h3><div class="promotion-copy"><input id="promotionMiniPath" readonly value="${esc(path)}"><button onclick="copyPromotionValue('promotionMiniPath')">复制链接</button></div></div><div class="promotion-download"><button onclick="downloadPromotion('code')">＋ 下载小程序码</button><button onclick="downloadPromotion('poster')">＋ 下载海报</button></div></section>`:`<section class="promotion-share-preview"><h3>小程序分享卡片设置</h3><div class="promotion-chat"><div class="promotion-avatar"></div><div class="promotion-card"><div class="promotion-card-brand">◉　YOU母婴</div><div class="promotion-card-title" id="promotionTitlePreview">${esc(p.title)}</div><img id="promotionSharePreview" src="${esc(p.shareImage)}"><div class="promotion-card-footer">小程序</div></div></div></section><section class="promotion-share-fields"><h3 class="req">分享标题</h3><input id="promotionShareTitle" maxlength="50" value="${esc(p.title)}" placeholder="请输入分享标题" oninput="promotionState.title=this.value;document.getElementById('promotionTitlePreview').textContent=this.value"><h3 class="req">分享图</h3>${promotionUpload('shareImage')}<small>分享图尺寸建议：宽高比例5:4；适用于分享给好友与微信朋友圈</small><h3>海报</h3>${promotionUpload('poster',true)}<small>海报尺寸建议：750px×1000px；适用于分享海报</small></section>`}</div><div class="modalfooter">${p.tab==='link'?'<button onclick="closePromotion()">关闭</button>':'<button onclick="closePromotion()">取消</button><button class="primary" onclick="savePromotion()">保存</button>'}</div>`}
function closePromotion(){promotionState=null;modal.close()}
async function uploadPromotionImage(file,key){if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type))return toast('请上传PNG、JPG或WEBP图片');if(file.size>4*1024*1024)return toast('图片请小于4MB');let result=await new Promise(resolve=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)});if(!promotionState)return;promotionState[key]=result;renderPromotion()}
async function copyPromotionValue(id){let value=document.getElementById(id).value;if(!value)return;try{await navigator.clipboard.writeText(value);toast('复制成功')}catch(e){let field=document.getElementById(id);field.select();if(document.execCommand('copy'))toast('复制成功');else toast('请手动复制已选中的内容')}}
function savePromotion(){let p=promotionState;if(!p.title.trim())return toast('请输入分享标题');if(!p.shareImage)return toast('请上传分享图');let a=db.activities.find(x=>x.id===p.id);Object.assign(a,{shareTitle:p.title.trim(),shareImage:p.shareImage,poster:p.poster,updated:stamp()});try{save('活动推广设置 '+p.id)}catch(e){return toast('保存失败，请减小上传图片后重试')}closePromotion();render();toast('推广设置已保存')}
async function downloadPromotion(kind){let a=db.activities.find(x=>x.id===promotionState.id),src=kind==='code'?(a.miniProgramCode||promotionDataUri(promotionCodeSvg())):promotionState.poster;try{let img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=src});let canvas=document.createElement('canvas');canvas.width=kind==='code'?440:750;canvas.height=kind==='code'?500:1000;let ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);if(kind==='poster'){let code=new Image();await new Promise((ok,no)=>{code.onload=ok;code.onerror=no;code.src=a.miniProgramCode||promotionDataUri(promotionCodeSvg())});ctx.drawImage(code,535,745,170,194)}canvas.toBlob(blob=>{if(!blob)return toast('图片导出失败');let url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download=(kind==='code'?(a.miniProgramCode?'小程序码':'小程序码示意'):'活动海报')+'_'+a.id+'.png';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('图片已下载')},'image/png')}catch(e){toast('图片下载失败，请检查上传图片')}}
modal.addEventListener('close',()=>{modal.classList.remove('promotion-dialog');promotionState=null});

let activityStoresId=null;
let activityStoresDraft=null;
function activityRuleDraft(){return page==='activitystores'?activityStoresDraft:activityDraft}
function activityStoreRuleExpression(a,r,id){if(isGiftActivity(a))return giftThresholdInput(a,r,id);let goods=a.type.includes('数量'),every=a.type.includes('比例'),prefix=`activityRuleDraft().storeRules[${JSON.stringify(id)}]`;return `<div class="gift-rule-expression">${goods?'商品':'订单'}${every?'每满':'满'} <input aria-label="店铺${id}兑换门槛" type="number" min="${goods?'1':'0.01'}" step="${goods?'1':'0.01'}" value="${r.threshold??''}" placeholder="${goods?'商品数量':'订单金额'}" oninput='${prefix}.threshold=this.value===\"\"?\"\":+this.value'> ${goods?'件':'元'}，可兑换 <input aria-label="店铺${id}兑换积分" type="number" min="1" step="1" value="${r.pointsValue??''}" placeholder="积分" oninput='${prefix}.pointsValue=this.value===\"\"?\"\":+this.value'> 积分</div>`}
function openActivityStores(id){let original=db.activities.find(a=>a.id===id);if(!original)return toast('活动不存在');activityStoresId=id;activityStoresDraft=normalizeActivityDraft(structuredClone(original));activityStoresDraft.stores=activityStoresDraft.stores.filter(id=>store(id));activityStoresDraft.stores.forEach(id=>{if(!activityStoresDraft.storeRules[id])activityStoresDraft.storeRules[id]={threshold:original.threshold??'',pointsValue:original.pointsValue??''}});names.activitystores='活动店铺';go('activitystores')}
views.activitystores=()=>{let a=activityStoresDraft;if(!a||a.id!==activityStoresId)return '<div class="empty">活动不存在</div>';return `<div class="topactions"><button class="link" onclick="cancelActivityStores()">‹ 活动店铺 · ${esc(a.name)}</button><span><button onclick="cancelActivityStores()">取消</button> <button class="primary" onclick="saveActivityStores()">保存</button></span></div><div class="activity-stores-workspace">${activityStoreRuleBox(a)}</div>`}
function cancelActivityStores(){if(!confirm('确认离开？当前未保存的活动店铺修改将不会保存。'))return;activityStoresDraft=null;go('activities')}
function saveActivityStores(){let a=activityStoresDraft,gift=isGiftActivity(a),goods=a.type.includes('数量');if(!a.stores.length)return toast('请至少添加一个店铺');for(let id of a.stores){let r=a.storeRules[id];if(!store(id)||!r||!Number.isFinite(r.threshold)||r.threshold<=0||(goods?!Number.isInteger(r.threshold):Math.abs(r.threshold*100-Math.round(r.threshold*100))>0.000001))return toast((store(id)?.name||'店铺')+'的兑换门槛不正确');if(gift?!validateGiftConfig(r):!Number.isInteger(r.pointsValue)||r.pointsValue<1)return toast(store(id).name+(gift?'的赠品配置或可兑换个数不正确':'的兑换积分须为正整数'))}let original=db.activities.find(x=>x.id===a.id);if(!original)return toast('活动已不存在');original.stores=[...a.stores];original.storeRules=structuredClone(a.storeRules);original.updated=stamp();if(db.config.activityId===a.id)Object.assign(db.config,{stores:[...original.stores],storeRules:structuredClone(original.storeRules)});save('保存活动店铺及规则 '+a.id);activityStoresDraft=normalizeActivityDraft(structuredClone(original));toast('活动店铺及规则已保存');render()}


function hideHover(){document.getElementById('hovermenu').style.display='none'}function endActivity(id){if(!confirm('是否立即结束，结束后用户将不可新增兑换？'))return;let a=db.activities.find(a=>a.id===id);a.status='已结束';a.end=stamp().replace(' ','T');save('结束活动 '+id);hideHover();render()}function deleteActivity(id){if(!confirm('是否确认删除？'))return;db.activities=db.activities.filter(a=>a.id!==id);save('删除活动 '+id);hideHover();render()}

views.config=()=>{if(!activityDraft){activityDraft=structuredClone(db.activities[0]);currentActivity=db.activities[0].id;}let a=normalizeActivityDraft(activityDraft);return `${topactions(names.config,'persistActivity()','cancelActivity()')}<div class="visualgrid"><div class="activitypreview"><div class="banner" ${a.background?`style="background:url('${esc(a.background)}') center/cover"`:''}><small style="color:white;text-align:left">14:00</small><p>订单兑换</p><h3>好礼兑不停</h3>${a.background?'':giftHero()}</div><div class="previewcard"><input placeholder="请输入指定店铺订单号" disabled><button class="primary" disabled>立即兑换</button><button disabled>兑换记录</button></div><div class="previewcard"><b id="previewName">${esc(a.name||'活动规则说明')}</b><p class="hint">${[a.points?'积分':'',a.coupon?'优惠券':'',a.gift?'赠品':''].filter(Boolean).join(' + ')}</p></div></div><div><section class="formsection sect" id="abasic"><h2>基本信息</h2>${formrow('活动类型',`<div class="seg activity-type-options">${activityTypeOptions.map(t=>`<button class="${a.type===t?'selected':''}" onclick="changeActivityType('${t}')">${t}</button>`).join('')}</div>`,true)}${formrow('活动名称',textinput(a,'name','输入活动名称，限50字符','text','maxlength="50"'),true)}${formrow('活动时间',`<div style="display:flex;gap:8px"><input type="datetime-local" value="${a.start||''}" onchange="activityDraft.start=this.value"><span>至</span><input type="datetime-local" value="${a.end||''}" onchange="activityDraft.end=this.value"></div>`)}${formrow('活动背景图',`${imageUploader('activityDraft','background')} <button class="link" onclick="activityDraft.background='';render()">恢复默认图</button><small>尺寸建议750×900px，适用于页面头部背景</small>`,true)}<div class="row"><label>活动规则</label><div class="wide">${editor(a,'rules')}</div></div>${formrow('兑换次数限制',`${textinput(a,'limit','0表示不限制','number','min="0" step="1"')}<small>每个用户本次活动可成功兑换的订单数，0或不填表示不限</small>`)}</section><section class="formsection sect" id="arules"><h2>规则设置</h2>${renderActivityRules(a)}</section><section class="formsection sect" i function reviewAudit(id){let x=db.audits.find(a=>a.id===id),read=x.status!=='待审核',available=store(x.store).gifts;modal.innerHTML=`<h1>${read?'审核详情':'兑换审核'}</h1><form id="reviewForm"><h2>审核信息</h2><div class="row"><label>审核结果 *</label><select name="result" ${read?'disabled':''}><option ${x.status==='通过'?'selected':''}>通过</option><option ${x.status==='驳回'?'selected':''}>驳回</option></select></div><div class="row"><label>兑换积分</label><input type="number" name="points" min="0" step="1" value="${x.points}" ${read?'disabled':''}></div><p>兑换赠品</p>${available.map(pid=>`<p><label><input type="checkbox" name="gift" value="${pid}" ${x.gift.includes(pid)?'checked':''} ${read?'disabled':''}> ${esc(prod(pid).name)} · ${esc(prod(pid).sku)} × 1（可用库存 ${prod(pid).stock}）</label></p>`).join('')}<small>只可审核订单所属店铺已配置的赠品，通过时发放领取资格。</small><p>审核意见</p><textarea name="opinion" maxlength="200" style="width:100%;height:80px" ${read?'disabled':''}>${esc(x.opinion)}</textarea><h2>提交信息</h2><p>平台 / 店铺：${store(x.store).platform} / ${esc(store(x.store).name)}</p><p>单号：${x.order}</p><p>用户：${esc(x.user)} · ${x.mobile}</p><p>申请赠品：${x.gift.map(pid=>esc(prod(pid).name)).join('、')||'无'}</p><div class="modalfooter"><button type="button" onclick="modal.close()">${read?'关闭':'取消'}</button>${read?'':'<button class="primary">提交审核</button>'}</div></form>`;reviewForm.onsubmit=e=>{e.preventDefault();let f=new FormData(reviewForm),status=f.get('result'),gifts=f.getAll('gift'),points=+f.get('points'),opinion=f.get('opinion').trim();if(status==='驳回'&&!opinion)return toast('驳回时请填写审核意见');if(!Number.isInteger(points)||points<0)return toast('积分须为非负整数');if(status==='通过'){if(db.redemptions.some(r=>r.order===x.order))return toast('订单已兑换，不能重复审核发奖');if(gifts.length>reviewActivityGiftLimit(x)||gifts.some(pid=>!prod(pid).on||prod(pid).stock<1))return toast('赠品选择超限或库存不足');if(!points&&!gifts.length)return toast('通过时至少发放一种奖励');let r={id:uid('EX'),activity:x.activity,order:x.order,store:x.store,user:x.user,uid:x.uid,source:'人工审核',tim function removeGiftSetting(i){if(!confirm('是否确认删除该赠品规格？'))return;storeDraft.rows.splice(i,1);renderGiftSettings()}
function batchGiftSettings(){let values={quantity:giftBatchQuantity.value,activityStock:giftBatchActivityStock.value};if(!storeDraft.rows.length)return toast('请先添加赠品');if(Object.values(values).every(v=>v===''))return toast('请填写批量设置内容');if(Object.entries(values).some(([k,v])=>v!==''&&(!Number.isInteger(+v)||+v<(k==='quantity'?1:0))))return toast('赠送数量须为正整数，活动数量须为非负整数');storeDraft.rows.forEach(r=>Object.entries(values).forEach(([k,v])=>{if(v!=='')r[k]=+v}));renderGiftSettings();toast('批量设置已写入明细')}

views.products=()=>{let a=filteredProducts(),rows=sliced(a);return `<div class="page-tabs">${['全部商品','已上架','已下架'].map(t=>`<button class="${!showDeletedProducts&&productTab===t?'selected':''}" onclick="setProductTab('${t}')">${t}</button>`).join('')}<button style="margin-left:auto" onclick="showDeletedProducts=!showDeletedProducts;selectedProducts.clear();query()">${showDeletedProducts?'返回商品列表':'＋ 已删除商品'}</button></div><div class="toolbar product-search">${field('商品名称','name')}${field('商品类型','type','select',['普通商品','跨境商品','直邮商品','赠品'])}${field('商品品牌','brand','select',[...new Set(db.products.map(p=>p.brand).filter(Boolean))])}${field('所属SPU','spu','select',['宝宝日常用品','品牌礼赠系列'])}${field('商品ID','id')}<button aria-label="搜索" class="searchbtn" onclick="query()">${searchIcon}</button><button onclick="more.products=!more.products;render()">${more.products?'收起搜索':'更多搜索'} <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><path d="${more.products?'m1 7 4-4 4 4':'m1 3 4 4 4-4'}"/></svg></button><div class="right"><button onclick="exportProducts()">导出</button><button onclick="importProductChanges()">导入修改</button><button class="primary" onclick="newProduct()">⊕ 新增</button></div></div>${more.products?`<div class="morefilter">${field('API商品编码','api')}${field('商品分类','category','select',[...new Set(db.products.map(p=>p.category).filter(Boolean))])}${field('创建方式','source','select',['手动创建','API对接'])}<button class="link" onclick="clearFilter()">清空</button></div>`:''}<div class="product-scroll" id="productScroll"><table class="product-grid"><colgroup>${[40,240,90,100,160,95,140,80,115,80,80,80,80,90,155,155,80,150,140].map(n=>`<col style="width:${n}px">`).join('')}</colgroup><thead><tr><th class="p-check"><input id="productSelectAll" type="checkbox" onchange="selectProductPage(this.checked)"></th>${['商品名称','SPU','品牌','分类','商品来源','发货仓','售价','API商品编码','总库存','访客数','访问量','销量','虚拟销量','创建时间','更新时间','状态','提示','操作'].map((x,i)=>`<th class="${i===0?'p-name':i===17?'p function deleteProducts(){let a=db.products.filter(p=>selectedProducts.has(p.id)&&!p.deleted);if(!a.length)return toast('请先选择商品');if(a.some(p=>p.on||db.stores.some(s=>s.gifts.includes(p.id))||db.claims.some(c=>c.product===p.id)))return toast('已上架或被店铺 / 领取资格引用的商品不可删除');if(!confirm('是否确认删除所选商品？'))return;a.forEach(p=>{p.deleted=true;p.deletedAt=stamp();productLog(p.id,'删除商品','已下架','已删除')});selectedProducts.clear();render();toast('商品已移至已删除商品')}
function restoreProduct(id){if(!confirm('确认恢复该商品？恢复后为已下架状态。'))return;let p=prod(id);p.deleted=false;p.on=false;productLog(id,'恢复商品','已删除','已下架');render()}
function batchEditProducts(){if(!selectedProducts.size)return toast('请先选择商品');modal.innerHTML=`<h1>批量修改 · 已选${selectedProducts.size}件商品</h1><form id="batchProductForm"><p>库存（留空不修改）</p><input type="number" min="0" step="1" name="stock"><p>虚拟销量（留空不修改）</p><input type="number" min="0" step="1" name="virtualSales"><div class="modalfooter"><button type="button" onclick="modal.close()">取消</button><button class="primary">保存</button></div></form>`;batchProductForm.onsubmit=e=>{e.preventDefault();let f=new FormData(batchProductForm),stock=f.get('stock'),vs=f.get('virtualSales');if(stock===''&&vs==='')return toast('请至少填写一项');if([stock,vs].some(v=>v!==''&&(!Number.isInteger(+v)||+v<0)))return toast('请输入非负整数');let a=db.products.filter(p=>selectedProducts.has(p.id)&&!p.deleted);if(stock!==''&&a.some(p=>p.skus?.length>1))return toast('多规格商品请进入编辑页逐项修改库存');a.forEach(p=>{if(stock!==''){let before=p.stock;p.stock=+stock;if(p.skus?.length)p.skus[0].stock=+stock;productLog(p.id,'批量修改库存',before,p.stock,'库存')}if(vs!=='')p.virtualSales=+vs;p.updated=stamp()});save('商品批量修改');modal.close();render();toast('修改已保存')};modal.showModal()}
function importProductChanges(){modal.innerHTML=`<h1>导入修改商品</h1><p class="hint">演示文件为CSV，商品ID用于精确匹配，库存与虚拟销量为非负整数。</p><button onclick="download('商品ID,库存,虚拟销量\\nG001,20,100','商品导入修改模板.csv')">下载模板</button><p><input id="productChangeFile" type="file" accept=".csv"></p><pre id="productImportResult"></pre><div class="modalfooter"><button onclick="modal.close()">关闭</button><button class="primary" onclick="applyProductImport()">确认导入</button></div>`;modal.showModal()}
async function applyProductImport(){let file=productChangeFile.files[0];if(!file)return toast('请选择CSV文件');let lines=(await file.text()).replace(/^\ufeff/,'').trim().split(/\r?\n/);if(lines.shift()!=='商品ID,库存,虚拟销量')return toast('请使用模板表头');let updates=[],errors=[],seen=new Set();lines.forEach((line,i)=>{let [id,stock,vs]=line.split(',').map(x=>x.trim()),p=prod(id);if(!p||p.deleted||seen.has(id)||![stock,vs].every(v=>v!==''&&/^\d+$/.test(v))||p.skus?.length>1)errors.push('第'+(i+2)+'行：商品不存在、重复、数据无效或为多规格商品');else updates.push({p,stock:+stock,vs:+vs});seen.add(id)});if(errors.length){productImportResult.textContent=errors.join('\n');return toast('请修正错误后重新导入，本次未修改数据')}updates.forEach(({p,stock,vs})=>{productLog(p.id,'导入修改库存',p.stock,stock,'库存');p.stock=stock;if(p.skus?.length)p.skus[0].stock=stock;p.virtualSales=vs;p.updated=stamp()});save('导入修改商品 '+updates.length+'条');modal.close();render();toast('导入修改成功')}

lder="元"><span>库存</span><input id="batchStock" type="number" min="0" step="1" placeholder="数量"><span>重量(kg)</span><input id="batchWeight" type="number" min="0" step="0.01" placeholder="kg"><span>限购</span><input id="batchLimit" type="number" min="0" step="1" placeholder="数量"><button onclick="batchSku()">批量填写</button></div><div class="tablewrap">${table(['规格数量','划线价（元）',(p.type==='赠品'?'成本价（元）':'成本价（元）*'),'库存*','重量（kg）*','限购'],p.skus.map((s,i)=>`<tr><td>${esc(s.name||'未填写规格')} × ${s.count||1}</td>${['line','cost','stock','weight','limit'].map(k=>`<td><input style="width:95px" type="number" min="0" step="${['stock','limit'].includes(k)?'1':'0.01'}" value="${s[k]??''}" oninput="productDraft.skus[${i}].${k}=this.value===''?'':+this.value"></td>`).join('')}</tr>`).join(''))}</div></div></div>${formrow('供应商',pselect('supplier',['自营供应商','跨境供应商']),true)}${formrow('API商品编码',textinput(p,'apiCode','50字内','text','maxlength="50"'))}${formrow('三方编码',textinput(p,'thirdCode','50字内','text','maxlength="50"'))}${formrow('批次渠道扣点比例',textinput(p,'rate','最多2位小数','number','min="0" max="100" step="0.01"'))}${formrow('商品效期',textinput(p,'shelfLife','','month'))}${formrow('虚拟销量',textinput(p,'virtualSales','正整数','number','min="0" step="1"'))}</section><section class="formsection sect" id="pservice"><h2>商品服务</h2>${formrow('商品服务',`<label><input type="checkbox" ${p.serviceReturn?'checked':''} onchange="productDraft.serviceReturn=this.checked"> 支持售后</label>　<label><input type="checkbox" ${p.serviceInvoice?'checked':''} onchange="productDraft.serviceInvoice=this.checked"> 支持开票</label>`)}${formrow('发货仓',pselect('warehouse',['自营仓','华东仓','华南仓']))}${formrow('运费模板',`<select onchange="productDraft.freightTemplate=this.value;productDraft.freight=this.value==='包邮模板'?0:6;render()"><option ${p.freightTemplate==='包邮模板'||!p.freight?'selected':''}>包邮模板</option><option ${p.freightTemplate==='标准运费模板'||p.freight?'selected':''}>标准运费模板</option></select>`,true)}${formrow('物流时效',pselect('logisticsTime',['24小时内发货','48小时内发货','72小时内发货']))}</section><section class="formsection sect" id="pimages"><h2>图文描述</h2>${formrow('主图',`${imageUploader('productDraft','image')}<small>支持PNG / JPG；1:1，建议1440×1440及以上</small>`,p.type!=='赠品')}${formrow('视频',`<label class="upload"><span>＋</span>${esc(p.video||'上传视频')}<input hidden type="file" accept="video/*" onchange="productDraft.video=this.files[0]?.name||'';render()"></label>`)}<div class="row"><label>详情图文</label><div class="wide">${editor(p,'description')}</div></div></section><section class="formsection sect" id="ppublish"><h2>发布设置</h2>${formrow('发布设置',`<label><input type="radio" name="publishState" ${p.on?'checked':''} onchange="productDraft.on=true"> 立即上架</label>　<label><input type="radio" name="publishState" ${!p.on?'checked':''} onchange="productDraft.on=false"> 暂不上架</label>`,true)}${formrow('定时下架',textinput(p,'scheduled','','datetime-local'))}</section></div>${anchor([['pbasic','基本信息'],['pstock','价格库存'],['pservice','商品服务'],['pimages','图文描述'],['ppublish','发布设置']])}</div>`}
function addSku(){productDraft.skus.push({name:'',count:1,cost:'',line:'',price:'',stock:'',weight:'',limit:''});render()}function removeSku(i){if(productDraft.skus.length===1)return toast('至少保留一个规格');productDraft.skus.splice(i,1);render()}
function batchSku(){let inputs={line:batchLine.value,cost:batchCost.value,stock:batchStock.value,weight:batchWeight.value,limit:batchLimit.value};if(Object.values(inputs).every(v=>v===''))return toast('请填写批量设置值');if(Object.entries(inputs).some(([k,v])=>v!==''&&(!Number.isFinite(+v)||+v<0||(['stock','limit'].includes(k)&&!Number.isInteger(+v)))))return toast('划线价、成本价和重量须为非负数，库存和限购须为非负整数');productDraft.skus.forEach(s=>Object.entries(inputs).forEach(([k,v])=>{if(v!=='')s[k]=+v}));render();toast('已批量填写划线价、成本价、库存、重量和限购')}

function cancelProduct(){if(!productReadOnly&&!confirm('确认离开？当前修改将不会保存。'))return;go('products')}
function persistProduct(){let p=productDraft;if(!p.name?.trim()||!p.category||!p.brand||!p.supplier)return toast('请填写商品名称、分类、品牌与供应商');if(p.type!=='赠品'&&!p.image)return toast('请上传商品主图');if(p.skus.some(s=>!s.name.trim()||['cost','stock','weight'].some(k=>{let empty=s[k]===''||s[k]==null;if(k==='cost'&&p.type==='赠品'&&empty)return false;return empty||!Number.isFinite(+s[k])||+s[k]<0})||!Number.isInteger(+s.stock)||(s.limit!==''&&s.limit!=null&&(!Number.isInteger(+s.limit)||+s.limit<0))))return toast(p.type==='赠品'?'请填写规格、整数库存、重量和有效限购；成本价选填，填写时须为非负数':'请填写规格及非负成本价、整数库存、重量和有效限购');let v=structuredClone(p);v.id=p.id||uid('G');v.sku=v.skus.map(s=>s.name).join(' / ');v.price=v.type==='赠品'?0:(Number(v.skus[0].price)||0);v.stock=v.skus.reduce((n,s)=>n+Number(s.stock),0);v.updated=stamp();if(v.id&&prod(v.id))Object.assign(prod(v.id),v);else{v.created=stamp();db.products.unshift(v)}save('保存商品 '+v.id);go('products');toast('商品已保存，可在店铺赠品设置中选择')}

views.admindetail=()=>{let o=db.giftorders.find(x=>x.id===detailId)||normalOrders.find(x=>x.id===detailId);if(!o)return '<h1>订单详情</h1><div class="empty">订单不存在</div>';let gift=!!o.claims,ps=gift?o.claims.map(id=>prod(db.claims.find(c=>c.id===id).product)):[prod(o.product)];return `<div class="topactions"><button class="link" onclick="go('adminorders')">‹ 订单详情</button><span>${gift&&o.status==='待发货'?`<button class="primary" onclick="shipGiftOrder('${o.id}')">发货</button>`:''}</span></div><section class="formsection"><h2>订单信息</h2><p>订单编号：${o.id}　<span class="tag gift">${gift?'赠品订单':o.type}</span>　${o.status}</p><p>创建时间：${o.time||'2026-10-14 16:08:00'}</p>${gift?`<p>来源兑换订单：${o.claims.map(id=>db.claims.find(c=>c.id===id).sourceOrder).join('、')}</p>`:''}<h2>收货信息</h2><p>${esc(o.name)}　${o.mobile.slice(0,3)}****${o.mobile.slice(-4)}</p><p>${esc(o.address||'上海市徐汇区品牌路100号')}</p><h2>商品信息</h2>${table(['商品','规格','数量','售价','赠品优惠','商品实付'],ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td>${gift?1:o.quantity}</td><td>${money(p.price)}</td><td>${gift?money(p.price):'—'}</td><td>${gift?'¥0.00':money(p.price*o.quantity)}</td></tr>`).join(''))}${gift?`<p>运费：${money(o.freight)}　订单应付：${money(o.freight)}</p><small>领取资格：${o.claims.join('、')}</small>`:''}${o.tracking?`<h2>物流信息</h2><p>${esc(o.tracking)}</p>`:''}</section>`}
function shipGiftOrder(id){modal.innerHTML=`<h1>赠品订单发货</h1><form id="shippingForm"><p>物流公司与单号 *</p><input name="tracking" required placeholder="物流公司 / 运单号"><div class="modalfooter"><button type="button" onclick="modal.close()">取消</button><button class="primary">确认发货</button></div></form>`;shippingForm.onsubmit=e=>{e.preventDefault();let o=db.giftorders.find(x=>x.id===id);o.tracking=new FormData(shippingForm).get('tracking');o.status='待收货';o.shippedAt=stamp();save('发货 '+id);modal.close();render();toast('发货成功，用户订单已同步')};modal.showModal()}

function whiteLog(action,detail){db.whiteLogs??=[];db.whiteLogs.unshift({id:uid('WL'),time:stamp(),operator:'运营管理员',action,detail});save('订单白名单 '+action+' '+detail)}
function downloadTemplate(){let bytes=Uint8Array.from(atob(whiteTemplateBase64),c=>c.charCodeAt(0)),u=URL.createObjectURL(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})),a=document.createElement('a');a.href=u;a.download='订单白名单导入模板.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);whiteLog('下载模板','订单维度、商品维度')}
function whiteOrderRows(){let f=filters.import||{};return [...db.orders].reverse().filter(o=>o.source==='后台导入'&&!o.whiteRemoved&&o.valid!==false&&matches(o.id,f.order)&&(!f.exchange||(f.exchange==='已兑换'?o.used:!o.used)))}
views.import=()=>`<h1><button class="link" onclick="go('activities')">‹</button> 订单白名单</h1><div class="toolbar">${field('订单号','order')}${field('兑换状态','exchange','select',['未兑换','已兑换'])}<button aria-label="搜索" class="searchbtn" onclick="query()">${searchIcon}</button><button class="link" onclick="clearFilter()">清空</button><div class="right"><button onclick="whiteOperationLogs()">操作日志</button><button onclick="downloadTemplate()">下载模板</button><button class="primary" onclick="document.getElementById('whitefile').click()">导入订单</button><input id="whitefile" type="file" accept=".xlsx" hidden onchange="readOrders(this.files[0]);this.value=''"></div></div><div id="preview">${previewResult}</div><div id="orderTable">${whiteRows()}</div>`;
function whiteRows(){let a=whiteOrderRows();return frameTable(['订单号','平台 / 店铺','订单金额','订单完成时间','订单商品','兑换状态','操作'],sliced(a).map(o=>`<tr><td>${esc(o.id)}</td><td><span class="tag">${esc(store(o.store)?.platform||o.platform||'—')}</span> ${esc(store(o.store)?.name||o.store)}</td><td>${money(o.amount)}</td><td>${esc(o.completed)}</td><td><button class="link" onclick="whiteOrderProducts('${o.id}','${o.store}')">${o.items?.length||0} 个商品</button></td><td>${o.used?'已兑换':'未兑换'}</td><td><button class="link" onclick="removeWhitelistOrder('${o.id}','${o.store}')">移除白名单</button></td></tr>`).join(''),a)}
function whiteOrderProducts(id,sid){let o=db.orders.find(o=>o.id===id&&o.store===sid&&o.source==='后台导入'&&!o.whiteRemoved);if(!o)return toast('该白名单订单已移除');modal.innerHTML=`<div class="gift-modal-head"><h1>订单商品 · ${esc(id)}</h1><button class="link" onclick="modal.close()">×</button></div>${table(['商品 ID','商品名称','下单数量'],(o.items||[]).map(p=>`<tr><td>${esc(p.productId)}</td><td>${esc(p.name)}</td><td>${p.quantity}</td></tr>`).join(''))}<div class="modalfooter"><button onclick="modal.close()">关闭</button></div>`;modal.showModal()}
function removeWhitelistOrder(id,sid){if(!confirm('是否确认移除白名单？移除后该订单不再作为白名单兑换依据，已发放奖励不受影响。'))return;let o=db.orders.find(o=>o.id===id&&o.store===sid&&o.source==='后台导入'&&!o.whiteRemoved);if(!o)return toast('该订单已移除');o.whiteRemoved=true;o.removedAt=stamp();o.valid=false;whiteLog('移除白名单',store(sid).platform+' / '+store(sid).name+' / '+id);render();toast('已移除白名单')}

async function readOrders(file){if(!file||whiteImportBusy)return;whiteImportBusy=true;pending=[];whiteImportErrors=[];whiteImportFile=file.name;previewResult='<div class="notice">正在校验Excel文件，请稍候…</div>';render();try{if(!/\.xlsx$/i.test(file.name))throw Error('请选择.xlsx格式的Excel文件');if(file.size>10485760)throw Error('文件超过10MB');let wb=await whiteReadWorkbook(file),orders=wb.sheets[0],products=wb.sheets[1],norm=s=>String(s||'').replace(/\s/g,'');for(let [sheet,headers] of [[orders,['平台','店铺ID','订单号','订单完成时间','订单金额']],[products,['订单号','商品 ID','商品名称','下单数量']]]){let actual=[...(sheet.rows[0]?.values||[])];while(actual.length&&!norm(actual.at(-1)))actual.pop();if(actual.length!==headers.length||headers.some((h,i)=>norm(actual[i])!==norm(h)))throw Error(sheet.name+'表头不匹配：应为【'+headers.join('、')+'】，实际为【'+actual.map(v=>String(v||'').trim()||'空白').join('、')+'】')}let orderRows=orders.rows.slice(1),productRows=products.rows.slice(1);if(orderRows.length>5000||productRows.length>20000)throw Error('单次最多导入5000个订单、20000条商品明细');if(!orderRows.length)throw Error('订单维度工作表暂无订单');let records=new Map(),invalid=new Set(),seen=new Set(),dups=0;let error=(sheet,row,reason,id)=>{whiteImportErrors.push({sheet,row,reason});if(id)invalid.add(id)};

function memberCheckoutDraft(){let key=claimSelection.join('|');if(!giftCheckoutDraft||giftCheckoutDraft.key!==key){let prev=db.memberAddress||db.giftorders.find(o=>o.name&&o.mobile&&o.address)||{};giftCheckoutDraft={key,name:prev.name||'',mobile:prev.mobile||'',address:prev.address||'',note:'',agreed:false,quantities:Object.fromEntries(claimSelection.map(id=>[id,Math.max(1,Number(db.claims.find(c=>c.id===id)?.quantity)||1)]))}}return giftCheckoutDraft}

function memberCheckoutFreight(){return memberCheckoutClaims().reduce((sum,c)=>sum+(Number(prod(c.product).freight)||0),0)}

'请填写正整数积分');if(kind==='赠品'&&(!gifts.length||gifts.length>reviewActivityGiftLimit(x)||gifts.some(pid=>!available.includes(pid)||!prod(pid).on||prod(pid).stock<1)))return toast('请选择有效赠品，数量不能超限且库存须充足');let activity=db.activities.find(a=>a.id===x.activity),r={id:uid('EX'),auditId:x.id,activity:x.activity,activityName:activity?.name,activityType:activity?.type,order:x.order,store:x.store,user:x.user,uid:x.uid,source:'人工审核',time:stamp(),points:kind==='积分'?points:0,pointsValue:kind==='积分'?points:0,coupon:false,claims:[],reward:kind==='积分'?points+'积分':gifts.length+'件赠品'};gifts.forEach(pid=>{let p=prod(pid),c={id:uid('CL'),auditId:x.id,product:pid,skuIndex:0,quantity:1,sourceOrder:x.order,user:x.uid,expires:giftExpiry(activity?.days??db.config.days),order:null};p.stock--;if(p.skus?.[0])p.skus[0].stock=Math.max(0,Number(p.skus[0].stock)-1);db.claims.push(c);r.claims.push(c.id)});db.redemptions.unshift(r);let o=db.orders.find(o=>o.id===x.order);if(o)o.used=true;restorePendingGiftSelections()}Object.assign(x,{status,rewardType:kind,gift:gifts,points,opinion,reviewed:stamp()});save('审核 '+id+'：'+status);modal.close();render();toast('审核完成，奖励状态已更新')};modal.showModal()};
