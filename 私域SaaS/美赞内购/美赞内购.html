const builtInMd=`# 1. 业务背景

## 1.1 需求描述

为了让具备医生身份的用户享受内购价，本期建立医生身份认证体系。用户在微信小程序提交认证资料，运营人员在私域运营平台审核；审核通过后，系统将用户特征“是否医生”更新为“是”，并自动给用户打上系统标签“医生”。运营人员可在标签和用户群中使用“是否医生”圈选人群，供后续内购活动价配置使用。

## 1.2 用户角色

- 普通用户：查看认证入口、提交资料、查看审核进度和结果、驳回后重新提交。
- 已认证医生：在个人中心展示医生身份标识，可被医生标签和医生用户群命中。
- 运营人员：查看认证状态、审核资料、通过或驳回申请、查看审核记录。

## 1.3 目标结果

- 建立“用户提交 → 运营审核 → 身份生效 → 标签/用户群圈选”的完整闭环。
- 医生身份只有一个可信来源：最新一次审核通过的认证记录。
- 小程序与运营后台共享同一认证状态和审核记录。

## 1.4 本期范围

- 用户管理列表与详情：医生字段、认证状态、资料审核和审核记录。
- 标签与用户群：用户特征新增“是否医生”。
- 系统配置 / 业务配置：在宝宝信息配置下新增身份认证配置，支持身份认证开关与填写跳转页面类型。
- 小程序个人信息、医生认证：进度、结果、身份标识和重新提交。

## 1.5 本期不做

- 不实现内购活动创建、商品选品和内购价配置页面。
- 不对接第三方医生资质数据库，不做自动验真。
- 不支持一个用户同时拥有多个医生认证主体。
- 不支持用户主动撤销已通过的医生身份。
- 不实现站外通知。

# 2. 关键业务规则

## 2.1 认证状态定义

- 未认证：是否医生=否；用户可提交认证。
- 待审核：是否医生=否；用户展示审核状态并可修改资料重新提交，运营可通过或驳回。
- 已认证：是否医生=是；用户展示医生标识，运营只读查看记录。
- 已驳回：是否医生=否；用户查看原因并可重新提交。

## 2.2 唯一性 / 并发性

- 同一用户同一时间仅允许一条“待审核”申请。
- 待审核不可重复提交；运营审核前校验记录仍为待审核。
- 驳回后重新提交生成新记录，不覆盖历史记录。

## 2.3 字段定义

- 真实姓名：必填，2-20 个字符。
- 联系手机号：默认带入并脱敏展示，不可修改。
- 执业医院：必填，2-50 个字符。
- 所在科室：必填，从预设科室中选择。
- 医生职称：必填，医师 / 主治医师 / 副主任医师 / 主任医师。
- 医师资格证书编号：必填，6-30 位数字或字母。
- 医师资格证书照片、医师执业证书照片：各 1 张，JPG/PNG，单张不超过 10MB。
- 补充说明：选填，0-200 个字符。
- 驳回原因：驳回时必填，1-200 个字符，用户端可见。

## 2.4 关键联动逻辑

- 审核通过 → 已认证 → 是否医生=是 → 自动添加系统标签“医生” → 命中医生自动标签和用户群。
- 审核驳回 → 已驳回 → 是否医生保持否 → 不添加医生标签 → 用户端展示原因和重新提交。
- “是否医生”为系统只读特征，不允许手工、导入或普通资料编辑修改。

## 2.5 标签规则

- 系统内置标签“医生”，规则固定为“用户特征 / 是否医生 / 等于 / 是”。
- 系统标签不可删除或修改规则，可查看命中人数。
- 自动标签新增“是否医生=是/否”条件，身份变化后自动刷新。

## 2.6 用户群规则

- 用户群新增“是否医生=是/否”，可与其他条件按全部满足或任一满足组合。
- 保存前计算预计人数；身份变化后用户群人数自动更新。

## 2.7 异常与权限

- 图片或提交失败时保留已填信息并允许重试。
- 已处理记录不可重复审核；资料缺失时禁止审核。
- 用户仅能查看和提交本人资料；有审核权限的运营人员可审核。
- 审核记录包含审核人、审核时间、结果与意见，不允许编辑或删除。

# 3. 页面说明

## 3.1 用户管理列表

- 搜索区补充会员ID、手机号、用户昵称、用户性别、当前阶段、注册时间、标签、客户人群、最后消费时间、积分余额、来源渠道、邀请渠道、企微ID等字段。
- 列表补充用户手机号、性别、生日、当前阶段、来源渠道、邀请渠道、邀请人、注册时间、上次消费时间、三方编码、是否医生、身份认证等字段。
- 身份认证状态为“未认证、待审核、已驳回、已认证”；待审核、已驳回用户展示审核操作。
- 支持搜索、筛选、清空、分页、全选、批量添加标签、刷新和导出，均作用于页面真实模拟数据。

## 3.2 用户详情

- 展示是否医生、认证状态、医生资料、证书图片、补充说明。
- 待审核时支持通过或驳回；驳回原因必填。
- 审核记录展示记录ID、提交时间、结果、审核人、审核时间、意见。

## 3.3 标签列表与配置

- 列表展示系统标签“医生”及动态人数。
- 自动标签配置的用户特征增加“是否医生”，可配置等于是/否。

## 3.4 用户群列表与配置

- 列表展示“医生内购人群”及动态人数。
- 用户群配置的用户特征增加“是否医生”，条件区和预计人数实时联动。

## 3.5 系统配置 / 业务配置

- 在宝宝信息配置下新增身份认证配置。
- 身份认证支持开启、关闭；开启时展示填写跳转配置，关闭时隐藏填写跳转配置。
- 填写跳转仅在身份认证开启时展示，非必填，支持装修页、固定页面、品牌、后台分类、指定商品、我的小程序、其他小程序、H5链接、弹窗、视频号、优惠券礼包、商品分组、抽奖码抽奖。
- 填写跳转不展示右侧注释文案。
- 身份认证配置不展示小程序展示或小程序预览配置项；字段、控件和备注保持同一行且不换行。
- 默认选择固定页面，配置保存后持久化；开启身份认证时按所选页面执行跳转。

## 3.6 微信小程序

- 个人中心页已移除；已认证用户的医生标识在个人信息页展示。
- 个人信息：按新版浅紫头部与孕期/宝宝信息卡片布局展示；认证入口是否显示及跳转方式由业务配置控制。
- 医生认证：填写页参考宝宝档案样式，使用浅灰背景、白色信息卡片和左右对齐字段行；支持首次提交、待审核、已认证、已驳回和重新提交。

# 4. 状态与异常

## 4.1 页面默认态

- 用户管理默认全部；标签和用户群默认“全部满足”；小程序按登录用户状态展示。

## 4.2 空态

- 搜索无结果给出调整筛选提示；无审核记录展示空态；预计人数允许为 0。

## 4.3 状态流转

- 未认证 → 待审核：用户提交完整资料。
- 已驳回 → 待审核：用户修改并重新提交。
- 待审核 → 待审核：用户修改资料并重新提交，更新提交时间。
- 待审核 → 已认证：运营通过。
- 待审核 → 已驳回：运营填写原因并驳回。

# 5. 验收要点

- 小程序提交后，后台同一用户立即变为待审核并可查看资料。
- 通过后，小程序医生标识、是否医生、医生标签和医生人群人数同步更新。
- 驳回后，小程序展示原因并允许重新提交，是否医生仍为否。
- 通过/驳回均生成审核记录，重复审核被阻止。
- 页面刷新后，认证状态、记录、标签人数和人群人数仍保留。`;
